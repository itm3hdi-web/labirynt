   ACCUEIL
===================================================== */

<script>

    },

        nickname:
            "اكتب اسمك",

        play:
            "لعب",

        level:

        score:
            "النقاط",

        player:
            "اللاعب",

        playerSpeed:
            "سرعة اللاعب",

        robotSpeed:
            "سرعة الروبوتات",

        restart:
            "إعادة المستوى",

        winner:

        winnerText:
            "لقد أنهيت جميع المستويات الـ23! النقاط:",

        loser:
            "خسرت 😈",

        wall:

        robot:
            "🤖 لقد لمسك روبوت!",

};


let currentLanguage = "fr";

let nickname = "";


/* =====================================================
   ELEMENTS
===================================================== */

const homeScreen =
    document.getElementById("homeScreen");

const gameScreen =
    document.getElementById("gameScreen");

const nicknameInput =
    document.getElementById("nickname");

const playButton =
    document.getElementById("playButton");

const errorMessage =

const homeTitle =
    document.getElementById("homeTitle");

const homeWelcome =
    document.getElementById("homeWelcome");

const playerName =
    document.getElementById("playerName");

const message =
    document.getElementById("message");

const messageTitle =
    document.getElementById("messageTitle");

const messageText =
    document.getElementById("messageText");

const restartButton =
    document.getElementById("restartButton");



/* =====================================================
   LANGUE
===================================================== */

function setLanguage(language) {

    currentLanguage = language;

    const t = translations[language];

    document.documentElement.lang =
        language;


    homeTitle.textContent =
        t.title;

    homeWelcome.textContent =
        t.welcome;

    nicknameInput.placeholder =
        t.nickname;

    playButton.textContent =
        t.play;

    document.getElementById("levelLabel").textContent =
        t.level;

    document.getElementById("scoreLabel").textContent =
        t.score;

    document.getElementById("playerLabel").textContent =
        t.player;

    document.getElementById("playerSpeedLabel").textContent =
        t.playerSpeed;

    document.getElementById("robotSpeedLabel").textContent =
        t.robotSpeed;

    restartButton.textContent =
        t.restart;


    if(language === "ar") {

        nicknameInput.dir = "rtl";

        homeBoxDirection(true);

    }

    else {

        nicknameInput.dir = "auto";

        homeBoxDirection(false);

    }


    document.querySelectorAll(".languageButton")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.lang === language
            );

        });


    errorMessage.textContent = "";

    updateInterface();

}


function homeBoxDirection(arabic) {

    const box =
        document.querySelector(".homeBox");

    if(arabic) {

        box.style.direction = "rtl";

    }

    else {

        box.style.direction = "ltr";

    }

}


document.querySelectorAll(".languageButton")
    .forEach(button => {

        button.addEventListener("click", function() {

            setLanguage(
                this.dataset.lang
            );

        });

    });



/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const levelText =
    document.getElementById("level");

const scoreText =
    document.getElementById("score");

const playerSpeedText =
    document.getElementById("playerSpeed");

const robotSpeedText =
    document.getElementById("robotSpeed");



/* =====================================================
   VARIABLES
===================================================== */

let level = 1;

const MAX_LEVEL = 23;

let score = 0;

let gameRunning = false;

let walls = [];

let robots = [];

let exit = {

    x: 0,

    y: 0,

    size: 18

};



/* =====================================================
   JOUEUR
===================================================== */

const player = {

    x: 0,

    y: 0,

    size: 12,

    speed: 6

};



/* =====================================================
   TOUCHES
===================================================== */

const keys = {};


/*
   IMPORTANT :

   On utilise e.code au lieu de seulement e.key.

   Cela permet de gérer correctement :

   AZERTY
   QWERTY
   ZQSD
   WASD
   flèches

   Et surtout, le clavier du pseudo
   n'est PAS bloqué.
*/

document.addEventListener("keydown", function(e) {


    /*
       Si l'utilisateur écrit dans le pseudo,
       on ne touche absolument pas à la touche.
    */

    if(
        document.activeElement === nicknameInput
    ) {

        return;

    }


    if(!gameRunning) {

        return;

    }


    switch(e.code) {

        case "ArrowUp":
        case "KeyW":
        case "KeyZ":
            keys.up = true;
            e.preventDefault();
            break;


        case "ArrowDown":
        case "KeyS":
            keys.down = true;
            e.preventDefault();
            break;


        case "ArrowLeft":
        case "KeyA":
        case "KeyQ":
            keys.left = true;
            e.preventDefault();
            break;


        case "ArrowRight":
        case "KeyD":
            keys.right = true;
            e.preventDefault();
            break;

    }

});


document.addEventListener("keyup", function(e) {

    switch(e.code) {

        case "ArrowUp":
        case "KeyW":
        case "KeyZ":
            keys.up = false;
            break;


        case "ArrowDown":
        case "KeyS":
            keys.down = false;
            break;


        case "ArrowLeft":
        case "KeyA":
        case "KeyQ":
            keys.left = false;
            break;


        case "ArrowRight":
        case "KeyD":
            keys.right = false;
            break;

    }

});


/* =====================================================
   GENERATEUR ALEATOIRE
===================================================== */

function randomGenerator(seed) {

    let value = seed;

    return function() {

        value =
            (value * 9301 + 49297)
            % 233280;

        return value / 233280;

    };

}



/* =====================================================
   GENERATION DU LABYRINTHE
===================================================== */

function generateMaze(levelNumber) {

    walls = [];

    /*
       DIFFICULTE PROGRESSIVE

       Niveau 1 :
       8 x 5

       Niveau 2 :
       9 x 5

       Niveau 3 :
       10 x 6

       ...

       Niveaux 19-23 :
       très grands labyrinthes.
    */

    const cols =
        Math.min(
            8 + Math.floor((levelNumber - 1) * 0.95),
            30
        );


    const rows =
        Math.min(
            5 + Math.floor((levelNumber - 1) * 0.65),
            20
        );


    const cellW =
        canvas.width / cols;

    const cellH =
        canvas.height / rows;


    const random =
        randomGenerator(
            levelNumber * 98431 + 17
        );


    let cells = [];


    for(let y = 0; y < rows; y++) {

        cells[y] = [];

        for(let x = 0; x < cols; x++) {

            cells[y][x] = {

                visited: false,

                walls: {

                    top: true,

                    right: true,

                    bottom: true,

                    left: true

                }

            };

        }

    }


    /*
       DFS
    */

    let stack = [];


    cells[0][0].visited = true;

    stack.push({

        x: 0,

        y: 0

    });


    while(stack.length > 0) {

        const current =
            stack[stack.length - 1];


        let neighbours = [];


        if(
            current.y > 0 &&
            !cells[current.y - 1][current.x].visited
        ) {

            neighbours.push({

                x: current.x,

                y: current.y - 1,

                direction: "top"

            });

        }


        if(
            current.x < cols - 1 &&
            !cells[current.y][current.x + 1].visited
        ) {

            neighbours.push({

                x: current.x + 1,

                y: current.y,

                direction: "right"

            });

        }


        if(
            current.y < rows - 1 &&
            !cells[current.y + 1][current.x].visited
        ) {

            neighbours.push({

                x: current.x,

                y: current.y + 1,

                direction: "bottom"

            });

        }


        if(
            current.x > 0 &&
            !cells[current.y][current.x - 1].visited
        ) {

            neighbours.push({

                x: current.x - 1,

                y: current.y,

                direction: "left"

            });

        }


        if(neighbours.length > 0) {

            const next =
                neighbours[
                    Math.floor(
                        random() *
                        neighbours.length
                    )
                ];


            const currentCell =
                cells[current.y][current.x];


            const nextCell =
                cells[next.y][next.x];


            if(next.direction === "top") {

                currentCell.walls.top = false;

                nextCell.walls.bottom = false;

            }


            if(next.direction === "right") {

                currentCell.walls.right = false;

                nextCell.walls.left = false;

            }


            if(next.direction === "bottom") {

                currentCell.walls.bottom = false;

                nextCell.walls.top = false;

            }


            if(next.direction === "left") {

                currentCell.walls.left = false;

                nextCell.walls.right = false;

            }


            nextCell.visited = true;


            stack.push({

                x: next.x,

                y: next.y

            });

        }

        else {

            stack.pop();

        }

    }


    /*
       Murs.

       Plus le niveau avance,
       plus les murs deviennent fins.
    */

    const wallThickness =
        Math.max(
            3,
            7 - levelNumber * 0.12
        );


    for(let y = 0; y < rows; y++) {

        for(let x = 0; x < cols; x++) {

            const cell =
                cells[y][x];


            const px =
                x * cellW;

            const py =
                y * cellH;


            if(cell.walls.top) {

                walls.push({

                    x: px,

                    y: py,

                    w: cellW + wallThickness,

                    h: wallThickness

                });

            }


            if(cell.walls.left) {

                walls.push({

                    x: px,

                    y: py,

                    w: wallThickness,

                    h: cellH + wallThickness

                });

            }


            if(
                x === cols - 1 &&
                cell.walls.right
            ) {

                walls.push({

                    x: px + cellW,

                    y: py,

                    w: wallThickness,

                    h: cellH

                });

            }


            if(
                y === rows - 1 &&
                cell.walls.bottom
            ) {

                walls.push({

                    x: px,

                    y: py + cellH,

                    w: cellW,

                    h: wallThickness

                });

            }

        }

    }


    /*
       DEPART
    */

    player.x =
        cellW * 0.25;

    player.y =
        cellH * 0.25;


    /*
       SORTIE
    */

    exit.x =
        (cols - 1) * cellW +
        cellW * 0.35;


    exit.y =
        (rows - 1) * cellH +
        cellH * 0.35;


    exit.size =
        Math.max(
            12,
            Math.min(cellW, cellH) * 0.30
        );


    /*
       ROBOTS

       On évite les robots aux premiers niveaux.
       La difficulté arrive progressivement.
    */

    robots = [];


    let robotCount = 0;


    if(levelNumber >= 4) {

        robotCount =
            1 +
            Math.floor(
                (levelNumber - 4) / 2
            );

    }


    robotCount =
        Math.min(
            robotCount,
            10
        );


    const robotSpeed =
        levelNumber < 4

        ? 0

        : Math.min(
            0.8 +
            (levelNumber - 4) * 0.12,
            3.2
        );


    for(
        let i = 0;
        i < robotCount;
        i++
    ) {


        let rx =
            cellW *
            (
                2 +
                Math.floor(
                    random() *
                    Math.max(
                        1,
                        cols - 4
                    )
                )
            );


        let ry =
            cellH *
            (
                1 +
                Math.floor(
                    random() *
                    Math.max(
                        1,
                        rows - 3
                    )
                )
            );


        robots.push({

            x: rx,

            y: ry,

            size:
                Math.max(
                    10,
                    Math.min(
                        cellW,
                        cellH
                    ) * 0.30
                ),

            speed: robotSpeed,

            direction:
                random() > .5
                ? 1
                : -1,

            horizontal:
                random() > .5

        });

    }

}



/* =====================================================
   COLLISION
===================================================== */

function isColliding(a, b) {

    return (

        a.x < b.x + b.w &&

        a.x + a.size > b.x &&

        a.y < b.y + b.h &&

        a.y + a.size > b.y

    );

}



/* =====================================================
   DEPLACEMENT
===================================================== */

function movePlayer() {

    if(!gameRunning) {

        return;

    }


    let dx = 0;

    let dy = 0;


    if(keys.right) {

        dx += player.speed;

    }


    if(keys.left) {

        dx -= player.speed;

    }


    if(keys.down) {

        dy += player.speed;

    }


    if(keys.up) {

        dy -= player.speed;

    }


    if(dx === 0 && dy === 0) {

        return;

    }


    /*
       On traite X puis Y séparément.

       Cela rend le déplacement beaucoup
       plus propre contre les murs.
    */

    const oldX =
        player.x;

    const oldY =
        player.y;


    player.x += dx;


    let hitWallX = false;


    for(let wall of walls) {

        if(
            isColliding(
                player,
                wall
            )
        ) {

            hitWallX = true;

            break;

        }

    }


    if(hitWallX) {

        player.x = oldX;

        lose(
            translations[currentLanguage].wall
        );

        return;

    }


    player.y += dy;


    let hitWallY = false;


    for(let wall of walls) {

        if(
            isColliding(
                player,
                wall
            )
        ) {

            hitWallY = true;

            break;

        }

    }


    if(hitWallY) {

        player.y = oldY;

        lose(
            translations[currentLanguage].wall
        );

        return;

    }

}



/* =====================================================
   ROBOTS
===================================================== */

function updateRobots() {

    if(!gameRunning) {

        return;

    }


    for(let robot of robots) {


        if(robot.horizontal) {

            robot.x +=
                robot.direction *
                robot.speed;


            if(
                robot.x < 20 ||
                robot.x >
                canvas.width -
                robot.size -
                20
            ) {

                robot.direction *= -1;

            }

        }

        else {

            robot.y +=
                robot.direction *
                robot.speed;


            if(
                robot.y < 20 ||
                robot.y >
                canvas.height -
                robot.size -
                20
            ) {

                robot.direction *= -1;

            }

        }


        const r = {

            x: robot.x,

            y: robot.y,

            w: robot.size,

            h: robot.size

        };


        if(
            isColliding(
                player,
                r
            )
        ) {

            lose(
                translations[currentLanguage].robot
            );

            return;

        }

    }

}



/* =====================================================
   SORTIE
===================================================== */

function checkExit() {

    if(!gameRunning) {

        return;

    }


    const e = {

        x: exit.x,

        y: exit.y,

        w: exit.size,

        h: exit.size

    };


    if(
        isColliding(
            player,
            e
        )
    ) {

        levelComplete();

    }

}



/* =====================================================
   NIVEAU TERMINE
===================================================== */

function levelComplete() {

    const gain =
        Math.max(
            1,
            5 -
            Math.floor(
                (level - 1) / 5
            )
        );


    score += gain;


    if(level >= MAX_LEVEL) {

        winGame();

        return;

    }


    level++;

    loadLevel();

}



/* =====================================================
   MORT
===================================================== */

function lose(reason) {

    if(!gameRunning) {

        return;

    }


    const penalty =
        Math.min(
            6,
            2 +
            Math.floor(
                level / 5
            )
        );


    score -= penalty;


    if(score < 0) {

        score = 0;

    }


    gameRunning = false;


    messageTitle.textContent =
        translations[currentLanguage].loser;


    messageText.textContent =
        reason +
        "  -" +
        penalty +
        " points";


    message.style.display =
        "flex";


    updateInterface();

}



/* =====================================================
   RECOMMENCER
===================================================== */

function restartLevel() {

    message.style.display =
        "none";


    /*
       On remet les touches à zéro
       pour éviter qu'une touche reste bloquée.
    */

    keys.up = false;
    keys.down = false;
    keys.left = false;
    keys.right = false;


    gameRunning = true;


    loadLevel();

}


restartButton.addEventListener(
    "click",
    restartLevel
);



/* =====================================================
   VICTOIRE
===================================================== */

function winGame() {

    gameRunning = false;


    const t =
        translations[currentLanguage];


    messageTitle.textContent =
        t.winner;


    messageText.textContent =
        t.winnerText +
        " " +
        score;


    message.style.display =
        "flex";

}



/* =====================================================
   INTERFACE
===================================================== */

function updateInterface() {

    levelText.textContent =
        level;


    scoreText.textContent =
        score;


    playerSpeedText.textContent =
        player.speed;


    const speed =
        level < 4

        ? 0

        : Math.min(
            0.8 +
            (level - 4) * 0.12,
            3.2
        );


    robotSpeedText.textContent =
        speed.toFixed(1);


    playerName.textContent =
        nickname;

}



/* =====================================================
   DESSIN
===================================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       FOND
    */

    ctx.fillStyle =
        "#222";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Petits points décoratifs
    */

    ctx.fillStyle =
        "rgba(255,255,255,.025)";


    for(
        let x = 0;
        x < canvas.width;
        x += 30
    ) {

        for(
            let y = 0;
            y < canvas.height;
            y += 30
        ) {

            ctx.fillRect(
                x,
                y,
                2,
                2
            );

        }

    }


    /*
       MURS
    */

    ctx.fillStyle =
        "#eeeeee";


    for(let wall of walls) {

        ctx.fillRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

    }


    /*
       SORTIE
    */

    ctx.fillStyle =
        "#00ff66";


    ctx.shadowColor =
        "#00ff66";

    ctx.shadowBlur =
        15;


    ctx.fillRect(
        exit.x,
        exit.y,
        exit.size,
        exit.size
    );


    ctx.shadowBlur = 0;


    /*
       ROBOTS
    */

    for(let robot of robots) {

        ctx.fillStyle =
            "#ff3030";


        ctx.shadowColor =
            "#ff3030";

        ctx.shadowBlur =
            10;


        ctx.fillRect(
            robot.x,
            robot.y,
            robot.size,
            robot.size
        );


        ctx.shadowBlur = 0;


        /*
           Yeux
        */

        ctx.fillStyle =
            "white";


        const eyeSize =
            Math.max(
                2,
                robot.size * .18
            );


        ctx.fillRect(

            robot.x +
            robot.size * .20,

            robot.y +
            robot.size * .20,

            eyeSize,
            eyeSize

        );


        ctx.fillRect(

            robot.x +
            robot.size * .62,

            robot.y +
            robot.size * .20,

            eyeSize,
            eyeSize

        );

    }


    /*
       JOUEUR
    */

    ctx.fillStyle =
        "#3498ff";


    ctx.shadowColor =
        "#3498ff";

    ctx.shadowBlur =
        12;


    ctx.fillRect(

        player.x,

        player.y,

        player.size,

        player.size

    );


    ctx.shadowBlur = 0;

}



/* =====================================================
   BOUCLE
===================================================== */

function gameLoop() {

    if(gameRunning) {

        movePlayer();

        updateRobots();

        checkExit();

    }


    draw();


    requestAnimationFrame(
        gameLoop
    );

}



/* =====================================================
   CHARGEMENT NIVEAU
===================================================== */

function loadLevel() {

    generateMaze(level);

    updateInterface();

}



/* =====================================================
   BOUTONS TELEPHONE
===================================================== */

function setupMobileButton(
    element,
    direction
) {


    function start(e) {

        e.preventDefault();

        if(!gameRunning) {

            return;

        }

        keys[direction] = true;

    }


    function stop(e) {

        e.preventDefault();

        keys[direction] = false;

    }


    element.addEventListener(
        "touchstart",
        start,
        { passive: false }
    );


    element.addEventListener(
        "touchend",
        stop,
        { passive: false }
    );


    element.addEventListener(
        "touchcancel",
        stop,
        { passive: false }
    );


    /*
       Fonctionne aussi avec la souris
       si tu testes les boutons sur PC.
    */

    element.addEventListener(
        "mousedown",
        start
    );


    element.addEventListener(
        "mouseup",
        stop
    );


    element.addEventListener(
        "mouseleave",
        stop
    );

}


setupMobileButton(
    document.getElementById("upButton"),
    "up"
);


setupMobileButton(
    document.getElementById("downButton"),
    "down"
);


setupMobileButton(
    document.getElementById("leftButton"),
    "left"
);


setupMobileButton(
    document.getElementById("rightButton"),
    "right"
);



/* =====================================================
   DEMARRAGE DU JEU
===================================================== */

playButton.addEventListener(
    "click",
    function() {


        /*
           On récupère le pseudo.

           trim() enlève seulement les espaces
           au début et à la fin.

           Les lettres A, Q, W, etc.
           restent parfaitement autorisées.
        */

        const name =
            nicknameInput.value.trim();


        if(name.length < 1) {

            errorMessage.textContent =
                translations[currentLanguage].error;

            nicknameInput.focus();

            return;

        }


        nickname = name;


        /*
           Sauvegarde du pseudo.
        */

        try {

            localStorage.setItem(
                "labyrinthNickname",
                nickname
            );

        }

        catch(e) {}


        homeScreen.style.display =
            "none";


        gameScreen.style.display =
            "block";


        level = 1;

        score = 0;

        gameRunning = true;


        loadLevel();

    }
);



/* =====================================================
   RECUPERATION ANCIEN PSEUDO
===================================================== */

try {

    const savedName =
        localStorage.getItem(
            "labyrinthNickname"
        );


    if(savedName) {

        nicknameInput.value =
            savedName;

    }

}

catch(e) {}



/* =====================================================
   LANGUE PAR DEFAUT
===================================================== */

setLanguage("fr");


/* =====================================================
   LANCEMENT DE LA BOUCLE
===================================================== */

loadLevel();

gameLoop();


</script>
