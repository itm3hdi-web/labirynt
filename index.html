<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blue Escape</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#top {
    height: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 60px;
    background: #111;
    font-size: 22px;
    font-weight: bold;
}

#gameContainer {
    height: calc(100vh - 60px);
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    max-width: 96vw;
    max-height: 88vh;
    background: #000;
}
</style>
</head>

<body>

<div id="top">
    <div>⏱️ <span id="timer">00:00</span></div>
    <div>👹 <span id="enemyCount">1</span></div>
</div>

<div id="gameContainer">
    <canvas id="game"></canvas>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");


/* ================================
   MAP STYLE PAC-MAN
================================ */

const map = [
"#####################",
"#P....#.......#....#",
"#.###.#.#####.#.###.#",
"#.....#...#...#.....#",
"#####.###.#.###.#####",
"#.........#.........#",
"#.###.#########.###.#",
"#...#....#....#...#.#",
"###.#.##.#.##.#.#.#.#",
"#...#.#.......#.#...#",
"#.###.#.#######.###.#",
"#.....#....#....#...#",
"#####.###.#.###.#####",
"#.........#.........#",
"#.###.#########.###.#",
"#.....#.......#.....#",
"###.#.#.#####.#.#.###",
"#...#...#...#...#...#",
"#.#######.#.#######.#",
"#...................#",
"#####################"
];

const tile = 32;

const rows = map.length;
const cols = map[0].length;

canvas.width = cols * tile;
canvas.height = rows * tile;


/* ================================
   JOUEUR
================================ */

const player = {
    x: 0,
    y: 0,
    speed: 5,
    walk: 0
};

for (let y = 0; y < rows; y++) {

    for (let x = 0; x < cols; x++) {

        if (map[y][x] === "P") {

            player.x = x * tile + tile / 2;
            player.y = y * tile + tile / 2;

        }
    }
}


/* ================================
   TOUCHES
================================ */

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});


/* ================================
   COLLISION MUR
================================ */

function isWall(x, y) {

    const col = Math.floor(x / tile);
    const row = Math.floor(y / tile);

    if (
        row < 0 ||
        row >= rows ||
        col < 0 ||
        col >= cols
    ) {
        return true;
    }

    return map[row][col] === "#";
}


function canMove(x, y) {

    const r = 9;

    return (
        !isWall(x - r, y - r) &&
        !isWall(x + r, y - r) &&
        !isWall(x - r, y + r) &&
        !isWall(x + r, y + r)
    );
}


/* ================================
   MOUVEMENT JOUEUR
================================ */

function movePlayer() {

    let dx = 0;
    let dy = 0;

    if (
        keys["arrowup"] ||
        keys["z"] ||
        keys["w"]
    ) {
        dy = -player.speed;
    }

    if (
        keys["arrowdown"] ||
        keys["s"]
    ) {
        dy = player.speed;
    }

    if (
        keys["arrowleft"] ||
        keys["q"] ||
        keys["a"]
    ) {
        dx = -player.speed;
    }

    if (
        keys["arrowright"] ||
        keys["d"]
    ) {
        dx = player.speed;
    }


    if (dx !== 0 || dy !== 0) {
        player.walk += 0.35;
    }


    if (canMove(player.x + dx, player.y)) {
        player.x += dx;
    }

    if (canMove(player.x, player.y + dy)) {
        player.y += dy;
    }
}


/* ================================
   ENNEMIS
================================ */

const enemies = [];

const enemyStarts = [
    [10, 9],
    [9, 5],
    [11, 15],
    [5, 19],
    [15, 19],
    [19, 9],
    [3, 13],
    [17, 13]
];


function createEnemy() {

    const index = enemies.length;

    const start =
        enemyStarts[index % enemyStarts.length];

    enemies.push({

        x: start[0] * tile + tile / 2,
        y: start[1] * tile + tile / 2,

        speed: 2.3 + index * 0.12,

        direction: null

    });
}


createEnemy();


/* ================================
   CHOISIR DIRECTION
================================ */

function chooseDirection(enemy) {

    const possible = [];

    const directions = [
        {x: 1, y: 0},
        {x: -1, y: 0},
        {x: 0, y: 1},
        {x: 0, y: -1}
    ];


    for (const dir of directions) {

        const nx =
            enemy.x + dir.x * tile;

        const ny =
            enemy.y + dir.y * tile;


        if (canMove(nx, ny)) {

            possible.push(dir);

        }
    }


    if (possible.length === 0) {
        return;
    }


    /*
       Évite de faire demi-tour
       quand c'est possible.
    */

    let choices = possible;

    if (enemy.direction) {

        const filtered =
            possible.filter(dir => {

                return !(
                    dir.x === -enemy.direction.x &&
                    dir.y === -enemy.direction.y
                );

            });


        if (filtered.length > 0) {
            choices = filtered;
        }
    }


    /*
       Parmi les chemins disponibles,
       choisit souvent celui qui
       rapproche de la position du joueur.
    */

    choices.sort((a, b) => {

        const daX =
            enemy.x + a.x * tile - player.x;

        const daY =
            enemy.y + a.y * tile - player.y;

        const dbX =
            enemy.x + b.x * tile - player.x;

        const dbY =
            enemy.y + b.y * tile - player.y;


        const distA =
            daX * daX + daY * daY;

        const distB =
            dbX * dbX + dbY * dbY;


        return distA - distB;

    });


    /*
       Parfois un chemin aléatoire
       pour éviter que toutes les
       têtes fassent exactement pareil.
    */

    if (Math.random() < 0.25) {

        enemy.direction =
            choices[
                Math.floor(
                    Math.random() * choices.length
                )
            ];

    } else {

        enemy.direction = choices[0];

    }
}


/* ================================
   MOUVEMENT ENNEMI
================================ */

function moveEnemy(enemy) {

    if (!enemy.direction) {
        chooseDirection(enemy);
    }


    const dx =
        enemy.direction.x * enemy.speed;

    const dy =
        enemy.direction.y * enemy.speed;


    if (canMove(enemy.x + dx, enemy.y)) {

        enemy.x += dx;

    } else {

        chooseDirection(enemy);

    }


    if (canMove(enemy.x, enemy.y + dy)) {

        enemy.y += dy;

    } else {

        chooseDirection(enemy);

    }


    /*
       Quand la tête arrive
       près d'une intersection.
    */

    const centerX =
        Math.round(
            (enemy.x - tile / 2) / tile
        ) * tile + tile / 2;

    const centerY =
        Math.round(
            (enemy.y - tile / 2) / tile
        ) * tile + tile / 2;


    if (
        Math.abs(enemy.x - centerX) < 2 &&
        Math.abs(enemy.y - centerY) < 2
    ) {

        enemy.x = centerX;
        enemy.y = centerY;

        chooseDirection(enemy);

    }
}


/* ================================
   DESSIN MAP
================================ */

function drawMap() {

    for (let y = 0; y < rows; y++) {

        for (let x = 0; x < cols; x++) {

            if (map[y][x] === "#") {

                ctx.fillStyle = "#123bff";

                ctx.fillRect(
                    x * tile,
                    y * tile,
                    tile,
                    tile
                );


                ctx.strokeStyle = "#3155ff";
                ctx.lineWidth = 1;

                ctx.strokeRect(
                    x * tile + 1,
                    y * tile + 1,
                    tile - 2,
                    tile - 2
                );

            } else {

                ctx.fillStyle = "#050505";

                ctx.fillRect(
                    x * tile,
                    y * tile,
                    tile,
                    tile
                );

            }
        }
    }
}


/* ================================
   PERSONNAGE BLEU
================================ */

function drawPlayer() {

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );


    /*
       Corps
    */

    ctx.fillStyle = "#00aaff";

    ctx.beginPath();

    ctx.arc(
        0,
        -6,
        9,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillRect(
        -9,
        2,
        18,
        15
    );


    /*
       Bras
    */

    ctx.strokeStyle = "#00aaff";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";

    const arm =
        Math.sin(player.walk) * 5;


    ctx.beginPath();

    ctx.moveTo(-7, 5);

    ctx.lineTo(
        -12,
        12 + arm
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(7, 5);

    ctx.lineTo(
        12,
        12 - arm
    );

    ctx.stroke();


    /*
       Jambes
    */

    const leg =
        Math.sin(player.walk) * 7;


    ctx.beginPath();

    ctx.moveTo(-4, 16);

    ctx.lineTo(
        -7,
        27 + leg
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(4, 16);

    ctx.lineTo(
        7,
        27 - leg
    );

    ctx.stroke();


    ctx.restore();
}


/* ================================
   TÊTE
================================ */

function drawEnemy(enemy) {

    ctx.save();

    ctx.translate(
        enemy.x,
        enemy.y
    );


    /*
       Tête
    */

    ctx.fillStyle = "#e32626";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        15,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Yeux
    */

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
        -6,
        -4,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        6,
        -4,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Pupilles
    */

    ctx.fillStyle = "black";

    ctx.beginPath();

    ctx.arc(
        -6,
        -3,
        2,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        6,
        -3,
        2,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Sourcils méchants
    */

    ctx.strokeStyle = "black";
    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(-11, -9);
    ctx.lineTo(-3, -6);

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(11, -9);
    ctx.lineTo(3, -6);

    ctx.stroke();


    /*
       Bouche
    */

    ctx.beginPath();

    ctx.moveTo(-7, 7);

    ctx.quadraticCurveTo(
        0,
        2,
        7,
        7
    );

    ctx.stroke();


    ctx.restore();
}


/* ================================
   COLLISION
================================ */

function checkCollision() {

    for (const enemy of enemies) {

        const dx =
            player.x - enemy.x;

        const dy =
            player.y - enemy.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (distance < 24) {

            alert("TU AS ÉTÉ ATTRAPÉ !");

            location.reload();

        }
    }
}


/* ================================
   TIMER
================================ */

const startTime = Date.now();

let lastCount = 1;


function updateTimer() {

    const elapsed =
        Math.floor(
            (Date.now() - startTime) / 1000
        );


    const minutes =
        Math.floor(elapsed / 60);

    const seconds =
        elapsed % 60;


    document.getElementById(
        "timer"
    ).textContent =
        String(minutes).padStart(2, "0")
        + ":" +
        String(seconds).padStart(2, "0");


    /*
       Une tête supplémentaire
       toutes les 30 secondes.
    */

    const wanted =
        Math.floor(elapsed / 30) + 1;


    if (wanted > lastCount) {

        while (
            enemies.length < wanted
        ) {

            createEnemy();

        }


        lastCount = wanted;


        document.getElementById(
            "enemyCount"
        ).textContent =
            enemies.length;
    }
}


/* ================================
   GAME LOOP
================================ */

function gameLoop() {

    movePlayer();


    for (const enemy of enemies) {

        moveEnemy(enemy);

    }


    drawMap();

    drawPlayer();


    for (const enemy of enemies) {

        drawEnemy(enemy);

    }


    checkCollision();

    updateTimer();


    requestAnimationFrame(
        gameLoop
    );
}


gameLoop();

</script>

</body>
</html>
