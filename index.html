<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Labyrinthe Hardcore</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: #080b14;
    color: white;
}

/* =========================
   ACCUEIL
========================= */

#menu {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at 20% 20%, #174a7c 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #124c36 0%, transparent 30%),
        linear-gradient(135deg, #050713, #101a30, #050713);

    z-index: 100;
}

.menu-box {
    width: 90%;
    max-width: 500px;

    padding: 35px;

    background: rgba(15, 20, 35, 0.97);

    border: 2px solid #293650;
    border-radius: 25px;

    text-align: center;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.6);
}

.logo {
    font-size: 60px;
}

.menu-box h1 {
    margin: 10px 0;
    font-size: 34px;
}

.description {
    color: #bfc9dc;
    line-height: 1.5;
    margin-bottom: 25px;
}

.form-group {
    text-align: left;
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
select {
    width: 100%;

    padding: 13px;

    background: #182137;
    color: white;

    border: 1px solid #3b4b6d;

    border-radius: 10px;

    outline: none;
}

input:focus,
select:focus {
    border-color: #3498ff;
}

.mode-buttons {
    display: flex;
    gap: 10px;
}

.mode-button {
    flex: 1;

    padding: 13px;

    border: 1px solid #3b4b6d;
    border-radius: 10px;

    background: #182137;
    color: white;

    cursor: pointer;
    font-weight: bold;
}

.mode-button.active {
    background: #3498ff;
    border-color: #3498ff;
}

#pseudo2Container {
    display: none;
}

#startButton {
    width: 100%;

    padding: 15px;

    margin-top: 10px;

    border: none;
    border-radius: 12px;

    background: #3498ff;
    color: white;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;
}

#startButton:hover {
    background: #217dcc;
}

#error {
    min-height: 22px;
    color: #ff5555;
    margin-top: 10px;
}

/* =========================
   JEU
========================= */

#gameContainer {
    display: none;
}

#topBar {
    width: 100%;

    padding: 10px;

    background: #121827;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 15px;

    flex-wrap: wrap;
}

/* JOUEURS */

.players {
    display: flex;
    gap: 10px;
}

.player-card {
    width: 150px;

    padding: 9px;

    background: #1b2334;

    border: 2px solid #34415e;

    border-radius: 12px;

    text-align: center;

    font-size: 13px;
}

.player-name {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 4px;
}

.turn {
    margin-top: 5px;
    font-weight: bold;
}

.turn.active {
    color: #00ff66;
}

.turn.inactive {
    color: #ff4444;
}

/* INFOS */

.info {
    display: flex;

    gap: 15px;

    flex-wrap: wrap;

    justify-content: center;

    font-size: 14px;
}

.info span {
    font-weight: bold;
}

/* CANVAS */

#gameCanvas {
    display: block;

    width: 900px;
    height: 600px;

    max-width: 96vw;
    height: auto;

    margin: 10px auto;

    background: #222;

    border: 4px solid white;
}

/* =========================
   BOUTONS TELEPHONE
========================= */

#mobileControls {
    display: none;

    width: 220px;

    margin: 10px auto 25px;

    touch-action: none;
}

.mobile-row {
    display: flex;

    justify-content: center;

    gap: 8px;

    margin-bottom: 8px;
}

.mobile-button {
    width: 65px;
    height: 65px;

    border: 2px solid white;

    border-radius: 12px;

    background: #292929;

    color: white;

    font-size: 28px;

    touch-action: none;

    user-select: none;
}

.mobile-button:active {
    background: #555;
}

/* =========================
   MESSAGE
========================= */

#message {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 200;

    background: rgba(0,0,0,0.94);

    justify-content: center;
    align-items: center;

    flex-direction: column;

    text-align: center;

    padding: 20px;
}

#message h1 {
    font-size: 55px;
}

#message p {
    font-size: 20px;

    max-width: 600px;

    white-space: pre-line;
}

#messageButton {
    padding: 14px 25px;

    border: none;

    border-radius: 10px;

    background: #3498ff;

    color: white;

    font-size: 18px;

    cursor: pointer;
}

/* =========================
   TELEPHONE
========================= */

@media (max-width: 700px) {

    #topBar {
        gap: 7px;
    }

    .players {
        width: 100%;

        justify-content: center;
    }

    .player-card {
        width: 135px;
    }

    .info {
        width: 100%;
        font-size: 12px;
        gap: 8px;
    }

    #mobileControls {
        display: block;
    }

    .menu-box {
        padding: 25px;
    }

    .menu-box h1 {
        font-size: 28px;
    }

}

</style>
</head>

/* =====================================================
   GENERATEUR ALEATOIRE
===================================================== */

function randomGenerator(seed) {

    let value = seed;

    return function() {

        value =
            (value * 9301 + 49297)
            % 233280;

        return value / 233280;

    };

}


/* =====================================================
   GENERER LE LABYRINTHE
===================================================== */

function generateMaze(levelNumber) {

    walls = [];

    robots = [];


    /*
       DIFFICULTE PROGRESSIVE

       Niveau 1 :
       très facile

       Niveau 23 :
       très difficile
    */

    let cols;

    let rows;


    if(levelNumber === 1) {

        cols = 10;
        rows = 7;

    }

    else if(levelNumber === 2) {

        cols = 12;
        rows = 8;

    }

    else if(levelNumber === 3) {

        cols = 14;
        rows = 9;

    }

    else {

        cols =
            Math.min(
                14 +
                Math.floor(
                    levelNumber * 0.7
                ),
                30
            );


        rows =
            Math.min(
                9 +
                Math.floor(
                    levelNumber * 0.35
                ),
                18
            );

    }


    const cellW =
        canvas.width / cols;

    const cellH =
        canvas.height / rows;


    const random =
        randomGenerator(
            levelNumber * 12345 + 77
        );


    /*
       CELLULES
    */

    const cells = [];


    for(let y = 0; y < rows; y++) {

        cells[y] = [];

        for(let x = 0; x < cols; x++) {

            cells[y][x] = {

                visited: false,

                top: true,

                right: true,

                bottom: true,

                left: true

            };

        }

    }


    /*
       ALGORITHME DFS
    */

    const stack = [];


    cells[0][0].visited = true;

    stack.push({
        x: 0,
        y: 0
    });


    while(stack.length > 0) {

        const current =
            stack[stack.length - 1];

        const neighbors = [];


        /*
           HAUT
        */

        if(
            current.y > 0 &&
            !cells[
                current.y - 1
            ][
                current.x
            ].visited
        ) {

            neighbors.push({
                x: current.x,
                y: current.y - 1,
                direction: "top"
            });

        }


        /*
           DROITE
        */

        if(
            current.x < cols - 1 &&
            !cells[
                current.y
            ][
                current.x + 1
            ].visited
        ) {

            neighbors.push({
                x: current.x + 1,
                y: current.y,
                direction: "right"
            });

        }


        /*
           BAS
        */

        if(
            current.y < rows - 1 &&
            !cells[
                current.y + 1
            ][
                current.x
            ].visited
        ) {

            neighbors.push({
                x: current.x,
                y: current.y + 1,
                direction: "bottom"
            });

        }


        /*
           GAUCHE
        */

        if(
            current.x > 0 &&
            !cells[
                current.y
            ][
                current.x - 1
            ].visited
        ) {

            neighbors.push({
                x: current.x - 1,
                y: current.y,
                direction: "left"
            });

        }


        if(neighbors.length > 0) {

            const next =
                neighbors[
                    Math.floor(
                        random() *
                        neighbors.length
                    )
                ];


            const currentCell =
                cells[
                    current.y
                ][
                    current.x
                ];


            const nextCell =
                cells[
                    next.y
                ][
                    next.x
                ];


            if(next.direction === "top") {

                currentCell.top = false;

                nextCell.bottom = false;

            }


            if(next.direction === "right") {

                currentCell.right = false;

                nextCell.left = false;

            }


            if(next.direction === "bottom") {

                currentCell.bottom = false;

                nextCell.top = false;

            }


            if(next.direction === "left") {

                currentCell.left = false;

                nextCell.right = false;

            }


            nextCell.visited = true;

            stack.push({
                x: next.x,
                y: next.y
            });

        }

        else {

            stack.pop();

        }

    }


    /*
       MURS
    */

    const wallSize =
        levelNumber < 5
            ? 6
            : 5;


    for(let y = 0; y < rows; y++) {

        for(let x = 0; x < cols; x++) {

            const cell =
                cells[y][x];


            const px =
                x * cellW;

            const py =
                y * cellH;


            if(cell.top) {

                walls.push({

                    x: px,

                    y: py,

                    w: cellW + wallSize,

                    h: wallSize

                });

            }


            if(cell.left) {

                walls.push({

                    x: px,

                    y: py,

                    w: wallSize,

                    h: cellH + wallSize

                });

            }


            if(
                x === cols - 1 &&
                cell.right
            ) {

                walls.push({

                    x:
                        px + cellW,

                    y:
                        py,

                    w:
                        wallSize,

                    h:
                        cellH

                });

            }


            if(
                y === rows - 1 &&
                cell.bottom
            ) {

                walls.push({

                    x:
                        px,

                    y:
                        py + cellH,

                    w:
                        cellW,

                    h:
                        wallSize

                });

            }

        }

    }


    /*
       JOUEUR
    */

    player.x =
        cellW * 0.30;

    player.y =
        cellH * 0.30;


    /*
       SORTIE
    */

    exit.x =
        (cols - 1) * cellW +
        cellW * 0.35;

    exit.y =
        (rows - 1) * cellH +
        cellH * 0.35;

    exit.size =
        Math.max(
            16,
            Math.min(
                cellW,
                cellH
            ) * 0.35
        );


    /*
       ROBOTS

       Niveau 1-3 :
       aucun robot

       Puis ils arrivent progressivement.
    */

    let robotCount = 0;


    if(levelNumber >= 4) {

        robotCount =
            Math.floor(
                (levelNumber - 2) / 2
            );

    }


    robotCount =
        Math.min(
            robotCount,
            10
        );


    const robotSpeed =
        0.5 +
        levelNumber * 0.12;


    for(
        let i = 0;
        i < robotCount;
        i++
    ) {

        robots.push({

            x:
                cellW *
                (
                    2 +
                    Math.floor(
                        random() *
                        Math.max(
                            1,
                            cols - 4
                        )
                    )
                ),

            y:
                cellH *
                (
                    1 +
                    Math.floor(
                        random() *
                        Math.max(
                            1,
                            rows - 3
                        )
                    )
                ),

            size:
                Math.max(
                    10,
                    Math.min(
                        cellW,
                        cellH
                    ) * 0.30
                ),

            speed:
                robotSpeed,

            direction:
                random() > 0.5
                    ? 1
                    : -1,

            horizontal:
                random() > 0.5

        });

    }

}


/* =====================================================
   COLLISION
===================================================== */

function collision(a, b) {

    return (

        a.x < b.x + b.w &&
        a.x + a.size > b.x &&
        a.y < b.y + b.h &&
        a.y + a.size > b.y

    );

}


/* =====================================================
   DEPLACEMENT JOUEUR
===================================================== */

function movePlayer() {

    if(!gameRunning)
        return;


    let dx = 0;

    let dy = 0;


    /*
       TOUCHES
    */

    if(
        keys["ArrowRight"] ||
        keys["ArrowRight".toLowerCase()] ||
        keys["d"] ||
        keys["D"]
    ) {

        dx += player.speed;

    }


    if(
        keys["ArrowLeft"] ||
        keys["ArrowLeft".toLowerCase()] ||
        keys["q"] ||
        keys["Q"] ||
        keys["a"] ||
        keys["A"]
    ) {

        dx -= player.speed;

    }


    if(
        keys["ArrowDown"] ||
        keys["ArrowDown".toLowerCase()] ||
        keys["s"] ||
        keys["S"]
    ) {

        dy += player.speed;

    }


    if(
        keys["ArrowUp"] ||
        keys["ArrowUp".toLowerCase()] ||
        keys["z"] ||
        keys["Z"] ||
        keys["w"] ||
        keys["W"]
    ) {

        dy -= player.speed;

    }


    if(dx === 0 && dy === 0)
        return;


    const oldX =
        player.x;

    const oldY =
        player.y;


    player.x += dx;

    player.y += dy;


    /*
       COLLISION MURS
    */

    for(const wall of walls) {

        if(
            collision(
                player,
                wall
            )
        ) {

            player.x = oldX;

            player.y = oldY;

            lose(
                text[language].wall
            );

            return;

        }

    }


    /*
       LIMITES
    */

    if(player.x < 0)
        player.x = 0;

    if(player.y < 0)
        player.y = 0;

    if(
        player.x >
        canvas.width -
        player.size
    ) {

        player.x =
            canvas.width -
            player.size;

    }

    if(
        player.y >
        canvas.height -
        player.size
    ) {

        player.y =
            canvas.height -
            player.size;

    }

}


/* =====================================================
   CLAVIER
===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        keys[e.key] = true;

        /*
           Empêche la page de défiler
           avec les flèches.
        */

        if(
            e.key === "ArrowUp" ||
            e.key === "ArrowDown" ||
            e.key === "ArrowLeft" ||
            e.key === "ArrowRight" ||
            e.key === " "
        ) {

            e.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    function(e) {

        keys[e.key] = false;

    }
);


/* =====================================================
   BOUTONS TELEPHONE
===================================================== */

document
.querySelectorAll(".mobile-button")
.forEach(function(button) {

    const key =
        button.dataset.key;


    button.addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            keys[key] = true;

        },
        {
            passive: false
        }
    );


    button.addEventListener(
        "touchend",
        function(e) {

            e.preventDefault();

            keys[key] = false;

        },
        {
            passive: false
        }
    );


    button.addEventListener(
        "touchcancel",
        function() {

            keys[key] = false;

        }
    );


    /*
       Pour ordinateur aussi.
    */

    button.addEventListener(
        "mousedown",
        function() {

            keys[key] = true;

        }
    );


    button.addEventListener(
        "mouseup",
        function() {

            keys[key] = false;

        }
    );

});


/* =====================================================
   ROBOTS
===================================================== */

function updateRobots() {

    if(!gameRunning)
        return;


    for(const robot of robots) {

        if(robot.horizontal) {

            robot.x +=
                robot.speed *
                robot.direction;


            if(
                robot.x <= 10 ||
                robot.x >=
                canvas.width -
                robot.size -
                10
            ) {

                robot.direction *= -1;

            }

        }
        else {

            robot.y +=
                robot.speed *
                robot.direction;


            if(
                robot.y <= 10 ||
                robot.y >=
                canvas.height -
                robot.size -
                10
            ) {

                robot.direction *= -1;

            }

        }


        const r = {

            x: robot.x,

            y: robot.y,

            w: robot.size,

            h: robot.size

        };


        if(
            collision(
                player,
                r
            )
        ) {

            lose(
                text[language].robot
            );

            return;

        }

    }

}


/* =====================================================
   SORTIE
===================================================== */

function checkExit() {

    const exitBox = {

        x: exit.x,

        y: exit.y,

        w: exit.size,

        h: exit.size

    };


    if(
        collision(
            player,
            exitBox
        )
    ) {

        levelComplete();

    }

}


/* =====================================================
   FIN DU NIVEAU
===================================================== */

function levelComplete() {

    /*
       Score gagné.
    */

    const points =
        Math.max(
            1,
            5 -
            Math.floor(
                (level - 1) / 5
            )
        );


    scores[currentPlayer] +=
        points;


    /*
       DERNIER NIVEAU
    */

    if(level >= MAX_LEVEL) {

        winGame();

        return;

    }


    level++;


    loadLevel();

}


/* =====================================================
   DEFAITE
===================================================== */

function lose(reason) {

    if(!gameRunning)
        return;


    /*
       -2 au début.
       Peut augmenter avec le niveau.
    */

    const penalty =
        Math.min(
            6,
            2 +
            Math.floor(
                level / 5
            )
        );


    /*
       Le score peut être négatif.
    */

    scores[currentPlayer] -=
        penalty;


    gameRunning = false;


    messageTitle.textContent =
        text[language].lose;


    messageText.textContent =
        reason +
        "\n\n" +
        playerNames[currentPlayer] +
        " : -" +
        penalty +
        " points";


    messageButton.textContent =
        text[language].continue;


    message.style.display =
        "flex";


    updateInterface();

}


/* =====================================================
   CONTINUER APRES DEFAITE
===================================================== */

messageButton.addEventListener(
    "click",
    function() {

        message.style.display =
            "none";


        /*
           En Duo :
           changement de joueur.

           En Solo :
           même joueur.
        */

        if(mode === "duo") {

            currentPlayer =
                currentPlayer === 0
                    ? 1
                    : 0;

        }


        gameRunning = true;


        loadLevel();

    }
);


/* =====================================================
   VICTOIRE
===================================================== */

function winGame() {

    gameRunning = false;


    messageTitle.textContent =
        text[language].victory;


    if(mode === "duo") {

        messageText.textContent =
            playerNames[currentPlayer] +
            " : " +
            scores[currentPlayer] +
            " points\n\n" +
            text[language].victoryText;

    }
    else {

        messageText.textContent =
            scores[0] +
            " points\n\n" +
            text[language].victoryText;

    }


    messageButton.textContent =
        text[language].continue;


    message.style.display =
        "flex";

}


/* =====================================================
   INTERFACE
===================================================== */

function updateInterface() {

    document.getElementById(
        "level"
    ).textContent =
        level;


    document.getElementById(
        "score0"
    ).textContent =
        scores[0];


    document.getElementById(
        "score1"
    ).textContent =
        scores[1];


    document.getElementById(
        "playerName0"
    ).textContent =
        playerNames[0];


    document.getElementById(
        "playerName1"
    ).textContent =
        playerNames[1];


    document.getElementById(
        "turn0"
    ).textContent =
        text[language].turn +
        " " +
        playerNames[0];


    document.getElementById(
        "turn1"
    ).textContent =
        text[language].turn +
        " " +
        playerNames[1];


    const turn0 =
        document.getElementById(
            "turn0"
        );

    const turn1 =
        document.getElementById(
            "turn1"
        );


    turn0.classList.remove(
        "active",
        "inactive"
    );

    turn1.classList.remove(
        "active",
        "inactive"
    );


    if(mode === "solo") {

        turn0.classList.add(
            "active"
        );

        turn1.classList.add(
            "inactive"
        );

    }
    else {

        if(currentPlayer === 0) {

            turn0.classList.add(
                "active"
            );

            turn1.classList.add(
                "inactive"
            );

        }
        else {

            turn0.classList.add(
                "inactive"
            );

            turn1.classList.add(
                "active"
            );

        }

    }


    document.getElementById(
        "playerSpeed"
    ).textContent =
        player.speed;


    const robotSpeed =
        level < 4
            ? 0
            : (
                0.5 +
                level * 0.12
            );


    document.getElementById(
        "robotSpeed"
    ).textContent =
        robotSpeed.toFixed(1);

}


/* =====================================================
   DESSIN
===================================================== */

function draw() {

    /*
       FOND
    */

    ctx.fillStyle =
        "#222222";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       MURS
    */

    ctx.fillStyle =
        "#ffffff";


    for(const wall of walls) {

        ctx.fillRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

    }


    /*
       SORTIE VERTE
    */

    ctx.fillStyle =
        "#00ff66";

    ctx.fillRect(
        exit.x,
        exit.y,
        exit.size,
        exit.size
    );


    /*
       ROBOTS ROUGES
    */

    for(const robot of robots) {

        ctx.fillStyle =
            "#ff3030";

        ctx.fillRect(
            robot.x,
            robot.y,
            robot.size,
            robot.size
        );


        /*
           YEUX
        */

        ctx.fillStyle =
            "#ffffff";


        const eye =
            Math.max(
                2,
                robot.size * 0.18
            );


        ctx.fillRect(
            robot.x +
            robot.size * 0.20,

            robot.y +
            robot.size * 0.20,

            eye,
            eye
        );


        ctx.fillRect(
            robot.x +
            robot.size * 0.62,

            robot.y +
            robot.size * 0.20,

            eye,
            eye
        );

    }


    /*
       JOUEUR BLEU
    */

    ctx.fillStyle =
        "#3498ff";

    ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
    );

}


/* =====================================================
   CHARGER LE NIVEAU
===================================================== */

function loadLevel() {

    generateMaze(level);

    updateInterface();

}


/* =====================================================
   BOUCLE DU JEU
===================================================== */

function gameLoop() {

    if(gameRunning) {

        movePlayer();

        updateRobots();

        checkExit();

    }


    /*
       DESSIN TOUJOURS ACTIF
    */

    draw();


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   INITIALISATION
===================================================== */

updateLanguage();

/*
   Le canvas est déjà dessiné une première fois.
   Cela évite un écran vide.
*/

draw();

gameLoop();

</script>
