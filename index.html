<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Labyrinthe Hardcore</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    text-align: center;
    overflow-x: hidden;
}

.hidden {
    display: none !important;
}

/* =========================
   ACCUEIL
========================= */

#home {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background:
        radial-gradient(circle at 20% 20%, #164b7a 0, transparent 30%),
        radial-gradient(circle at 80% 80%, #47156c 0, transparent 30%),
        linear-gradient(135deg, #050810, #111827, #080b12);
}

.menu {
    width: min(600px, 95vw);
    padding: 35px 25px;
    border-radius: 25px;
    background: rgba(10,15,25,.88);
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: 0 0 50px rgba(0,0,0,.6);
}

.logo {
    margin: 0;
    font-size: clamp(42px, 9vw, 75px);
    font-weight: 900;
    background: linear-gradient(90deg,#36a8ff,#9b5cff,#ff3f81);
    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    color: #aaa;
    margin: 8px 0 30px;
}

.field {
    text-align: left;
    margin: 15px 0;
}

.field label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #151b27;
    color: white;
    font-size: 17px;
    outline: none;
}

.modes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.mode {
    padding: 15px;
    border: 2px solid #333;
    border-radius: 12px;
    background: #141a25;
    cursor: pointer;
    font-weight: bold;
}

.mode.selected {
    border-color: #3498ff;
    background: #102a45;
}

.startButton {
    width: 100%;
    margin-top: 20px;
    padding: 17px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(90deg,#168cff,#7c3cff);
    color: white;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
}

.tip {
    margin-top: 20px;
    padding: 12px;
    border-radius: 10px;
    background: rgba(52,152,255,.08);
    color: #9ccfff;
    font-size: 14px;
}

/* =========================
   JEU
========================= */

#gameScreen {
    display: none;
    min-height: 100vh;
    background: #0c1018;
    padding: 8px;
}

#top {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

.playerCard {
    min-width: 150px;
    padding: 8px 12px;
    border: 2px solid #333;
    border-radius: 10px;
    background: #151a24;
}

.playerCard.active {
    border-color: #20e070;
    box-shadow: 0 0 15px rgba(32,224,112,.35);
}

.playerCard.inactive {
    border-color: #e33b3b;
}

.playerName {
    font-weight: bold;
}

.turn {
    font-size: 13px;
    margin-top: 3px;
}

.stats {
    padding: 8px 12px;
    background: #151a24;
    border-radius: 10px;
    border: 1px solid #333;
    font-size: 14px;
}

#canvasWrapper {
    width: 100%;
    display: flex;
    justify-content: center;
}

canvas {
    width: min(95vw, 900px);
    height: auto;
    aspect-ratio: 3 / 2;
    display: block;
    border: 3px solid white;
    background: #222;
    border-radius: 5px;
    touch-action: none;
}

/* =========================
   VITESSE
========================= */

.speedBox {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 9px;
    background: #151a24;
    border: 1px solid #333;
    border-radius: 10px;
    font-size: 14px;
}

.speedBox select {
    width: auto;
    padding: 6px 25px 6px 8px;
    font-size: 14px;
}

/* =========================
   TOUCHES
========================= */

#controls {
    width: min(300px, 90vw);
    margin: 12px auto 5px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
}

.control {
    height: 55px;
    border: 0;
    border-radius: 12px;
    background: #202938;
    color: white;
    font-size: 25px;
    font-weight: bold;
    touch-action: none;
    user-select: none;
}

.control:active {
    background: #3498ff;
    transform: scale(.95);
}

.empty {
    visibility: hidden;
}

/* =========================
   MESSAGE
========================= */

#message {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: rgba(0,0,0,.9);
    z-index: 20;
    padding: 20px;
}

#message h1 {
    font-size: clamp(40px, 10vw, 70px);
    margin: 10px;
}

#message p {
    font-size: 20px;
    max-width: 600px;
}

.messageButton {
    padding: 14px 25px;
    font-size: 18px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    margin: 6px;
}

#nextButton {
    background: #20c968;
    color: white;
}

#restartButton {
    background: #3498ff;
    color: white;
}

#homeButton {
    background: #333;
    color: white;
}

@media (max-width: 600px) {

    #top {
        font-size: 12px;
    }

    .playerCard {
        min-width: 125px;
        padding: 6px;
    }

    .stats,
    .speedBox {
        font-size: 11px;
        padding: 6px;
    }

    .speedBox select {
        font-size: 11px;
    }

    canvas {
        border-width: 2px;
    }
}
</style>
</head>

<body>

<!-- =========================
     ACCUEIL
========================= -->

<section id="home">

<div class="menu">

    <h1 class="logo">LABYRINTHE</h1>

    <div class="subtitle">
        Bienvenue dans le jeu
    </div>

    <div class="field">
        <label>Pseudo</label>

        <input
            id="pseudoInput"
            type="text"
            maxlength="20"
            autocomplete="off"
            placeholder="Entre ton pseudo"
        >
    </div>

    <div class="field">
        <label>Langue</label>

        <select id="languageSelect">
            <option value="fr">Français</option>
            <option value="en">English</option>
            <option value="ar">العربية</option>
        </select>
    </div>

    <div class="field">

        <label>Mode</label>

        <div class="modes">

            <div
                class="mode selected"
                id="soloMode"
                onclick="selectMode('solo')"
            >
                🎮 Solo
            </div>

            <div
                class="mode"
                id="duoMode"
                onclick="selectMode('duo')"
            >
                👥 Duo
            </div>

        </div>

    </div>

    <div class="field">

        <label>Difficulté</label>

        <select id="difficultySelect">

            <option value="easy">
                🟢 Facile — 10 niveaux
            </option>

            <option value="medium">
                🟠 Moyen — 15 niveaux
            </option>

            <option value="hard">
                🔴 Difficile — 23 niveaux
            </option>

        </select>

    </div>

    <button
        class="startButton"
        onclick="startGame()"
    >
        Jouer
    </button>

    <div class="tip">
        💡 <b>Tip :</b> utilise les flèches du clavier
        ou les boutons à l'écran pour jouer.
    </div>

</div>

</section>


<!-- =========================
     JEU
========================= -->

<section id="gameScreen">

<div id="top">

    <div
        id="card1"
        class="playerCard active"
    >

        <div
            class="playerName"
            id="player1Name"
        >
            Joueur 1
        </div>

        <div>
            Score :
            <span id="score1">0</span>
        </div>

        <div
            class="turn"
            id="turn1"
        >
            🟢 Tour de Joueur 1
        </div>

    </div>


    <div
        id="card2"
        class="playerCard"
    >

        <div
            class="playerName"
            id="player2Name"
        >
            Joueur 2
        </div>

        <div>
            Score :
            <span id="score2">0</span>
        </div>

        <div
            class="turn"
            id="turn2"
        >
            🔴 Pas son tour
        </div>

    </div>


    <div class="stats">

        Niveau :
        <b>
            <span id="levelText">1</span>
        </b>

        /

        <span id="maxLevelText">23</span>

    </div>


    <!-- VITESSE DU JOUEUR -->

    <div class="speedBox">

        ⚡ Vitesse :

        <select id="speedSelectGame">

            <option value="0.1">
                0,1
            </option>

            <option value="0.3">
                0,3
            </option>

            <option value="0.6" selected>
                0,6
            </option>

            <option value="0.9">
                0,9
            </option>

            <option value="1.01">
                1,01
            </option>

            <option value="1.2">
                1,2
            </option>

        </select>

    </div>


    <div class="stats">

        Vitesse robot :
        <b id="robotSpeedText">—</b>

    </div>

</div>


<div id="canvasWrapper">

    <canvas
        id="game"
        width="900"
        height="600"
    ></canvas>

</div>


<div id="controls">

    <button class="control empty"></button>

    <button
        class="control"
        id="upButton"
    >
        ▲
    </button>

    <button class="control empty"></button>

    <button
        class="control"
        id="leftButton"
    >
        ◀
    </button>

    <button
        class="control"
        id="downButton"
    >
        ▼
    </button>

    <button
        class="control"
        id="rightButton"
    >
        ▶
    </button>

</div>

</section>


<!-- =========================
     MESSAGE
========================= -->

<div id="message">

    <h1 id="messageTitle"></h1>

    <p id="messageText"></p>

    <div>

        <button
            class="messageButton"
            id="nextButton"
            onclick="continueAfterMessage()"
        >
            Continuer
        </button>

        <button
            class="messageButton"
            id="restartButton"
            onclick="restartLevel()"
        >
            Recommencer
        </button>

        <button
            class="messageButton"
            id="homeButton"
            onclick="goHome()"
        >
            Accueil
        </button>

    </div>

</div>


<script>

/* =====================================================
   VARIABLES
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const home =
    document.getElementById("home");

const gameScreen =
    document.getElementById("gameScreen");

const message =
    document.getElementById("message");

const messageTitle =
    document.getElementById("messageTitle");

const messageText =
    document.getElementById("messageText");

const levelText =
    document.getElementById("levelText");

const maxLevelText =
    document.getElementById("maxLevelText");

const score1Text =
    document.getElementById("score1");

const score2Text =
    document.getElementById("score2");

const player1Name =
    document.getElementById("player1Name");

const player2Name =
    document.getElementById("player2Name");

const playerSpeedSelect =
    document.getElementById("speedSelectGame");

const robotSpeedText =
    document.getElementById("robotSpeedText");

const card1 =
    document.getElementById("card1");

const card2 =
    document.getElementById("card2");


let gameMode = "solo";

let difficulty = "easy";

let level = 1;

let maxLevel = 10;

let score1 = 0;

let score2 = 0;

let currentPlayer = 1;

let gameRunning = false;

let walls = [];

let robots = [];

let coins = [];

let keys = {};


/*
   IMPORTANT :
   Ces valeurs sont maintenant des
   multiplicateurs de vitesse.

   0.6 = vitesse rapide d'origine.
*/

let playerSpeedMultiplier = 0.6;


/* =====================================================
   JOUEUR
===================================================== */

const player = {

    x: 0,

    y: 0,

    size: 12,

    speed: 6

};


/*
   Vitesse réelle de base.

   Avant, 0.6 correspondait environ à 6 pixels.
*/

function updatePlayerSpeed() {

    player.speed =
        10 *
        playerSpeedMultiplier;

}


/* =====================================================
   SORTIE
===================================================== */

const exit = {

    x: 0,

    y: 0,

    size: 16

};


/* =====================================================
   PIECES
===================================================== */

const GOLD_VALUE = 2;

const SILVER_VALUE = 0.5;


/* =====================================================
   MODE
===================================================== */

function selectMode(mode) {

    gameMode = mode;

    document
        .getElementById("soloMode")
        .classList.toggle(
            "selected",
            mode === "solo"
        );

    document
        .getElementById("duoMode")
        .classList.toggle(
            "selected",
            mode === "duo"
        );

}


/* =====================================================
   NOMBRE DE NIVEAUX
===================================================== */

function getMaxLevel() {

    if(difficulty === "easy")
        return 10;

    if(difficulty === "medium")
        return 15;

    return 23;

}


/* =====================================================
   DÉMARRAGE
===================================================== */

function startGame() {

    const pseudo =
        document
        .getElementById("pseudoInput")
        .value
        .trim();


    if(!pseudo) {

        alert(
            "Entre ton pseudo !"
        );

        return;

    }


    difficulty =
        document
        .getElementById("difficultySelect")
        .value;


    maxLevel =
        getMaxLevel();


    player1Name.textContent =
        pseudo;


    if(gameMode === "solo") {

        player2Name.textContent =
            "";

        card2.style.display =
            "none";

    }

    else {

        const second =
            prompt(
                "Entre le pseudo du deuxième joueur :"
            );


        player2Name.textContent =
            second &&
            second.trim()
                ? second.trim()
                : "Joueur 2";


        card2.style.display =
            "block";

    }


    level = 1;

    score1 = 0;

    score2 = 0;

    currentPlayer = 1;

    gameRunning = true;


    /*
       Vitesse de départ :
       0.6 = rapide.
    */

    playerSpeedMultiplier =
        0.6;

    playerSpeedSelect.value =
        "0.6";

    updatePlayerSpeed();


    home.style.display =
        "none";

    gameScreen.style.display =
        "block";


    loadLevel();

}


/* =====================================================
   CHANGEMENT DE VITESSE
===================================================== */

playerSpeedSelect.addEventListener(
    "change",
    function() {

        playerSpeedMultiplier =
            parseFloat(this.value);


        updatePlayerSpeed();

    }
);


/* =====================================================
   GÉNÉRATEUR ALÉATOIRE
===================================================== */

function randomGenerator(seed) {

    let value = seed;

    return function() {

        value =
            (value * 9301 + 49297)
            % 233280;

        return value / 233280;

    };

}


/* =====================================================
   CRÉATION DU LABYRINTHE
===================================================== */

function generateMaze(levelNumber) {

    walls = [];

    robots = [];

    coins = [];


    let cols;

    let rows;


    /*
       Les premiers niveaux sont beaucoup
       plus faciles.
    */

    if(levelNumber <= 3) {

        cols =
            10 + levelNumber * 2;

        rows =
            7 + levelNumber;

    }

    else if(levelNumber <= 8) {

        cols =
            16 + levelNumber;

        rows =
            10 +
            Math.floor(
                levelNumber / 2
            );

    }

    else {

        cols =
            22 +
            Math.min(
                levelNumber,
                10
            );

        rows =
            13 +
            Math.min(
                Math.floor(
                    levelNumber / 2
                ),
                8
            );

    }


    const cellW =
        canvas.width / cols;

    const cellH =
        canvas.height / rows;


    const random =
        randomGenerator(
            levelNumber * 98431 +
            difficulty.length * 731
        );


    const cells = [];


    for(let y = 0; y < rows; y++) {

        cells[y] = [];

        for(let x = 0; x < cols; x++) {

            cells[y][x] = {

                visited: false,

                walls: {

                    top: true,

                    right: true,

                    bottom: true,

                    left: true

                }

            };

        }

    }


    const stack = [

        {
            x: 0,
            y: 0
        }

    ];


    cells[0][0].visited =
        true;


    while(stack.length > 0) {

        const current =
            stack[
                stack.length - 1
            ];


        const neighbours = [];


        if(
            current.y > 0 &&
            !cells[
                current.y - 1
            ][current.x].visited
        ) {

            neighbours.push({

                x: current.x,

                y: current.y - 1,

                direction: "top"

            });

        }


        if(
            current.x < cols - 1 &&
            !cells[
                current.y
            ][current.x + 1].visited
        ) {

            neighbours.push({

                x: current.x + 1,

                y: current.y,

                direction: "right"

            });

        }


        if(
            current.y < rows - 1 &&
            !cells[
                current.y + 1
            ][current.x].visited
        ) {

            neighbours.push({

                x: current.x,

                y: current.y + 1,

                direction: "bottom"

            });

        }


        if(
            current.x > 0 &&
            !cells[
                current.y
            ][current.x - 1].visited
        ) {

            neighbours.push({

                x: current.x - 1,

                y: current.y,

                direction: "left"

            });

        }


        if(neighbours.length === 0) {

            stack.pop();

            continue;

        }


        const next =
            neighbours[
                Math.floor(
                    random() *
                    neighbours.length
                )
            ];


        const cell =
            cells[
                current.y
            ][current.x];


        const nextCell =
            cells[
                next.y
            ][next.x];


        if(next.direction === "top") {

            cell.walls.top =
                false;

            nextCell.walls.bottom =
                false;

        }

        else if(next.direction === "right") {

            cell.walls.right =
                false;

            nextCell.walls.left =
                false;

        }

        else if(next.direction === "bottom") {

            cell.walls.bottom =
                false;

            nextCell.walls.top =
                false;

        }

        else {

            cell.walls.left =
                false;

            nextCell.walls.right =
                false;

        }


        nextCell.visited =
            true;


        stack.push({

            x: next.x,

            y: next.y

        });

    }


    const wallThickness =
        Math.max(
            2,
            7 -
            levelNumber * 0.12
        );


    for(let y = 0; y < rows; y++) {

        for(let x = 0; x < cols; x++) {

            const cell =
                cells[y][x];


            const px =
                x * cellW;


            const py =
                y * cellH;


            if(cell.walls.top) {

                walls.push({

                    x: px,

                    y: py,

                    w:
                        cellW +
                        wallThickness,

                    h:
                        wallThickness

                });

            }


            if(cell.walls.left) {

                walls.push({

                    x: px,

                    y: py,

                    w:
                        wallThickness,

                    h:
                        cellH +
                        wallThickness

                });

            }


            if(
                x === cols - 1 &&
                cell.walls.right
            ) {

                walls.push({

                    x:
                        px +
                        cellW,

                    y: py,

                    w:
                        wallThickness,

                    h:
                        cellH

                });

            }


            if(
                y === rows - 1 &&
                cell.walls.bottom
            ) {

                walls.push({

                    x: px,

                    y:
                        py +
                        cellH,

                    w:
                        cellW,

                    h:
                        wallThickness

                });

            }

        }

    }


    /*
       Départ.
    */

    player.x =
        cellW * 0.25;

    player.y =
        cellH * 0.25;


    /*
       Sortie.
    */

    exit.x =
        (cols - 1) * cellW +
        cellW * 0.35;


    exit.y =
        (rows - 1) * cellH +
        cellH * 0.35;


    exit.size =
        Math.max(
            12,
            Math.min(
                cellW,
                cellH
            ) * 0.30
        );


    /*
       Création des pièces.
       
       Elles sont placées dans des cellules
       différentes du départ et de la sortie.
    */

    createCoins(
        cells,
        cols,
        rows,
        cellW,
        cellH,
        random,
        levelNumber
    );


    /*
       ROBOTS UNIQUEMENT EN DUO.
    */

    if(gameMode === "solo") {

        robots = [];

        return;

    }


    let robotCount;


    if(levelNumber <= 3)
        robotCount = 0;

    else if(levelNumber <= 6)
        robotCount = 1;

    else if(levelNumber <= 10)
        robotCount = 2;

    else if(levelNumber <= 16)
        robotCount = 3;

    else
        robotCount =
            Math.min(
                4 +
                Math.floor(
                    levelNumber / 5
                ),
                8
            );


    const robotSpeed =
        0.7 +
        levelNumber * 0.13;


    for(
        let i = 0;
        i < robotCount;
        i++
    ) {

        const rx =
            cellW *
            (
                2 +
                Math.floor(
                    random() *
                    Math.max(
                        1,
                        cols - 4
                    )
                )
            );


        const ry =
            cellH *
            (
                1 +
                Math.floor(
                    random() *
                    Math.max(
                        1,
                        rows - 3
                    )
                )
            );


        robots.push({

            x: rx,

            y: ry,

            size:
                Math.max(
                    9,
                    Math.min(
                        cellW,
                        cellH
                    ) * 0.30
                ),

            speed:
                robotSpeed,

            direction:
                random() > 0.5
                    ? 1
                    : -1,

            horizontal:
                random() > 0.5

        });

    }

}


/* =====================================================
   CRÉATION DES PIÈCES
===================================================== */

function createCoins(
    cells,
    cols,
    rows,
    cellW,
    cellH,
    random,
    levelNumber
) {

    /*
       Plus le niveau avance,
       plus il y a de pièces.
    */

    const coinCount =
        Math.min(
            4 +
            Math.floor(
                levelNumber / 2
            ),
            15
        );


    /*
       On garde une liste des cellules
       déjà utilisées.
    */

    const used = new Set();


    /*
       On évite le départ.
    */

    used.add("0,0");


    /*
       On évite la sortie.
    */

    used.add(
        (cols - 1) +
        "," +
        (rows - 1)
    );


    for(
        let i = 0;
        i < coinCount;
        i++
    ) {

        let x;

        let y;

        let key;


        let tries = 0;


        do {

            x =
                1 +
                Math.floor(
                    random() *
                    Math.max(
                        1,
                        cols - 2
                    )
                );


            y =
                1 +
                Math.floor(
                    random() *
                    Math.max(
                        1,
                        rows - 2
                    )
                );


            key =
                x + "," + y;


            tries++;


        } while(
            used.has(key) &&
            tries < 100
        );


        if(used.has(key))
            continue;


        used.add(key);


        /*
           Environ 60% des pièces sont en or.
        */

        const isGold =
            random() < 0.60;


        coins.push({

            x:
                x * cellW +
                cellW * 0.35,

            y:
                y * cellH +
                cellH * 0.35,

            size:
                Math.min(
                    cellW,
                    cellH
                ) * 0.28,

            value:
                isGold
                    ? GOLD_VALUE
                    : SILVER_VALUE,

            type:
                isGold
                    ? "gold"
                    : "silver"

        });

    }

}


/* =====================================================
   COLLISION
===================================================== */

function isColliding(a, b) {

    return (

        a.x <
        b.x + b.w &&

        a.x + a.size >
        b.x &&

        a.y <
        b.y + b.h &&

        a.y + a.size >
        b.y

    );

}


/* =====================================================
   DÉPLACEMENT
===================================================== */

function movePlayer() {

    if(!gameRunning)
        return;


    let dx = 0;

    let dy = 0;


    if(
        keys["arrowright"] ||
        keys["d"]
    ) {

        dx +=
            player.speed;

    }


    if(
        keys["arrowleft"] ||
        keys["q"] ||
        keys["a"]
    ) {

        dx -=
            player.speed;

    }


    if(
        keys["arrowdown"] ||
        keys["s"]
    ) {

        dy +=
            player.speed;

    }


    if(
        keys["arrowup"] ||
        keys["z"] ||
        keys["w"]
    ) {

        dy -=
            player.speed;

    }


    if(dx === 0 && dy === 0)
        return;


    const oldX =
        player.x;

    const oldY =
        player.y;


    player.x += dx;

    player.y += dy;


    for(const wall of walls) {

        if(
            isColliding(
                player,
                wall
            )
        ) {

            player.x =
                oldX;

            player.y =
                oldY;


            lose(
                "💥 Tu as touché un mur !"
            );


            return;

        }

    }


    /*
       Vérification des pièces.
    */

    collectCoins();

}


/* =====================================================
   RAMASSER LES PIÈCES
===================================================== */

function collectCoins() {

    for(
        let i = coins.length - 1;
        i >= 0;
        i--
    ) {

        const coin =
            coins[i];


        const coinBox = {

            x: coin.x,

            y: coin.y,

            w: coin.size,

            h: coin.size

        };


        if(
            isColliding(
                player,
                coinBox
            )
        ) {

            /*
               La pièce disparaît.
            */

            if(currentPlayer === 1) {

                score1 +=
                    coin.value;

            }

            else {

                score2 +=
                    coin.value;

            }


            coins.splice(
                i,
                1
            );


            updateInterface();

        }

    }

}


/* =====================================================
   ROBOTS
===================================================== */

function updateRobots() {

    if(
        !gameRunning ||
        gameMode === "solo"
    )
        return;


    for(const robot of robots) {

        if(robot.horizontal) {

            robot.x +=
                robot.direction *
                robot.speed;


            if(
                robot.x < 15 ||
                robot.x >
                    canvas.width -
                    robot.size -
                    15
            ) {

                robot.direction *=
                    -1;

            }

        }

        else {

            robot.y +=
                robot.direction *
                robot.speed;


            if(
                robot.y < 15 ||
                robot.y >
                    canvas.height -
                    robot.size -
                    15
            ) {

                robot.direction *=
                    -1;

            }

        }


        const r = {

            x: robot.x,

            y: robot.y,

            w: robot.size,

            h: robot.size

        };


        if(
            isColliding(
                player,
                r
            )
        ) {

            lose(
                "🤖 Un robot t'a touché !"
            );

            return;

        }

    }

}


/* =====================================================
   SORTIE
===================================================== */

function checkExit() {

    if(!gameRunning)
        return;


    const e = {

        x: exit.x,

        y: exit.y,

        w: exit.size,

        h: exit.size

    };


    if(
        isColliding(
            player,
            e
        )
    ) {

        levelComplete();

    }

}


/* =====================================================
   FIN DU NIVEAU
===================================================== */

function levelComplete() {

    gameRunning = false;


    /*
       Bonus de fin de niveau.
    */

    const gain =
        Math.max(
            1,
            5 -
            Math.floor(
                (level - 1) / 5
            )
        );


    if(currentPlayer === 1)
        score1 += gain;

    else
        score2 += gain;


    updateInterface();


    if(level >= maxLevel) {

        finalVictory();

        return;

    }


    messageTitle.textContent =
        "🏆 Niveau terminé !";


    messageText.textContent =
        "Bravo ! +" +
        gain +
        " points";


    document
        .getElementById("nextButton")
        .style.display =
            "inline-block";


    document
        .getElementById("restartButton")
        .style.display =
            "inline-block";


    message.style.display =
        "flex";

}


/* =====================================================
   CONTINUER
===================================================== */

function continueAfterMessage() {

    message.style.display =
        "none";


    if(gameMode === "duo") {

        currentPlayer =
            currentPlayer === 1
                ? 2
                : 1;

    }

    else {

        currentPlayer = 1;

    }


    level++;

    loadLevel();

}


/* =====================================================
   PERDRE
===================================================== */

function lose(reason) {

    if(!gameRunning)
        return;


    gameRunning = false;


    const penalty =
        Math.min(
            6,
            2 +
            Math.floor(
                level / 5
            )
        );


    if(currentPlayer === 1)
        score1 -= penalty;

    else
        score2 -= penalty;


    /*
       IMPORTANT :
       le score reste négatif si nécessaire.
    */

    messageTitle.textContent =
        "💀 GAME OVER";


    messageText.textContent =
        reason +
        "  -" +
        penalty +
        " points";


    if(gameMode === "solo") {

        document
            .getElementById("nextButton")
            .style.display =
                "none";

    }

    else {

        document
            .getElementById("nextButton")
            .style.display =
                "inline-block";

    }


    document
        .getElementById("restartButton")
        .style.display =
            "inline-block";


    message.style.display =
        "flex";


    updateInterface();

}


/* =====================================================
   RECOMMENCER
===================================================== */

function restartLevel() {

    message.style.display =
        "none";

    gameRunning = true;

    loadLevel();

}


/* =====================================================
   VICTOIRE
===================================================== */

function finalVictory() {

    gameRunning = false;


    messageTitle.textContent =
        "🏆 VICTOIRE !";


    if(gameMode === "solo") {

        messageText.textContent =
            "Tu as terminé les " +
            maxLevel +
            " niveaux ! Score : " +
            score1;

    }

    else {

        let winner;

        if(score1 > score2) {

            winner =
                player1Name.textContent;

        }

        else if(score2 > score1) {

            winner =
                player2Name.textContent;

        }

        else {

            winner =
                "Égalité";

        }


        messageText.textContent =
            "Fin de la partie ! " +
            player1Name.textContent +
            " : " +
            score1 +
            " points — " +
            player2Name.textContent +
            " : " +
            score2 +
            " points. " +
            "🏆 " +
            winner;

    }


    document
        .getElementById("nextButton")
        .style.display =
            "none";


    document
        .getElementById("restartButton")
        .style.display =
            "none";


    message.style.display =
        "flex";

}


/* =====================================================
   RETOUR ACCUEIL
===================================================== */

function goHome() {

    gameRunning = false;

    message.style.display =
        "none";

    gameScreen.style.display =
        "none";

    home.style.display =
        "flex";

}


/* =====================================================
   INTERFACE
===================================================== */

function updateInterface() {

    levelText.textContent =
        level;


    maxLevelText.textContent =
        maxLevel;


    /*
       Affichage avec les décimales.
    */

    score1Text.textContent =
        Number(score1).toFixed(
            score1 % 1 === 0
                ? 0
                : 1
        );


    score2Text.textContent =
        Number(score2).toFixed(
            score2 % 1 === 0
                ? 0
                : 1
        );


    playerSpeedSelect.value =
        String(
            playerSpeedMultiplier
        );


    if(gameMode === "solo") {

        robotSpeedText.textContent =
            "—";


        card1.classList.add(
            "active"
        );

        card1.classList.remove(
            "inactive"
        );


        document
            .getElementById("turn1")
            .textContent =
                "🟢 Tu joues";


        return;

    }


    const robotSpeed =
        0.7 +
        level * 0.13;


    robotSpeedText.textContent =
        robotSpeed.toFixed(1);


    card1.classList.remove(
        "active",
        "inactive"
    );

    card2.classList.remove(
        "active",
        "inactive"
    );


    if(currentPlayer === 1) {

        card1.classList.add(
            "active"
        );

        card2.classList.add(
            "inactive"
        );


        document
            .getElementById("turn1")
            .textContent =
                "🟢 Tour de " +
                player1Name.textContent;


        document
            .getElementById("turn2")
            .textContent =
                "🔴 Pas son tour";

    }

    else {

        card2.classList.add(
            "active"
        );

        card1.classList.add(
            "inactive"
        );


        document
            .getElementById("turn2")
            .textContent =
                "🟢 Tour de " +
                player2Name.textContent;


        document
            .getElementById("turn1")
            .textContent =
                "🔴 Pas son tour";

    }

}


/* =====================================================
   DESSIN
===================================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#222";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Murs.
    */

    ctx.fillStyle =
        "#eeeeee";


    for(const wall of walls) {

        ctx.fillRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

    }


    /*
       Pièces.
    */

    for(const coin of coins) {

        const centerX =
            coin.x +
            coin.size / 2;

        const centerY =
            coin.y +
            coin.size / 2;

        const radius =
            coin.size / 2;


        /*
           OR.
        */

        if(coin.type === "gold") {

            ctx.beginPath();

            ctx.arc(
                centerX,
                centerY,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#FFD700";

            ctx.fill();

            ctx.lineWidth = 2;

            ctx.strokeStyle =
                "#fff0a0";

            ctx.stroke();


            /*
               Petit symbole +.
            */

            ctx.fillStyle =
                "#8a6500";

            ctx.font =
                Math.max(
                    8,
                    radius
                ) +
                "px Arial";

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.fillText(
                "2",
                centerX,
                centerY
            );

        }

        /*
           ARGENT.
        */

        else {

            ctx.beginPath();

            ctx.arc(
                centerX,
                centerY,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#D9DDE2";

            ctx.fill();

            ctx.lineWidth = 2;

            ctx.strokeStyle =
                "#ffffff";

            ctx.stroke();


            ctx.fillStyle =
                "#68717c";

            ctx.font =
                Math.max(
                    8,
                    radius
                ) +
                "px Arial";

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.fillText(
                "0.5",
                centerX,
                centerY
            );

        }

    }


    /*
       Sortie.
    */

    ctx.fillStyle =
        "#00ff66";


    ctx.fillRect(
        exit.x,
        exit.y,
        exit.size,
        exit.size
    );


    /*
       Robots.
    */

    for(const robot of robots) {

        ctx.fillStyle =
            "#ff3030";


        ctx.fillRect(
            robot.x,
            robot.y,
            robot.size,
            robot.size
        );


        ctx.fillStyle =
            "white";


        const eye =
            Math.max(
                2,
                robot.size * 0.18
            );


        ctx.fillRect(
            robot.x +
            robot.size * 0.20,

            robot.y +
            robot.size * 0.20,

            eye,
            eye
        );


        ctx.fillRect(
            robot.x +
            robot.size * 0.62,

            robot.y +
            robot.size * 0.20,

            eye,
            eye
        );

    }


    /*
       Joueur bleu.
    */

    ctx.fillStyle =
        "#3498ff";


    ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
    );

}


/* =====================================================
   CLAVIER
===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        const key =
            e.key.toLowerCase();


        if([
            "arrowup",
            "arrowdown",
            "arrowleft",
            "arrowright",
            " "
        ].includes(key)) {

            e.preventDefault();

        }


        keys[key] = true;

    }
);


document.addEventListener(
    "keyup",
    function(e) {

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


/* =====================================================
   TOUCHES TELEPHONE
===================================================== */

function setupTouchButton(
    id,
    key
) {

    const button =
        document.getElementById(id);


    button.addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            keys[key] = true;

        },
        {
            passive: false
        }
    );


    button.addEventListener(
        "touchend",
        function(e) {

            e.preventDefault();

            keys[key] = false;

        },
        {
            passive: false
        }
    );


    button.addEventListener(
        "touchcancel",
        function(e) {

            e.preventDefault();

            keys[key] = false;

        },
        {
            passive: false
        }
    );


    button.addEventListener(
        "mousedown",
        function() {

            keys[key] = true;

        }
    );


    button.addEventListener(
        "mouseup",
        function() {

            keys[key] = false;

        }
    );


    button.addEventListener(
        "mouseleave",
        function() {

            keys[key] = false;

        }
    );

}


setupTouchButton(
    "upButton",
    "arrowup"
);

setupTouchButton(
    "downButton",
    "arrowdown"
);

setupTouchButton(
    "leftButton",
    "arrowleft"
);

setupTouchButton(
    "rightButton",
    "arrowright"
);


/* =====================================================
   CHARGEMENT
===================================================== */

function loadLevel() {

    updatePlayerSpeed();

    generateMaze(level);

    updateInterface();

}


/* =====================================================
   BOUCLE PRINCIPALE
===================================================== */

function gameLoop() {

    if(gameRunning) {

        movePlayer();

        updateRobots();

        checkExit();

    }


    draw();


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   DÉMARRAGE
===================================================== */

gameLoop();

</script>
