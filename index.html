<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no"
>

<title>Labyrinthe Hardcore</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
    overflow-y: auto;
    touch-action: manipulation;
}


/* =====================================================
   BARRE DU HAUT
===================================================== */

#top {
    min-height: 70px;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 35px;

    background: #181818;

    font-size: 20px;

    flex-wrap: wrap;

    padding: 10px;
}


/* =====================================================
   CANVAS
===================================================== */

canvas {
    display: block;

    width: 900px;
    height: 600px;

    max-width: 95vw;
    height: auto;

    margin: 10px auto;

    border: 4px solid white;

    background: #222;
}


/* =====================================================
   MESSAGE
===================================================== */

#message {
    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    background: rgba(0,0,0,.92);

    z-index: 100;
}

#message h1 {
    font-size: 65px;
    margin: 10px;
}

#message p {
    font-size: 24px;
    margin: 15px;
}

button {
    padding: 14px 30px;

    font-size: 20px;

    cursor: pointer;

    border: none;

    border-radius: 8px;
}


/* =====================================================
   BOUTONS TELEPHONE
===================================================== */

#mobileControls {
    display: none;

    width: 230px;

    margin: 10px auto 30px;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;
}

.mobileRow {
    display: flex;

    justify-content: center;

    gap: 8px;
}

.mobileButton {
    width: 68px;
    height: 68px;

    padding: 0;

    border: 2px solid white;

    border-radius: 12px;

    background: #333;

    color: white;

    font-size: 30px;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;

    -webkit-tap-highlight-color: transparent;
}

.mobileButton:active {
    background: #666;
    transform: scale(.94);
}


/* =====================================================
   TELEPHONE
===================================================== */

@media (max-width: 700px) {

    #top {
        min-height: 60px;

        gap: 8px 15px;

        font-size: 14px;
    }

    canvas {
        width: 96vw;

        height: auto;

        margin: 8px auto;

        border-width: 3px;
    }

    #mobileControls {
        display: block;
    }

    #message h1 {
        font-size: 42px;
    }

    #message p {
        font-size: 18px;

        padding: 0 20px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     BARRE DU HAUT
===================================================== -->

<div id="top">

    <div>
        Niveau :
        <span id="level">1</span>/23
    </div>

    <div>
        Score :
        <span id="score">0</span>
    </div>

    <div>
        Vitesse joueur :
        <span id="playerSpeed">6</span>
    </div>

    <div>
        Vitesse robots :
        <span id="robotSpeed">1</span>
    </div>

</div>


<!-- =====================================================
     JEU
===================================================== -->

<canvas
    id="game"
    width="900"
    height="600">
</canvas>


<!-- =====================================================
     COMMANDES TELEPHONE
===================================================== -->

<div id="mobileControls">

    <div class="mobileRow">

        <button
            class="mobileButton"
            data-key="arrowup">
            ⬆️
        </button>

    </div>


    <div class="mobileRow">

        <button
            class="mobileButton"
            data-key="arrowleft">
            ⬅️
        </button>

        <button
            class="mobileButton"
            data-key="arrowdown">
            ⬇️
        </button>

        <button
            class="mobileButton"
            data-key="arrowright">
            ➡️
        </button>

    </div>

</div>


<!-- =====================================================
     MESSAGE
===================================================== -->

<div id="message">

    <h1 id="messageTitle"></h1>

    <p id="messageText"></p>

    <button onclick="restartLevel()">
        Recommencer le niveau
    </button>

</div>


<script>


/* =====================================================
   CONFIGURATION
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


const levelText =
    document.getElementById("level");

const scoreText =
    document.getElementById("score");

const playerSpeedText =
    document.getElementById("playerSpeed");

const robotSpeedText =
    document.getElementById("robotSpeed");


const message =
    document.getElementById("message");

const messageTitle =
    document.getElementById("messageTitle");

const messageText =
    document.getElementById("messageText");


/* =====================================================
   VARIABLES
===================================================== */

let level = 1;

const MAX_LEVEL = 23;

let score = 0;

let gameRunning = true;

let walls = [];

let robots = [];


/* =====================================================
   SORTIE
===================================================== */

let exit = {

    x: 0,

    y: 0,

    size: 16

};


/* =====================================================
   JOUEUR
===================================================== */

const player = {

    x: 0,

    y: 0,

    size: 12,

    speed: 6

};


/* =====================================================
   TOUCHES
===================================================== */

const keys = {};


/* =====================================================
   CLAVIER
===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        const key =
            e.key.toLowerCase();

        keys[key] = true;


        if([
            "arrowup",
            "arrowdown",
            "arrowleft",
            "arrowright",
            " "
        ].includes(key)) {

            e.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    function(e) {

        const key =
            e.key.toLowerCase();

        keys[key] = false;

    }
);


/* =====================================================
   COMMANDES TELEPHONE
===================================================== */

const mobileButtons =
    document.querySelectorAll(
        ".mobileButton"
    );


mobileButtons.forEach(
    function(button) {

        const key =
            button.dataset.key;


        button.addEventListener(
            "touchstart",
            function(e) {

                e.preventDefault();

                keys[key] = true;

            },
            { passive: false }
        );


        button.addEventListener(
            "touchend",
            function(e) {

                e.preventDefault();

                keys[key] = false;

            },
            { passive: false }
        );


        button.addEventListener(
            "touchcancel",
            function(e) {

                e.preventDefault();

                keys[key] = false;

            },
            { passive: false }
        );


        button.addEventListener(
            "touchmove",
            function(e) {

                e.preventDefault();

            },
            { passive: false }
        );

    }
);


/* =====================================================
   GENERATEUR ALEATOIRE
===================================================== */

function randomGenerator(seed) {

    let value = seed;


    return function() {

        value =
            (
                value * 9301 +
                49297
            ) % 233280;


        return value / 233280;

    };

}


/* =====================================================
   CREATION DU LABYRINTHE
===================================================== */

function generateMaze(levelNumber) {

    walls = [];

    robots = [];


    /*
       Difficulté progressive.

       Les premiers niveaux sont plus faciles.
       Les derniers deviennent beaucoup plus denses.
    */

    const cols =
        15 +
        Math.min(
            levelNumber,
            13
        );


    const rows =
        9 +
        Math.min(
            Math.floor(levelNumber / 2),
            10
        );


    const cellW =
        canvas.width / cols;


    const cellH =
        canvas.height / rows;


    const random =
        randomGenerator(
            levelNumber * 98431 + 17
        );


    let cells = [];


    /* Création des cellules */

    for(
        let y = 0;
        y < rows;
        y++
    ) {

        cells[y] = [];


        for(
            let x = 0;
            x < cols;
            x++
        ) {

            cells[y][x] = {

                visited: false,

                walls: {

                    top: true,

                    right: true,

                    bottom: true,

                    left: true

                }

            };

        }

    }


    /* =================================================
       GENERATION DFS
    ================================================= */

    let stack = [];


    const startX = 0;

    const startY = 0;


    cells[startY][startX].visited =
        true;


    stack.push({

        x: startX,

        y: startY

    });


    while(
        stack.length > 0
    ) {

        const current =
            stack[
                stack.length - 1
            ];


        let neighbours = [];


        /* HAUT */

        if(
            current.y > 0 &&
            !cells[
                current.y - 1
            ][
                current.x
            ].visited
        ) {

            neighbours.push({

                x: current.x,

                y: current.y - 1,

                direction: "top"

            });

        }


        /* DROITE */

        if(
            current.x < cols - 1 &&
            !cells[
                current.y
            ][
                current.x + 1
            ].visited
        ) {

            neighbours.push({

                x: current.x + 1,

                y: current.y,

                direction: "right"

            });

        }


        /* BAS */

        if(
            current.y < rows - 1 &&
            !cells[
                current.y + 1
            ][
                current.x
            ].visited
        ) {

            neighbours.push({

                x: current.x,

                y: current.y + 1,

                direction: "bottom"

            });

        }


        /* GAUCHE */

        if(
            current.x > 0 &&
            !cells[
                current.y
            ][
                current.x - 1
            ].visited
        ) {

            neighbours.push({

                x: current.x - 1,

                y: current.y,

                direction: "left"

            });

        }


        /* Choix */

        if(
            neighbours.length > 0
        ) {

            const next =
                neighbours[
                    Math.floor(
                        random() *
                        neighbours.length
                    )
                ];


            const cell =
                cells[
                    current.y
                ][
                    current.x
                ];


            const nextCell =
                cells[
                    next.y
                ][
                    next.x
                ];


            if(
                next.direction ===
                "top"
            ) {

                cell.walls.top =
                    false;

                nextCell.walls.bottom =
                    false;

            }


            else if(
                next.direction ===
                "right"
            ) {

                cell.walls.right =
                    false;

                nextCell.walls.left =
                    false;

            }


            else if(
                next.direction ===
                "bottom"
            ) {

                cell.walls.bottom =
                    false;

                nextCell.walls.top =
                    false;

            }


            else if(
                next.direction ===
                "left"
            ) {

                cell.walls.left =
                    false;

                nextCell.walls.right =
                    false;

            }


            nextCell.visited =
                true;


            stack.push({

                x: next.x,

                y: next.y

            });

        }

        else {

            stack.pop();

        }

    }


    /* =================================================
       MURS
    ================================================= */

    /*
       Les murs deviennent légèrement plus fins
       dans les niveaux avancés.
    */

    const wallThickness =
        Math.max(
            3,
            7 -
            levelNumber * 0.12
        );


    for(
        let y = 0;
        y < rows;
        y++
    ) {

        for(
            let x = 0;
            x < cols;
            x++
        ) {

            const cell =
                cells[y][x];


            const px =
                x * cellW;


            const py =
                y * cellH;


            /* HAUT */

            if(cell.walls.top) {

                walls.push({

                    x: px,

                    y: py,

                    w:
                        cellW +
                        wallThickness,

                    h:
                        wallThickness

                });

            }


            /* GAUCHE */

            if(cell.walls.left) {

                walls.push({

                    x: px,

                    y: py,

                    w:
                        wallThickness,

                    h:
                        cellH +
                        wallThickness

                });

            }


            /* DROITE */

            if(
                x === cols - 1 &&
                cell.walls.right
            ) {

                walls.push({

                    x:
                        px + cellW,

                    y: py,

                    w:
                        wallThickness,

                    h:
                        cellH

                });

            }


            /* BAS */

            if(
                y === rows - 1 &&
                cell.walls.bottom
            ) {

                walls.push({

                    x: px,

                    y:
                        py + cellH,

                    w:
                        cellW,

                    h:
                        wallThickness

                });

            }

        }

    }


    /* =================================================
       DEPART
    ================================================= */

    player.x =
        cellW * 0.25;


    player.y =
        cellH * 0.25;


    /* =================================================
       SORTIE
    ================================================= */

    exit.x =
        (cols - 1) *
        cellW +
        cellW * 0.30;


    exit.y =
        (rows - 1) *
        cellH +
        cellH * 0.30;


    exit.size =
        Math.max(
            12,
            Math.min(
                cellW,
                cellH
            ) * 0.32
        );


    /* =================================================
       ROBOTS
    ================================================= */

    /*
       Très peu de robots au début.
       Plus de robots ensuite.
    */

    const robotCount =
        Math.min(
            Math.floor(
                levelNumber / 2
            ),
            10
        );


    const robotSpeed =
        1 +
        levelNumber * 0.20;


    for(
        let i = 0;
        i < robotCount;
        i++
    ) {

        let rx =
            cellW *
            (
                2 +
                Math.floor(
                    random() *
                    Math.max(
                        1,
                        cols - 4
                    )
                )
            );


        let ry =
            cellH *
            (
                1 +
                Math.floor(
                    random() *
                    Math.max(
                        1,
                        rows - 3
                    )
                )
            );


        robots.push({

            x: rx,

            y: ry,

            size:
                Math.max(
                    10,
                    Math.min(
                        cellW,
                        cellH
                    ) * 0.30
                ),

            speed:
                robotSpeed,

            direction:
                random() > 0.5
                    ? 1
                    : -1,

            horizontal:
                random() > 0.5

        });

    }

}


/* =====================================================
   COLLISION
===================================================== */

function isColliding(a, b) {

    return (

        a.x <
        b.x + b.w

        &&

        a.x + a.size >
        b.x

        &&

        a.y <
        b.y + b.h

        &&

        a.y + a.size >
        b.y

    );

}


/* =====================================================
   DEPLACEMENT JOUEUR
===================================================== */

function movePlayer() {

    if(!gameRunning)
        return;


    let dx = 0;

    let dy = 0;


    if(
        keys["arrowright"] ||
        keys["d"]
    ) {

        dx += player.speed;

    }


    if(
        keys["arrowleft"] ||
        keys["q"] ||
        keys["a"]
    ) {

        dx -= player.speed;

    }


    if(
        keys["arrowdown"] ||
        keys["s"]
    ) {

        dy += player.speed;

    }


    if(
        keys["arrowup"] ||
        keys["z"] ||
        keys["w"]
    ) {

        dy -= player.speed;

    }


    /* Diagonale */

    if(
        dx !== 0 &&
        dy !== 0
    ) {

        dx *= 0.7071;

        dy *= 0.7071;

    }


    /*
       Déplacement horizontal
       séparé du vertical.

       Ça évite qu'un mur bloque
       complètement le joueur.
    */

    const oldX =
        player.x;


    player.x += dx;


    let horizontalCollision =
        false;


    for(
        let wall of walls
    ) {

        if(
            isColliding(
                player,
                wall
            )
        ) {

            horizontalCollision =
                true;

            break;

        }

    }


    if(
        horizontalCollision
    ) {

        player.x =
            oldX;

    }


    /* Déplacement vertical */

    const oldY =
        player.y;


    player.y += dy;


    let verticalCollision =
        false;


    for(
        let wall of walls
    ) {

        if(
            isColliding(
                player,
                wall
            )
        ) {

            verticalCollision =
                true;

            break;

        }

    }


    if(
        verticalCollision
    ) {

        player.y =
            oldY;

    }


    /*
       Le joueur ne meurt plus simplement
       parce qu'il touche un mur.

       Il est bloqué contre le mur.
    */

}


/* =====================================================
   ROBOTS
===================================================== */

function updateRobots() {

    if(!gameRunning)
        return;


    for(
        let robot of robots
    ) {

        if(
            robot.horizontal
        ) {

            robot.x +=
                robot.direction *
                robot.speed;


            if(
                robot.x < 25 ||
                robot.x >
                canvas.width - 30
            ) {

                robot.direction *= -1;

            }

        }

        else {

            robot.y +=
                robot.direction *
                robot.speed;


            if(
                robot.y < 25 ||
                robot.y >
                canvas.height - 30
            ) {

                robot.direction *= -1;

            }

        }


        const r = {

            x: robot.x,

            y: robot.y,

            w: robot.size,

            h: robot.size

        };


        if(
            isColliding(
                player,
                r
            )
        ) {

            lose(
                "🤖 UN ROBOT T'A TOUCHÉ !"
            );

        }

    }

}


/* =====================================================
   SORTIE
===================================================== */

function checkExit() {

    if(!gameRunning)
        return;


    const e = {

        x: exit.x,

        y: exit.y,

        w: exit.size,

        h: exit.size

    };


    if(
        isColliding(
            player,
            e
        )
    ) {

        levelComplete();

    }

}


/* =====================================================
   NIVEAU TERMINE
===================================================== */

function levelComplete() {

    /*
       Empêche de valider deux fois
       le même niveau.
    */

    if(!gameRunning)
        return;


    gameRunning = false;


    const gain =
        Math.max(
            1,
            5 -
            Math.floor(
                (level - 1) / 5
            )
        );


    score += gain;


    if(
        level >= MAX_LEVEL
    ) {

        winGame();

        return;

    }


    /*
       Passage au niveau suivant.
    */

    level++;


    /*
       IMPORTANT :
       le jeu est réactivé AVANT
       de charger le nouveau niveau.
    */

    gameRunning = true;


    loadLevel();

}


/* =====================================================
   MORT
===================================================== */

function lose(reason) {

    if(!gameRunning)
        return;


    const penalty =
        Math.min(
            6,
            2 +
            Math.floor(
                level / 5
            )
        );


    score -= penalty;


    /*
       Le score peut maintenant
       réellement devenir négatif.
    */

    gameRunning = false;


    messageTitle.textContent =
        "LOOSERRRR 😈";


    messageText.textContent =
        reason +
        "  " +
        penalty +
        " points";


    message.style.display =
        "flex";


    updateInterface();

}


/* =====================================================
   RECOMMENCER
===================================================== */

function restartLevel() {

    message.style.display =
        "none";


    /*
       On vide les touches bloquées.
    */

    for(
        let key in keys
    ) {

        keys[key] = false;

    }


    gameRunning = true;


    loadLevel();

}


/* =====================================================
   VICTOIRE
===================================================== */

function winGame() {

    gameRunning = false;


    messageTitle.textContent =
        "🏆 VICTOIRE !";


    messageText.textContent =
        "TU AS TERMINÉ LES 23 NIVEAUX ! " +
        "Score : " +
        score;


    message.style.display =
        "flex";

}


/* =====================================================
   INTERFACE
===================================================== */

function updateInterface() {

    levelText.textContent =
        level;


    scoreText.textContent =
        score;


    playerSpeedText.textContent =
        player.speed;


    robotSpeedText.textContent =
        (
            1 +
            level * 0.20
        ).toFixed(1);

}


/* =====================================================
   DESSIN
===================================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Fond */

    ctx.fillStyle =
        "#222";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Murs */

    ctx.fillStyle =
        "#eeeeee";


    for(
        let wall of walls
    ) {

        ctx.fillRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

    }


    /* Sortie */

    ctx.fillStyle =
        "#00ff66";


    ctx.fillRect(
        exit.x,
        exit.y,
        exit.size,
        exit.size
    );


    /* Robots */

    for(
        let robot of robots
    ) {

        ctx.fillStyle =
            "#ff3030";


        ctx.fillRect(
            robot.x,
            robot.y,
            robot.size,
            robot.size
        );


        /* Yeux */

        ctx.fillStyle =
            "white";


        const eyeSize =
            Math.max(
                2,
                robot.size * 0.18
            );


        ctx.fillRect(

            robot.x +
            robot.size * 0.20,

            robot.y +
            robot.size * 0.20,

            eyeSize,

            eyeSize

        );


        ctx.fillRect(

            robot.x +
            robot.size * 0.62,

            robot.y +
            robot.size * 0.20,

            eyeSize,

            eyeSize

        );

    }


    /* Joueur bleu */

    ctx.fillStyle =
        "#3498ff";


    ctx.fillRect(

        player.x,

        player.y,

        player.size,

        player.size

    );

}


/* =====================================================
   BOUCLE PRINCIPALE
===================================================== */

function gameLoop() {

    if(gameRunning) {

        movePlayer();

        updateRobots();

        checkExit();

    }


    draw();


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   CHARGEMENT DU NIVEAU
===================================================== */

function loadLevel() {

    /*
       On s'assure que le niveau
       reste valide.
    */

    if(level < 1)
        level = 1;


    if(level > MAX_LEVEL)
        level = MAX_LEVEL;


    generateMaze(level);


    updateInterface();


    /*
       Sécurité supplémentaire :
       chaque nouveau niveau
       démarre bien actif.
    */

    gameRunning = true;

}


/* =====================================================
   DEMARRAGE
===================================================== */

loadLevel();

gameLoop();

</script>

</body>
</html>
