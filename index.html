<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Escape</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* =========================
   ATELIER
========================= */

#atelier {
    position: fixed;
    inset: 0;
    background: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

.panel {
    width: 420px;
    max-width: 90%;
    padding: 35px;
    background: #111;
    border: 3px solid #174bff;
    border-radius: 15px;
    box-shadow: 0 0 30px rgba(23, 75, 255, 0.4);
}

h1 {
    text-align: center;
    color: #00aaff;
    margin-top: 0;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    color: #aaa;
}

input,
select {
    width: 100%;
    padding: 13px;
    background: #222;
    border: 2px solid #333;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #174bff;
}

.mode {
    display: flex;
    gap: 10px;
}

.mode button {
    flex: 1;
    padding: 13px;
    border: 2px solid #333;
    background: #222;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.mode button.active {
    background: #174bff;
    border-color: #4f70ff;
}

#startButton {
    width: 100%;
    margin-top: 30px;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #008cff;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#startButton:hover {
    background: #00aaff;
}


/* =========================
   JEU
========================= */

#game {
    display: none;
}

#top {
    height: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 60px;
    background: #111;
    font-size: 20px;
    font-weight: bold;
}

#gameContainer {
    height: calc(100vh - 60px);
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    max-width: 96vw;
    max-height: 88vh;
    background: black;
}
</style>
</head>

<body>


<!-- =========================
     ATELIER
========================= -->

<div id="atelier">

    <div class="panel">

        <h1>BLUE ESCAPE</h1>

        <label for="pseudo">
            Pseudo
        </label>

        <input
            id="pseudo"
            type="text"
            placeholder="Ton pseudo"
            maxlength="15"
        >


        <label for="language">
            Langue
        </label>

        <select id="language">

            <option value="fr">
                Français
            </option>

            <option value="en">
                English
            </option>

            <option value="es">
                Español
            </option>

            <option value="ar">
                العربية
            </option>

        </select>


        <label for="region">
            Région
        </label>

        <select id="region">

            <option>
                Maroc
            </option>

            <option>
                France
            </option>

            <option>
                Espagne
            </option>

            <option>
                États-Unis
            </option>

            <option>
                Royaume-Uni
            </option>

            <option>
                Autre
            </option>

        </select>


        <label>
            Mode
        </label>

        <div class="mode">

            <button
                id="soloButton"
                class="active"
                onclick="selectMode('solo')"
            >
                👤 Solo
            </button>

            <button
                id="duoButton"
                onclick="selectMode('duo')"
            >
                👥 Duo
            </button>

        </div>


        <button
            id="startButton"
            onclick="startGame()"
        >
            JOUER
        </button>

    </div>

</div>


<!-- =========================
     JEU
========================= -->

<div id="game">

    <div id="top">

        <div>
            ⏱️ <span id="timer">00:00</span>
        </div>

        <div>
            👹 <span id="enemyCount">1</span>
        </div>

        <div id="playerName">
            Joueur
        </div>

    </div>


    <div id="gameContainer">

        <canvas id="canvas"></canvas>

    </div>

</div>


<script>

/* ==================================================
   CONFIGURATION ATELIER
================================================== */

let selectedMode = "solo";

let pseudo = "";
let language = "fr";
let region = "";


function selectMode(mode) {

    selectedMode = mode;

    document
        .getElementById("soloButton")
        .classList.remove("active");

    document
        .getElementById("duoButton")
        .classList.remove("active");


    if (mode === "solo") {

        document
            .getElementById("soloButton")
            .classList.add("active");

    } else {

        document
            .getElementById("duoButton")
            .classList.add("active");

    }
}


function startGame() {

    pseudo =
        document
            .getElementById("pseudo")
            .value
            .trim();


    if (pseudo === "") {
        pseudo = "Joueur";
    }


    language =
        document
            .getElementById("language")
            .value;


    region =
        document
            .getElementById("region")
            .value;


    document
        .getElementById("playerName")
        .textContent = pseudo;


    document
        .getElementById("atelier")
        .style.display = "none";


    document
        .getElementById("game")
        .style.display = "block";


    initGame();
}


/* ==================================================
   JEU
================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


const tile = 32;


/* ==================================================
   MAP
================================================== */

const map = [

"#####################",
"#P....#.......#....#",
"#.###.#.#####.#.###.#",
"#.....#...#...#.....#",
"#####.###.#.###.#####",
"#.........#.........#",
"#.###.#########.###.#",
"#...#....#....#...#.#",
"###.#.##.#.##.#.#.#.#",
"#...#.#.......#.#...#",
"#.###.#.#######.###.#",
"#.....#....#....#...#",
"#####.###.#.###.#####",
"#.........#.........#",
"#.###.#########.###.#",
"#.....#.......#.....#",
"###.#.#.#####.#.#.###",
"#...#...#...#...#...#",
"#.#######.#.#######.#",
"#...................#",
"#####################"

];


const rows = map.length;
const cols = map[0].length;


canvas.width =
    cols * tile;

canvas.height =
    rows * tile;


/* ==================================================
   JOUEUR
================================================== */

let player;

let enemies = [];

let startTime;

let lastEnemyCount = 1;


/* ==================================================
   TOUCHES
================================================== */

const keys = {};

document.addEventListener(
    "keydown",
    e => {

        keys[e.key.toLowerCase()] = true;

    }
);

document.addEventListener(
    "keyup",
    e => {

        keys[e.key.toLowerCase()] = false;

    }
);


/* ==================================================
   INITIALISATION
================================================== */

function initGame() {

    player = {

        x: 0,
        y: 0,

        speed: 5,

        walk: 0

    };


    enemies = [];

    lastEnemyCount = 1;

    startTime = Date.now();


    for (
        let y = 0;
        y < rows;
        y++
    ) {

        for (
            let x = 0;
            x < cols;
            x++
        ) {

            if (
                map[y][x] === "P"
            ) {

                player.x =
                    x * tile +
                    tile / 2;

                player.y =
                    y * tile +
                    tile / 2;

            }

        }

    }


    createEnemy();


    gameLoop();
}


/* ==================================================
   MURS
================================================== */

function isWall(x, y) {

    const col =
        Math.floor(x / tile);

    const row =
        Math.floor(y / tile);


    if (
        row < 0 ||
        row >= rows ||
        col < 0 ||
        col >= cols
    ) {

        return true;

    }


    return map[row][col] === "#";
}


function canMove(x, y) {

    const size = 9;


    return (

        !isWall(
            x - size,
            y - size
        )

        &&

        !isWall(
            x + size,
            y - size
        )

        &&

        !isWall(
            x - size,
            y + size
        )

        &&

        !isWall(
            x + size,
            y + size
        )

    );

}


/* ==================================================
   JOUEUR
================================================== */

function movePlayer() {

    let dx = 0;
    let dy = 0;


    if (
        keys["arrowup"] ||
        keys["z"] ||
        keys["w"]
    ) {

        dy = -player.speed;

    }


    if (
        keys["arrowdown"] ||
        keys["s"]
    ) {

        dy = player.speed;

    }


    if (
        keys["arrowleft"] ||
        keys["q"] ||
        keys["a"]
    ) {

        dx = -player.speed;

    }


    if (
        keys["arrowright"] ||
        keys["d"]
    ) {

        dx = player.speed;

    }


    if (
        dx !== 0 ||
        dy !== 0
    ) {

        player.walk += 0.35;

    }


    if (
        canMove(
            player.x + dx,
            player.y
        )
    ) {

        player.x += dx;

    }


    if (
        canMove(
            player.x,
            player.y + dy
        )
    ) {

        player.y += dy;

    }

}


/* ==================================================
   ENNEMIS
================================================== */

const enemyStarts = [

    [10, 9],
    [9, 5],
    [11, 15],
    [5, 19],
    [15, 19],
    [19, 9],
    [3, 13],
    [17, 13]

];


function createEnemy() {

    const index =
        enemies.length;


    const pos =
        enemyStarts[
            index %
            enemyStarts.length
        ];


    enemies.push({

        x:
            pos[0] * tile +
            tile / 2,

        y:
            pos[1] * tile +
            tile / 2,

        speed:
            2.8 +
            index * 0.1,

        direction:
            null

    });

}


/* ==================================================
   DIRECTION DE LA TÊTE
================================================== */

function getPossibleDirections(enemy) {

    const directions = [

        { x: 1, y: 0 },

        { x: -1, y: 0 },

        { x: 0, y: 1 },

        { x: 0, y: -1 }

    ];


    return directions.filter(
        dir => {

            return canMove(

                enemy.x +
                dir.x * tile,

                enemy.y +
                dir.y * tile

            );

        }
    );

}


/* ==================================================
   LA TÊTE POURSUIT LE JOUEUR
================================================== */

function chooseBestDirection(enemy) {

    const possible =
        getPossibleDirections(enemy);


    if (
        possible.length === 0
    ) {

        return;

    }


    let best = possible[0];

    let bestDistance = Infinity;


    for (
        const dir of possible
    ) {

        /*
           Position future
        */

        const futureX =
            enemy.x +
            dir.x * tile;

        const futureY =
            enemy.y +
            dir.y * tile;


        /*
           Distance entre la future
           position de la tête et
           le joueur.
        */

        const dx =
            player.x -
            futureX;

        const dy =
            player.y -
            futureY;


        const distance =
            dx * dx +
            dy * dy;


        if (
            distance <
            bestDistance
        ) {

            bestDistance =
                distance;

            best = dir;

        }

    }


    enemy.direction = best;

}


/* ==================================================
   MOUVEMENT TÊTE
================================================== */

function moveEnemy(enemy) {

    /*
       Si elle n'a pas de direction,
       elle cherche le joueur.
    */

    if (!enemy.direction) {

        chooseBestDirection(enemy);

    }


    /*
       Vérifie régulièrement
       la meilleure direction.
    */

    const possible =
        getPossibleDirections(enemy);


    if (
        possible.length > 2
    ) {

        chooseBestDirection(enemy);

    }


    const dx =
        enemy.direction.x *
        enemy.speed;


    const dy =
        enemy.direction.y *
        enemy.speed;


    if (
        canMove(
            enemy.x + dx,
            enemy.y
        )
    ) {

        enemy.x += dx;

    } else {

        chooseBestDirection(enemy);

    }


    if (
        canMove(
            enemy.x,
            enemy.y + dy
        )
    ) {

        enemy.y += dy;

    } else {

        chooseBestDirection(enemy);

    }


    /*
       Nouvelle décision aux
       intersections.
    */

    const centerX =
        Math.floor(
            enemy.x / tile
        ) * tile +
        tile / 2;


    const centerY =
        Math.floor(
            enemy.y / tile
        ) * tile +
        tile / 2;


    if (

        Math.abs(
            enemy.x -
            centerX
        ) < 2

        &&

        Math.abs(
            enemy.y -
            centerY
        ) < 2

    ) {

        enemy.x = centerX;
        enemy.y = centerY;

        chooseBestDirection(enemy);

    }

}


/* ==================================================
   DESSIN MAP
================================================== */

function drawMap() {

    for (
        let y = 0;
        y < rows;
        y++
    ) {

        for (
            let x = 0;
            x < cols;
            x++
        ) {

            if (
                map[y][x] === "#"
            ) {

                ctx.fillStyle =
                    "#123bff";


                ctx.fillRect(

                    x * tile,

                    y * tile,

                    tile,

                    tile

                );


                ctx.strokeStyle =
                    "#3155ff";


                ctx.strokeRect(

                    x * tile + 1,

                    y * tile + 1,

                    tile - 2,

                    tile - 2

                );

            } else {

                ctx.fillStyle =
                    "#050505";


                ctx.fillRect(

                    x * tile,

                    y * tile,

                    tile,

                    tile

                );

            }

        }

    }

}


/* ==================================================
   PERSONNAGE BLEU
================================================== */

function drawPlayer() {

    ctx.save();


    ctx.translate(
        player.x,
        player.y
    );


    ctx.fillStyle =
        "#00aaff";


    /*
       Tête
    */

    ctx.beginPath();

    ctx.arc(
        0,
        -7,
        9,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Corps
    */

    ctx.fillRect(
        -9,
        2,
        18,
        15
    );


    /*
       Bras
    */

    ctx.strokeStyle =
        "#00aaff";

    ctx.lineWidth = 5;

    ctx.lineCap =
        "round";


    const arm =
        Math.sin(
            player.walk
        ) * 5;


    ctx.beginPath();

    ctx.moveTo(
        -7,
        5
    );

    ctx.lineTo(
        -12,
        12 + arm
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        7,
        5
    );

    ctx.lineTo(
        12,
        12 - arm
    );

    ctx.stroke();


    /*
       Jambes
    */

    const leg =
        Math.sin(
            player.walk
        ) * 7;


    ctx.beginPath();

    ctx.moveTo(
        -4,
        16
    );

    ctx.lineTo(
        -7,
        27 + leg
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        4,
        16
    );

    ctx.lineTo(
        7,
        27 - leg
    );

    ctx.stroke();


    ctx.restore();

}


/* ==================================================
   TÊTE MÉCHANTE
================================================== */

function drawEnemy(enemy) {

    ctx.save();


    ctx.translate(
        enemy.x,
        enemy.y
    );


    ctx.fillStyle =
        "#e32626";


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        15,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Yeux
    */

    ctx.fillStyle =
        "white";


    ctx.beginPath();

    ctx.arc(
        -6,
        -4,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        6,
        -4,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Pupilles
    */

    ctx.fillStyle =
        "black";


    ctx.beginPath();

    ctx.arc(
        -6,
        -3,
        2,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        6,
        -3,
        2,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Sourcils
    */

    ctx.strokeStyle =
        "black";

    ctx.lineWidth = 3;


    ctx.beginPath();

    ctx.moveTo(
        -11,
        -9
    );

    ctx.lineTo(
        -3,
        -6
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        11,
        -9
    );

    ctx.lineTo(
        3,
        -6
    );

    ctx.stroke();


    /*
       Bouche mécontente
    */

    ctx.beginPath();

    ctx.moveTo(
        -7,
        8
    );

    ctx.quadraticCurveTo(
        0,
        2,
        7,
        8
    );

    ctx.stroke();


    ctx.restore();

}


/* ==================================================
   COLLISION
================================================== */

function checkCollision() {

    for (
        const enemy of enemies
    ) {

        const dx =
            player.x -
            enemy.x;


        const dy =
            player.y -
            enemy.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            distance < 24
        ) {

            alert(
                pseudo +
                " a été attrapé !"
            );


            location.reload();

        }

    }

}


/* ==================================================
   TIMER
================================================== */

function updateTimer() {

    const elapsed =
        Math.floor(
            (Date.now() -
            startTime) / 1000
        );


    const minutes =
        Math.floor(
            elapsed / 60
        );


    const seconds =
        elapsed % 60;


    document.getElementById(
        "timer"
    ).textContent =

        String(minutes)
            .padStart(2, "0")

        + ":" +

        String(seconds)
            .padStart(2, "0");


    /*
       +1 tête toutes les
       30 secondes.
    */

    const wanted =
        Math.floor(
            elapsed / 30
        ) + 1;


    if (
        wanted >
        lastEnemyCount
    ) {

        while (
            enemies.length <
            wanted
        ) {

            createEnemy();

        }


        lastEnemyCount =
            wanted;


        document.getElementById(
            "enemyCount"
        ).textContent =
            enemies.length;

    }

}


/* ==================================================
   BOUCLE
================================================== */

function gameLoop() {

    movePlayer();


    for (
        const enemy of enemies
    ) {

        moveEnemy(enemy);

    }


    drawMap();

    drawPlayer();


    for (
        const enemy of enemies
    ) {

        drawEnemy(enemy);

    }


    checkCollision();

    updateTimer();


    requestAnimationFrame(
        gameLoop
    );

}

</script>

</body>
</html>
