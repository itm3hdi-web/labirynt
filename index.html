<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pac-Man 2.0</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#fff;font-family:Arial,sans-serif;user-select:none}
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#080808}
.screen.active{display:flex}
.menu{width:min(92%,520px);padding:28px;border-radius:20px;background:#151515;text-align:center;box-shadow:0 0 35px #000}
.title{font-size:45px;font-weight:900;color:#ffd400}
.slogan{color:#aaa;margin:5px 0 22px}
input,select{width:100%;padding:13px;margin:6px 0;border:1px solid #333;border-radius:10px;background:#222;color:#fff}
.mainBtn,.secondaryBtn{width:100%;padding:14px;margin-top:8px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}
.mainBtn{background:#ffd400;color:#111}
.secondaryBtn{background:#292929;color:#fff}
.mode{display:flex;gap:8px;margin-top:8px}
.mode button{flex:1;padding:13px;border:0;border-radius:10px;background:#292929;color:#fff}
.mode button.selected{background:#ffd400;color:#111}

#game{display:none;position:absolute;inset:0}
#topbar{position:absolute;z-index:20;top:7px;left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;width:98%}
.info{padding:7px 11px;border-radius:9px;background:#171717;border:2px solid #333;text-align:center}
.activePlayer{background:#063d1b!important;border-color:#00ff55!important}
.inactivePlayer{background:#410808!important;border-color:#ff2222!important}
#pauseBtn{background:#ffd400;color:#111;cursor:pointer}
#gameArea{position:absolute;top:70px;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:96vw;max-height:82vh;background:#050505}

#mobileControls{display:none;position:absolute;inset:0;z-index:30;pointer-events:none}
.dpad{position:absolute;left:18px;bottom:18px;width:180px;height:180px;pointer-events:auto}
.dpad button{position:absolute;width:62px;height:62px;border:0;border-radius:15px;background:rgba(255,212,0,.8);font-size:25px;touch-action:none}
.up{top:0;left:59px}.down{bottom:0;left:59px}.left{left:0;top:59px}.right{right:0;top:59px}
.joystick{position:absolute;right:20px;bottom:25px;width:155px;height:155px;border:4px solid #777;border-radius:50%;background:#ffffff0d;pointer-events:auto}
.stick{position:absolute;width:58px;height:58px;border-radius:50%;background:#ffd400;left:50%;top:50%;transform:translate(-50%,-50%)}

.overlay{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#000c;text-align:center}
.overlayBox{width:min(90%,450px);padding:30px;border-radius:20px;background:#151515}
.overlayTitle{font-size:35px;font-weight:900;color:#ffd400}

.settingsRow{display:flex;gap:8px;align-items:center;margin:7px 0}
.settingsRow label{flex:1;text-align:left}
.settingsRow button,.settingsRow select{width:180px;margin:0}
.keyBtn{padding:10px;border:0;border-radius:8px;background:#292929;color:#fff}

@media(max-width:700px){
#topbar{font-size:11px;top:4px}
.info{padding:5px 7px;min-width:62px}
#gameArea{top:105px}
#mobileControls{display:block}
.menu{padding:20px}
.title{font-size:36px}
}
</style>
</head>

<body>

<div id="menuScreen" class="screen active">
<div class="menu">
<div class="title">PAC-MAN 2.0</div>
<div class="slogan">Fuis. Survis. Ne regarde jamais derrière toi.</div>

<input id="pseudo1" placeholder="Pseudo joueur 1">
<input id="pseudo2" placeholder="Pseudo joueur 2" style="display:none">

<select id="language">
<option value="fr">Français</option>
<option value="ar">العربية</option>
<option value="en">English</option>
</select>

<select id="region">
<option>Maroc</option>
<option>France</option>
<option>Espagne</option>
<option>Autre</option>
</select>

<div class="mode">
<button id="soloBtn" class="selected">SOLO</button>
<button id="duoBtn">DUO</button>
</div>

<button class="mainBtn" onclick="startGame()">JOUER</button>
<button class="secondaryBtn" onclick="openSettings()">⚙ PARAMÈTRES</button>
</div>
</div>

<div id="settingsScreen" class="screen">
<div class="menu">
<div class="title" style="font-size:36px">PARAMÈTRES</div>

<div class="settingsRow">
<label>FPS maximum</label>
<select id="fpsLimit">
<option value="30">30 FPS</option>
<option value="60" selected>60 FPS</option>
<option value="90">90 FPS</option>
<option value="120">120 FPS</option>
<option value="180">180 FPS</option>
<option value="240">240 FPS</option>
<option value="360">360 FPS</option>
<option value="0">Illimité</option>
</select>
</div>

<h3>Touches Joueur 1</h3>
<div class="settingsRow"><label>Avancer</label><button class="keyBtn" id="keyUp1" onclick="changeKey('up1')">Z</button></div>
<div class="settingsRow"><label>Reculer</label><button class="keyBtn" id="keyDown1" onclick="changeKey('down1')">S</button></div>
<div class="settingsRow"><label>Gauche</label><button class="keyBtn" id="keyLeft1" onclick="changeKey('left1')">Q</button></div>
<div class="settingsRow"><label>Droite</label><button class="keyBtn" id="keyRight1" onclick="changeKey('right1')">D</button></div>

<h3>Touches Joueur 2</h3>
<div class="settingsRow"><label>Avancer</label><button class="keyBtn" id="keyUp2" onclick="changeKey('up2')">↑</button></div>
<div class="settingsRow"><label>Reculer</label><button class="keyBtn" id="keyDown2" onclick="changeKey('down2')">↓</button></div>
<div class="settingsRow"><label>Gauche</label><button class="keyBtn" id="keyLeft2" onclick="changeKey('left2')">←</button></div>
<div class="settingsRow"><label>Droite</label><button class="keyBtn" id="keyRight2" onclick="changeKey('right2')">→</button></div>

<button class="mainBtn" onclick="closeSettings()">RETOUR</button>
</div>
</div>

<div id="game">

<div id="topbar">
<div class="info activePlayer" id="p1Box"><b id="p1Name">Joueur 1</b><br>❤️ <span id="hp1">100</span></div>
<div class="info inactivePlayer" id="p2Box"><b id="p2Name">Joueur 2</b><br>❤️ <span id="hp2">100</span></div>
<div class="info">⏱ <span id="timer">00:00</span></div>
<div class="info">⭐ <span id="score">0</span></div>
<div class="info">Niveau <span id="level">1</span></div>
<div class="info">FPS: <span id="fpsValue">60</span></div>
<button class="info" id="pauseBtn" onclick="togglePause()">⏸ PAUSE</button>
</div>

<div id="gameArea"><canvas id="canvas"></canvas></div>

<div id="mobileControls">
<div class="dpad">
<button class="up" data-dir="up">▲</button>
<button class="down" data-dir="down">▼</button>
<button class="left" data-dir="left">◀</button>
<button class="right" data-dir="right">▶</button>
</div>
<div class="joystick" id="joystick"><div class="stick" id="stick"></div></div>
</div>
</div>

<div id="pauseOverlay" class="overlay">
<div class="overlayBox">
<div class="overlayTitle">PAUSE</div>
<button class="mainBtn" onclick="togglePause()">CONTINUER</button>
<button class="secondaryBtn" onclick="backToMenu()">MENU</button>
</div>
</div>

<div id="levelOverlay" class="overlay">
<div class="overlayBox">
<div class="overlayTitle" id="levelText">PASSAGE AU NIVEAU 2</div>
<p>Prépare-toi...</p>
</div>
</div>

<div id="gameOverOverlay" class="overlay">
<div class="overlayBox">
<div class="overlayTitle">PERDU !</div>
<p id="gameOverText"></p>
<button class="mainBtn" onclick="backToMenu()">RETOUR AU MENU</button>
</div>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const map=[
"########################",
"#..........#...........#",
"#.####.###.#.###.####.#",
"#.#......#.#.#......#..#",
"#.#.####.#.#.#.####.#..#",
"#...#....#...#....#....#",
"###.#.###########.#.####",
"#...#.....#.......#....#",
"#.#######.#.#########..#",
"#.........#............#",
"#.###################..#",
"#......................#",
"#..##################..#",
"#......................#",
"########################"
];

const TILE=30,ROWS=map.length,COLS=map[0].length;
canvas.width=COLS*TILE;
canvas.height=ROWS*TILE;

let fpsLimit=60;
let waitingForKey=null;
let duo=false;
let level=1;
let score=0;
let activePlayer=0;
let gameRunning=false;
let paused=false;
let lastTime=0;
let fpsCounter=0;
let fpsTimer=0;

const pressedKeys={};

const keys={
up1:"z",down1:"s",left1:"q",right1:"d",
up2:"arrowup",down2:"arrowdown",left2:"arrowleft",right2:"arrowright"
};

const players=[
{x:1.5,y:1.5,spawnX:1.5,spawnY:1.5,hp:100,time:0,score:0,color:"#008cff"},
{x:2.5,y:1.5,spawnX:2.5,spawnY:1.5,hp:100,time:0,score:0,color:"#00d9ff"}
];

let enemies=[];
let foods=[];

const touchDirection={up:false,down:false,left:false,right:false};

document.getElementById("fpsLimit").onchange=e=>{
fpsLimit=Number(e.target.value);
document.getElementById("fpsValue").textContent=fpsLimit===0?"∞":fpsLimit;
};

function changeKey(name){
waitingForKey=name;
const id="key"+name.charAt(0).toUpperCase()+name.slice(1);
const el=document.getElementById(id);
if(el)el.textContent="...";
}

document.addEventListener("keydown",e=>{
if(waitingForKey){
e.preventDefault();
keys[waitingForKey]=e.key.toLowerCase();
updateKeyButtons();
waitingForKey=null;
return;
}
pressedKeys[e.key.toLowerCase()]=true;
});

document.addEventListener("keyup",e=>{
pressedKeys[e.key.toLowerCase()]=false;
});

function updateKeyButtons(){
const ids={
up1:"keyUp1",down1:"keyDown1",left1:"keyLeft1",right1:"keyRight1",
up2:"keyUp2",down2:"keyDown2",left2:"keyLeft2",right2:"keyRight2"
};
for(const k in ids){
document.getElementById(ids[k]).textContent=keys[k].toUpperCase();
}
}

document.getElementById("soloBtn").onclick=()=>{
duo=false;
soloBtn.classList.add("selected");
duoBtn.classList.remove("selected");
pseudo2.style.display="none";
};

document.getElementById("duoBtn").onclick=()=>{
duo=true;
duoBtn.classList.add("selected");
soloBtn.classList.remove("selected");
pseudo2.style.display="block";
};

function openSettings(){
menuScreen.classList.remove("active");
settingsScreen.classList.add("active");
}

function closeSettings(){
settingsScreen.classList.remove("active");
menuScreen.classList.add("active");
}

function isWall(x,y){
const c=Math.floor(x),r=Math.floor(y);
return r<0||r>=ROWS||c<0||c>=COLS||map[r][c]==="#";
}

function canMove(x,y){
const r=.25;
return !isWall(x-r,y-r)&&!isWall(x+r,y-r)&&!isWall(x-r,y+r)&&!isWall(x+r,y+r);
}

function distance(a,b){
return Math.hypot(a.x-b.x,a.y-b.y);
}

function createEnemies(){
enemies=[];
const positions=[
{x:20.5,y:13.5},{x:18.5,y:13.5},{x:16.5,y:13.5},
{x:14.5,y:13.5},{x:12.5,y:13.5},{x:10.5,y:13.5},
{x:20.5,y:11.5},{x:18.5,y:11.5},{x:16.5,y:11.5},
{x:14.5,y:11.5},{x:12.5,y:11.5},{x:10.5,y:11.5}
];

const count=Math.min(level,positions.length);

for(let i=0;i<count;i++){
enemies.push({
x:positions[i].x,
y:positions[i].y,
spawnX:positions[i].x,
spawnY:positions[i].y,
speed:1.25+level*.03,
hitCooldown:0
});
}
}

/* EXACTEMENT 5 MORCEAUX DE POULET */
function createFood(){
foods=[];

const chickenPositions=[
[2,1],
[5,1],
[8,1],
[12,1],
[16,1]
];

for(const pos of chickenPositions){
if(!isWall(pos[0]+.5,pos[1]+.5)){
foods.push({
x:pos[0]+.5,
y:pos[1]+.5
});
}
}
}

function getDirection(index){
let up=false,down=false,left=false,right=false;

if(index===0){
up=pressedKeys[keys.up1];
down=pressedKeys[keys.down1];
left=pressedKeys[keys.left1];
right=pressedKeys[keys.right1];
}else{
up=pressedKeys[keys.up2];
down=pressedKeys[keys.down2];
left=pressedKeys[keys.left2];
right=pressedKeys[keys.right2];
}

up ||= touchDirection.up;
down ||= touchDirection.down;
left ||= touchDirection.left;
right ||= touchDirection.right;

return{
dx:(right?1:0)-(left?1:0),
dy:(down?1:0)-(up?1:0)
};
}

function resetPlayer(i){
players[i].x=players[i].spawnX;
players[i].y=players[i].spawnY;
}

function switchPlayer(){
if(!duo)return;

activePlayer=activePlayer===0?1:0;
resetPlayer(activePlayer);

enemies.forEach(e=>{
e.x=e.spawnX;
e.y=e.spawnY;
e.hitCooldown=0;
});

updateUI();
}

function nextLevel(){
level++;
createEnemies();
createFood();
resetPlayer(activePlayer);
paused=true;

const lang=document.getElementById("language").value;

if(lang==="fr")levelText.textContent="PASSAGE AU NIVEAU "+level;
else if(lang==="ar")levelText.textContent="الانتقال إلى المستوى "+level;
else levelText.textContent="MOVING TO LEVEL "+level;

levelOverlay.style.display="flex";

setTimeout(()=>{
levelOverlay.style.display="none";
paused=false;
},1600);
}

function checkEnemyCollision(){
const p=players[activePlayer];

for(const e of enemies){
if(distance(p,e)<.65&&e.hitCooldown<=0){

p.hp-=20;
e.hitCooldown=.8;
resetPlayer(activePlayer);

if(p.hp<=0){
p.hp=0;

if(duo){
if(players[0].hp<=0&&players[1].hp<=0){
gameOver();
return;
}
switchPlayer();
}else{
gameOver();
}
}

updateUI();
}
}
}

function checkFood(){
const p=players[activePlayer];

for(let i=foods.length-1;i>=0;i--){
if(distance(p,foods[i])<.55){

p.hp=Math.min(100,p.hp+10);
p.score+=100;
score+=100;

foods.splice(i,1);
updateUI();
}
}
}

function updatePlayer(dt){
const p=players[activePlayer];
const d=getDirection(activePlayer);

if(!d.dx&&!d.dy)return;

const speed=4.8;
const nx=p.x+d.dx*speed*dt;
const ny=p.y+d.dy*speed*dt;

if(canMove(nx,p.y))p.x=nx;
if(canMove(p.x,ny))p.y=ny;
}

function updateEnemies(dt){
const target=players[activePlayer];

for(const e of enemies){

e.hitCooldown=Math.max(0,e.hitCooldown-dt);

let dx=target.x-e.x;
let dy=target.y-e.y;
const dist=Math.hypot(dx,dy);

if(dist===0)continue;

dx/=dist;
dy/=dist;

const amount=e.speed*dt;
let nx=e.x+dx*amount;
let ny=e.y+dy*amount;

if(canMove(nx,ny)){
e.x=nx;
e.y=ny;
}else{

const dirs=[[1,0],[-1,0],[0,1],[0,-1]];

dirs.sort((a,b)=>{
const da=Math.hypot(target.x-(e.x+a[0]),target.y-(e.y+a[1]));
const db=Math.hypot(target.x-(e.x+b[0]),target.y-(e.y+b[1]));
return da-db;
});

for(const d of dirs){
nx=e.x+d[0]*amount;
ny=e.y+d[1]*amount;

if(canMove(nx,ny)){
e.x=nx;
e.y=ny;
break;
}
}
}
}
}

function updateTimer(dt){
players[activePlayer].time+=dt;

const t=Math.floor(players[activePlayer].time);
const min=Math.floor(t/60);
const sec=t%60;

timer.textContent=String(min).padStart(2,"0")+":"+String(sec).padStart(2,"0");

const targetLevel=Math.floor(players[activePlayer].time/30)+1;

if(targetLevel>level)nextLevel();
}

function drawMap(){
ctx.fillStyle="#050505";
ctx.fillRect(0,0,canvas.width,canvas.height);

for(let y=0;y<ROWS;y++){
for(let x=0;x<COLS;x++){

if(map[y][x]==="#"){
ctx.fillStyle="#142b80";
ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
ctx.strokeStyle="#2147c4";
ctx.strokeRect(x*TILE,y*TILE,TILE,TILE);
}
}
}
}

function drawPlayer(){
const p=players[activePlayer];
const x=p.x*TILE,y=p.y*TILE;

ctx.fillStyle=p.color;
ctx.beginPath();
ctx.arc(x,y,TILE*.32,0,Math.PI*2);
ctx.fill();

const walk=Math.floor(performance.now()/120)%2;

ctx.fillStyle="#0064bd";

ctx.fillRect(x-TILE*(walk?.14:.20),y+TILE*.22,TILE*.13,TILE*.16);
ctx.fillRect(x+TILE*(walk?.13:.07),y+TILE*.22,TILE*.13,TILE*.16);
}

function drawEnemies(){
for(const e of enemies){

const x=e.x*TILE,y=e.y*TILE;

ctx.fillStyle="#ff2020";
ctx.beginPath();
ctx.arc(x,y,TILE*.34,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="white";

ctx.beginPath();
ctx.arc(x-TILE*.11,y-TILE*.06,TILE*.07,0,Math.PI*2);
ctx.arc(x+TILE*.11,y-TILE*.06,TILE*.07,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#111";

ctx.beginPath();
ctx.arc(x-TILE*.11,y-TILE*.06,TILE*.035,0,Math.PI*2);
ctx.arc(x+TILE*.11,y-TILE*.06,TILE*.035,0,Math.PI*2);
ctx.fill();

ctx.strokeStyle="#111";
ctx.lineWidth=3;
ctx.beginPath();
ctx.arc(x,y+TILE*.07,TILE*.15,0,Math.PI);
ctx.stroke();
}
}

function drawFood(){
for(const food of foods){

const x=food.x*TILE;
const y=food.y*TILE;

ctx.fillStyle="#d99032";
ctx.beginPath();
ctx.arc(x,y,TILE*.18,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#f5c27a";
ctx.beginPath();
ctx.arc(x+TILE*.12,y+TILE*.12,TILE*.09,0,Math.PI*2);
ctx.fill();

ctx.strokeStyle="#8a4d19";
ctx.lineWidth=2;
ctx.stroke();
}
}

function draw(){
drawMap();
drawFood();
drawPlayer();
drawEnemies();
}

function updateUI(){

p1Name.textContent=pseudo1.value||"Joueur 1";
p2Name.textContent=pseudo2.value||"Joueur 2";

hp1.textContent=players[0].hp;
hp2.textContent=players[1].hp;

document.getElementById("score").textContent=score;
document.getElementById("level").textContent=level;

if(activePlayer===0){
p1Box.className="info activePlayer";
p2Box.className="info inactivePlayer";
}else{
p1Box.className="info inactivePlayer";
p2Box.className="info activePlayer";
}
}

function gameLoop(timestamp){

if(!gameRunning){
requestAnimationFrame(gameLoop);
return;
}

if(!lastTime)lastTime=timestamp;

let dt=(timestamp-lastTime)/1000;
lastTime=timestamp;

if(dt>.1)dt=.1;

if(!paused){

updatePlayer(dt);
updateEnemies(dt);
checkEnemyCollision();
checkFood();
updateTimer(dt);
draw();
}

fpsCounter++;
fpsTimer+=dt;

if(fpsTimer>=1){
fpsValue.textContent=fpsCounter;
fpsCounter=0;
fpsTimer=0;
}

requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

function startGame(){

if(!pseudo1.value.trim()){
alert("Entre ton pseudo.");
return;
}

if(duo&&!pseudo2.value.trim()){
alert("Entre le deuxième pseudo.");
return;
}

players[0].hp=100;
players[1].hp=100;
players[0].time=0;
players[1].time=0;
players[0].score=0;
players[1].score=0;

activePlayer=0;
level=1;
score=0;
paused=false;
gameRunning=true;

resetPlayer(0);
resetPlayer(1);

createEnemies();
createFood();

menuScreen.classList.remove("active");
game.style.display="block";

updateUI();
lastTime=performance.now();
draw();
}

function togglePause(){

if(!gameRunning)return;

paused=!paused;
pauseOverlay.style.display=paused?"flex":"none";
}

function gameOver(){

gameRunning=false;
gameOverText.textContent="Le joueur a été rattrapé.";
gameOverOverlay.style.display="flex";
}

function backToMenu(){

gameRunning=false;
paused=false;

game.style.display="none";
pauseOverlay.style.display="none";
gameOverOverlay.style.display="none";
menuScreen.classList.add("active");
}

document.querySelectorAll(".dpad button").forEach(button=>{

const dir=button.dataset.dir;

function down(e){
e.preventDefault();
touchDirection[dir]=true;
}

function up(e){
e.preventDefault();
touchDirection[dir]=false;
}

button.addEventListener("touchstart",down,{passive:false});
button.addEventListener("touchend",up,{passive:false});
button.addEventListener("touchcancel",up,{passive:false});
button.addEventListener("mousedown",down);
button.addEventListener("mouseup",up);
button.addEventListener("mouseleave",up);
});

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joystickActive=false;

function moveJoystick(x,y){

const r=joystick.getBoundingClientRect();
const cx=r.left+r.width/2;
const cy=r.top+r.height/2;

let dx=x-cx;
let dy=y-cy;

const max=45;
const dist=Math.hypot(dx,dy);

if(dist>max){
dx=dx/dist*max;
dy=dy/dist*max;
}

stick.style.left=`calc(50% + ${dx}px)`;
stick.style.top=`calc(50% + ${dy}px)`;

touchDirection.up=dy<-15;
touchDirection.down=dy>15;
touchDirection.left=dx<-15;
touchDirection.right=dx>15;
}

function resetJoystick(){

joystickActive=false;

stick.style.left="50%";
stick.style.top="50%";

touchDirection.up=false;
touchDirection.down=false;
touchDirection.left=false;
touchDirection.right=false;
}

joystick.addEventListener("touchstart",e=>{
e.preventDefault();
joystickActive=true;
const t=e.touches[0];
moveJoystick(t.clientX,t.clientY);
},{passive:false});

joystick.addEventListener("touchmove",e=>{
e.preventDefault();
if(!joystickActive)return;
const t=e.touches[0];
moveJoystick(t.clientX,t.clientY);
},{passive:false});

joystick.addEventListener("touchend",e=>{
e.preventDefault();
resetJoystick();
},{passive:false});

document.addEventListener("contextmenu",e=>{
if(e.target.closest("#mobileControls"))e.preventDefault();
});

updateKeyButtons();
</script>
</body>
</html>
