<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pac-Man 2.0</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080808;
    color:white;
    font-family:Arial,sans-serif;
    user-select:none;
}

button{
    border:0;
    cursor:pointer;
    font-weight:bold;
}

.screen{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#080808;
}

.screen.active{
    display:flex;
}

.menu{
    width:min(92%,520px);
    padding:30px;
    border-radius:22px;
    background:#151515;
    box-shadow:0 0 40px #000;
    text-align:center;
}

.title{
    font-size:48px;
    font-weight:900;
    color:#ffd400;
    margin-bottom:5px;
}

.slogan{
    color:#aaa;
    margin-bottom:25px;
}

input,select{
    width:100%;
    padding:14px;
    margin:7px 0;
    border-radius:10px;
    border:1px solid #333;
    background:#222;
    color:white;
    font-size:16px;
}

.mainBtn{
    width:100%;
    padding:15px;
    margin-top:10px;
    border-radius:12px;
    background:#ffd400;
    color:#111;
    font-size:18px;
}

.secondaryBtn{
    width:100%;
    padding:13px;
    margin-top:8px;
    border-radius:12px;
    background:#292929;
    color:white;
}

.mode{
    display:flex;
    gap:10px;
}

.mode button{
    flex:1;
    padding:13px;
    border-radius:10px;
    background:#252525;
    color:white;
}

.mode button.selected{
    background:#ffd400;
    color:#111;
}

#game{
    position:absolute;
    inset:0;
    display:none;
}

#game.active{
    display:block;
}

#topbar{
    position:absolute;
    z-index:20;
    top:8px;
    left:50%;
    transform:translateX(-50%);
    width:min(96%,900px);
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
}

.info{
    background:#171717;
    border:2px solid #333;
    border-radius:10px;
    padding:8px 13px;
    min-width:100px;
    text-align:center;
}

.playerBox.activePlayer{
    border-color:#00ff55;
    background:#073d1b;
}

.playerBox.inactivePlayer{
    border-color:#ff2222;
    background:#420909;
}

#fps{
    color:#00ff88;
}

#pauseBtn{
    background:#ffd400;
    color:#111;
}

#gameArea{
    position:absolute;
    top:72px;
    left:0;
    right:0;
    bottom:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

canvas{
    display:block;
    background:#050505;
    image-rendering:auto;
    border-radius:10px;
}

#pauseOverlay,
#levelOverlay,
#gameOverOverlay{
    position:absolute;
    inset:0;
    z-index:50;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.78);
    text-align:center;
}

.overlayBox{
    background:#151515;
    padding:30px;
    border-radius:20px;
    width:min(90%,450px);
}

.overlayTitle{
    font-size:36px;
    color:#ffd400;
    font-weight:900;
}

#mobileControls{
    display:none;
    position:absolute;
    z-index:30;
    inset:0;
    pointer-events:none;
}

.dpad{
    position:absolute;
    left:18px;
    bottom:20px;
    width:170px;
    height:170px;
    pointer-events:auto;
}

.dpad button{
    position:absolute;
    width:58px;
    height:58px;
    border-radius:15px;
    background:rgba(255,212,0,.75);
    color:#111;
    font-size:25px;
    touch-action:none;
}

.up{top:0;left:56px}
.down{bottom:0;left:56px}
.left{left:0;top:56px}
.right{right:0;top:56px}

.joystick{
    position:absolute;
    right:20px;
    bottom:25px;
    width:150px;
    height:150px;
    border:4px solid rgba(255,255,255,.35);
    border-radius:50%;
    pointer-events:auto;
    background:rgba(255,255,255,.05);
}

.stick{
    position:absolute;
    width:55px;
    height:55px;
    border-radius:50%;
    background:rgba(255,212,0,.8);
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.settingsRow{
    display:flex;
    gap:8px;
    align-items:center;
    margin:8px 0;
}

.settingsRow label{
    flex:1;
    text-align:left;
}

.settingsRow button,
.settingsRow select{
    width:180px;
    margin:0;
}

.keyBtn{
    background:#292929;
    color:#fff;
    padding:10px;
    border-radius:8px;
}

@media(max-width:700px){
    #gameArea{
        top:115px;
        bottom:0;
    }

    #topbar{
        top:5px;
        width:98%;
        font-size:12px;
    }

    .info{
        min-width:70px;
        padding:6px;
    }

    .title{
        font-size:38px;
    }

    .menu{
        padding:20px;
    }

    #mobileControls{
        display:block;
    }

    canvas{
        max-width:94vw;
        max-height:65vh;
    }
}
</style>
</head>

<body>

<!-- MENU -->
<div id="menuScreen" class="screen active">
    <div class="menu">

        <div class="title">PAC-MAN 2.0</div>
        <div class="slogan">
            « Fuis. Survis. Ne regarde jamais derrière toi. »
        </div>

        <input id="pseudo1" placeholder="Pseudo joueur 1">

        <input id="pseudo2"
               placeholder="Pseudo joueur 2"
               style="display:none">

        <select id="language">
            <option value="fr">Français</option>
            <option value="ar">العربية</option>
            <option value="en">English</option>
        </select>

        <select id="region">
            <option>Maroc</option>
            <option>France</option>
            <option>Espagne</option>
            <option>Autre</option>
        </select>

        <div class="mode">
            <button id="soloBtn" class="selected">SOLO</button>
            <button id="duoBtn">DUO</button>
        </div>

        <button class="mainBtn" onclick="startGame()">
            JOUER
        </button>

        <button class="secondaryBtn" onclick="openSettings()">
            ⚙ PARAMÈTRES
        </button>

    </div>
</div>

<!-- SETTINGS -->
<div id="settingsScreen" class="screen">
    <div class="menu">

        <div class="title" style="font-size:36px">
            PARAMÈTRES
        </div>

        <div class="settingsRow">
            <label>FPS maximum</label>
            <select id="fpsLimit">
                <option value="30">30 FPS</option>
                <option value="60" selected>60 FPS</option>
                <option value="90">90 FPS</option>
                <option value="120">120 FPS</option>
                <option value="180">180 FPS</option>
                <option value="240">240 FPS</option>
                <option value="360">360 FPS</option>
                <option value="0">Illimité</option>
            </select>
        </div>

        <h3>Touches Joueur 1</h3>

        <div class="settingsRow">
            <label>Avancer</label>
            <button class="keyBtn" id="keyUp1"
                    onclick="changeKey('up1')">Z</button>
        </div>

        <div class="settingsRow">
            <label>Reculer</label>
            <button class="keyBtn" id="keyDown1"
                    onclick="changeKey('down1')">S</button>
        </div>

        <div class="settingsRow">
            <label>Gauche</label>
            <button class="keyBtn" id="keyLeft1"
                    onclick="changeKey('left1')">Q</button>
        </div>

        <div class="settingsRow">
            <label>Droite</label>
            <button class="keyBtn" id="keyRight1"
                    onclick="changeKey('right1')">D</button>
        </div>

        <h3>Touches Joueur 2</h3>

        <div class="settingsRow">
            <label>Avancer</label>
            <button class="keyBtn" id="keyUp2"
                    onclick="changeKey('up2')">↑</button>
        </div>

        <div class="settingsRow">
            <label>Reculer</label>
            <button class="keyBtn" id="keyDown2"
                    onclick="changeKey('down2')">↓</button>
        </div>

        <div class="settingsRow">
            <label>Gauche</label>
            <button class="keyBtn" id="keyLeft2"
                    onclick="changeKey('left2')">←</button>
        </div>

        <div class="settingsRow">
            <label>Droite</label>
            <button class="keyBtn" id="keyRight2"
                    onclick="changeKey('right2')">→</button>
        </div>

        <button class="mainBtn" onclick="closeSettings()">
            RETOUR
        </button>

    </div>
</div>

<!-- GAME -->
<div id="game">

    <div id="topbar">

        <div class="info playerBox activePlayer" id="p1Box">
            <b id="p1Name">Joueur 1</b><br>
            ❤️ <span id="hp1">100</span>
        </div>

        <div class="info playerBox inactivePlayer" id="p2Box">
            <b id="p2Name">Joueur 2</b><br>
            ❤️ <span id="hp2">100</span>
        </div>

        <div class="info">
            ⏱ <span id="timer">00:00</span>
        </div>

        <div class="info">
            ⭐ <span id="score">0</span>
        </div>

        <div class="info">
            Niveau <span id="level">1</span>
        </div>

        <div class="info" id="fps">
            FPS: <span id="fpsValue">60</span>
        </div>

        <button class="info" id="pauseBtn"
                onclick="togglePause()">
            ⏸ PAUSE
        </button>

    </div>

    <div id="gameArea">
        <canvas id="canvas"></canvas>
    </div>

    <!-- TOUCHES -->
    <div id="mobileControls">

        <div class="dpad">
            <button class="up"
                    data-dir="up">▲</button>
            <button class="down"
                    data-dir="down">▼</button>
            <button class="left"
                    data-dir="left">◀</button>
            <button class="right"
                    data-dir="right">▶</button>
        </div>

        <div class="joystick" id="joystick">
            <div class="stick" id="stick"></div>
        </div>

    </div>

</div>

<!-- PAUSE -->
<div id="pauseOverlay">
    <div class="overlayBox">
        <div class="overlayTitle">PAUSE</div>
        <button class="mainBtn" onclick="togglePause()">
            CONTINUER
        </button>
        <button class="secondaryBtn" onclick="backToMenu()">
            MENU
        </button>
    </div>
</div>

<!-- LEVEL -->
<div id="levelOverlay">
    <div class="overlayBox">
        <div class="overlayTitle" id="levelText">
            PASSAGE AU NIVEAU 2
        </div>
        <p>Prépare-toi...</p>
    </div>
</div>

<!-- GAME OVER -->
<div id="gameOverOverlay">
    <div class="overlayBox">
        <div class="overlayTitle">PERDU !</div>
        <p id="gameOverText"></p>
        <button class="mainBtn" onclick="backToMenu()">
            RETOUR AU MENU
        </button>
    </div>
</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let WIDTH = 800;
let HEIGHT = 600;

canvas.width = WIDTH;
canvas.height = HEIGHT;


/* =========================================================
   PARAMÈTRES
========================================================= */

let fpsLimit = 60;

let keys = {
    up1:"z",
    down1:"s",
    left1:"q",
    right1:"d",

    up2:"arrowup",
    down2:"arrowdown",
    left2:"arrowleft",
    right2:"arrowright"
};

let waitingForKey = null;

document.getElementById("fpsLimit").addEventListener("change", e=>{
    fpsLimit = Number(e.target.value);
    document.getElementById("fpsValue").textContent =
        fpsLimit === 0 ? "∞" : fpsLimit;
});


function changeKey(name){

    waitingForKey = name;

    const button = document.getElementById(
        "key" +
        name.charAt(0).toUpperCase() +
        name.slice(1)
    );

    if(button){
        button.textContent = "...";
    }
}


document.addEventListener("keydown", e=>{

    if(waitingForKey){

        e.preventDefault();

        keys[waitingForKey] = e.key.toLowerCase();

        updateKeyButtons();

        waitingForKey = null;

        return;
    }

    pressedKeys[e.key.toLowerCase()] = true;
});


document.addEventListener("keyup",e=>{
    pressedKeys[e.key.toLowerCase()] = false;
});


function updateKeyButtons(){

    const ids = {
        up1:"keyUp1",
        down1:"keyDown1",
        left1:"keyLeft1",
        right1:"keyRight1",
        up2:"keyUp2",
        down2:"keyDown2",
        left2:"keyLeft2",
        right2:"keyRight2"
    };

    for(const key in ids){

        const el = document.getElementById(ids[key]);

        if(el){
            el.textContent =
                keys[key].length === 1
                ? keys[key].toUpperCase()
                : keys[key].toUpperCase();
        }
    }
}


/* =========================================================
   MENU
========================================================= */

let duo = false;

document.getElementById("soloBtn").onclick=()=>{
    duo=false;

    document.getElementById("soloBtn")
        .classList.add("selected");

    document.getElementById("duoBtn")
        .classList.remove("selected");

    document.getElementById("pseudo2")
        .style.display="none";
};

document.getElementById("duoBtn").onclick=()=>{
    duo=true;

    document.getElementById("duoBtn")
        .classList.add("selected");

    document.getElementById("soloBtn")
        .classList.remove("selected");

    document.getElementById("pseudo2")
        .style.display="block";
};


function openSettings(){

    document.getElementById("menuScreen")
        .classList.remove("active");

    document.getElementById("settingsScreen")
        .classList.add("active");
}


function closeSettings(){

    document.getElementById("settingsScreen")
        .classList.remove("active");

    document.getElementById("menuScreen")
        .classList.add("active");
}


/* =========================================================
   LABYRINTHE
========================================================= */

const map = [
"########################",
"#..........#...........#",
"#.####.###.#.###.####.#",
"#.#......#.#.#......#..#",
"#.#.####.#.#.#.####.#..#",
"#...#....#...#....#....#",
"###.#.###########.#.####",
"#...#.....#.......#....#",
"#.#######.#.#########..#",
"#.........#............#",
"#.###################..#",
"#......................#",
"#..##################..#",
"#......................#",
"########################"
];

const TILE = 30;

const ROWS = map.length;
const COLS = map[0].length;

canvas.width = COLS*TILE;
canvas.height = ROWS*TILE;


/* =========================================================
   JOUEURS
========================================================= */

let players = [

    {
        x:1.5,
        y:1.5,
        spawnX:1.5,
        spawnY:1.5,
        color:"#008cff",
        hp:100,
        score:0,
        time:0
    },

    {
        x:2.5,
        y:1.5,
        spawnX:2.5,
        spawnY:1.5,
        color:"#00d9ff",
        hp:100,
        score:0,
        time:0
    }

];

let activePlayer = 0;


/* =========================================================
   MÉCHANTS
========================================================= */

let enemies = [];

function createEnemies(){

    enemies=[];

    const count = Math.min(1 + Math.floor(level/1), 12);

    const spawnPositions = [

        {x:20.5,y:13.5},
        {x:18.5,y:13.5},
        {x:16.5,y:13.5},
        {x:14.5,y:13.5},
        {x:12.5,y:13.5},
        {x:10.5,y:13.5},
        {x:20.5,y:11.5},
        {x:18.5,y:11.5},
        {x:16.5,y:11.5},
        {x:14.5,y:11.5},
        {x:12.5,y:11.5},
        {x:10.5,y:11.5}
    ];

    for(let i=0;i<count;i++){

        const p = spawnPositions[i];

        enemies.push({

            x:p.x,
            y:p.y,

            spawnX:p.x,
            spawnY:p.y,

            speed:1.25 + level*0.03,

            color:"#ff2020",

            hitCooldown:0
        });
    }
}


/* =========================================================
   NOURRITURE
   SEULEMENT 5 POULETS
========================================================= */

let foods=[];

function createFood(){

    foods=[];

    const positions=[
        {x:4.5,y:1.5},
        {x:9.5,y:3.5},
        {x:3.5,y:9.5},
        {x:13.5,y:11.5},
        {x:20.5,y:9.5}
    ];

    positions.forEach(p=>{

        if(!isWall(p.x,p.y)){

            foods.push({
                x:p.x,
                y:p.y
            });

        }
    });
}


/* =========================================================
   VARIABLES
========================================================= */

let level=1;
let gameRunning=false;
let paused=false;

let globalStart=0;
let lastTime=0;

let score=0;

let pressedKeys={};

let touchDirection={
    up:false,
    down:false,
    left:false,
    right:false
};


/* =========================================================
   UTILITAIRES
========================================================= */

function isWall(x,y){

    const col=Math.floor(x);
    const row=Math.floor(y);

    if(row<0 || row>=ROWS ||
       col<0 || col>=COLS){

        return true;
    }

    return map[row][col]==="#";
}


function canMove(x,y){

    const r=.28;

    return !isWall(x-r,y-r) &&
           !isWall(x+r,y-r) &&
           !isWall(x-r,y+r) &&
           !isWall(x+r,y+r);
}


function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


/* =========================================================
   DIRECTION
========================================================= */

function getDirection(playerIndex){

    const p=players[playerIndex];

    let up=false;
    let down=false;
    let left=false;
    let right=false;

    if(playerIndex===0){

        up=pressedKeys[keys.up1];
        down=pressedKeys[keys.down1];
        left=pressedKeys[keys.left1];
        right=pressedKeys[keys.right1];

    }else{

        up=pressedKeys[keys.up2];
        down=pressedKeys[keys.down2];
        left=pressedKeys[keys.left2];
        right=pressedKeys[keys.right2];
    }

    up ||= touchDirection.up;
    down ||= touchDirection.down;
    left ||= touchDirection.left;
    right ||= touchDirection.right;

    let dx=0;
    let dy=0;

    if(up) dy=-1;
    if(down) dy=1;
    if(left) dx=-1;
    if(right) dx=1;

    return {dx,dy};
}


/* =========================================================
   RESET JOUEUR
========================================================= */

function resetPlayer(index){

    const p=players[index];

    p.x=p.spawnX;
    p.y=p.spawnY;

}


/* =========================================================
   CHANGEMENT DE JOUEUR
========================================================= */

function switchPlayer(){

    if(!duo) return;

    activePlayer =
        activePlayer===0 ? 1 : 0;

    resetPlayer(activePlayer);

    enemies.forEach(e=>{

        e.x=e.spawnX;
        e.y=e.spawnY;
        e.hitCooldown=0;

    });

    updateUI();
}


/* =========================================================
   NIVEAU
========================================================= */

function nextLevel(){

    level++;

    showLevelMessage();

    createEnemies();
    createFood();

    players[activePlayer].x=
        players[activePlayer].spawnX;

    players[activePlayer].y=
        players[activePlayer].spawnY;

    paused=true;

    setTimeout(()=>{

        paused=false;

    },1800);

}


function showLevelMessage(){

    const language=
        document.getElementById("language").value;

    let text="";

    if(language==="fr"){
        text="PASSAGE AU NIVEAU "+level;
    }

    if(language==="ar"){
        text="الانتقال إلى المستوى "+level;
    }

    if(language==="en"){
        text="MOVING TO LEVEL "+level;
    }

    document.getElementById("levelText")
        .textContent=text;

    const overlay=
        document.getElementById("levelOverlay");

    overlay.style.display="flex";

    setTimeout(()=>{

        overlay.style.display="none";

    },1600);
}


/* =========================================================
   COLLISION
========================================================= */

function checkEnemyCollision(){

    const p=players[activePlayer];

    enemies.forEach(enemy=>{

        if(distance(p,enemy)<.65){

            if(enemy.hitCooldown<=0){

                p.hp-=20;

                enemy.hitCooldown=.8;

                resetPlayer(activePlayer);

                if(p.hp<=0){

                    p.hp=0;

                    if(duo){

                        if(players[0].hp<=0 &&
                           players[1].hp<=0){

                            gameOver();
                            return;
                        }

                        switchPlayer();

                    }else{

                        gameOver();

                    }
                }

                updateUI();
            }
        }

    });
}


/* =========================================================
   NOURRITURE
========================================================= */

function checkFood(){

    const p=players[activePlayer];

    for(let i=foods.length-1;i>=0;i--){

        if(distance(p,foods[i])<.55){

            p.hp=Math.min(
                100,
                p.hp+10
            );

            p.score+=100;

            score+=100;

            foods.splice(i,1);

            updateUI();
        }
    }
}


/* =========================================================
   IA DES MÉCHANTS
========================================================= */

function updateEnemies(dt){

    const target=players[activePlayer];

    enemies.forEach(enemy=>{

        enemy.hitCooldown=
            Math.max(
                0,
                enemy.hitCooldown-dt
            );

        let dx=target.x-enemy.x;
        let dy=target.y-enemy.y;

        const d=Math.hypot(dx,dy);

        if(d>0){

            dx/=d;
            dy/=d;

            const speed=
                enemy.speed*dt;

            let nx=enemy.x+dx*speed;
            let ny=enemy.y+dy*speed;

            /*
              Si la direction directe est bloquée,
              le méchant essaie plusieurs directions.
            */

            if(canMove(nx,ny)){

                enemy.x=nx;
                enemy.y=ny;

            }else{

                const directions=[
                    [1,0],
                    [-1,0],
                    [0,1],
                    [0,-1]
                ];

                directions.sort((a,b)=>{

                    const da=Math.hypot(
                        target.x-(enemy.x+a[0]),
                        target.y-(enemy.y+a[1])
                    );

                    const db=Math.hypot(
                        target.x-(enemy.x+b[0]),
                        target.y-(enemy.y+b[1])
                    );

                    return da-db;
                });

                for(const dir of directions){

                    nx=enemy.x+
                        dir[0]*speed;

                    ny=enemy.y+
                        dir[1]*speed;

                    if(canMove(nx,ny)){

                        enemy.x=nx;
                        enemy.y=ny;

                        break;
                    }
                }
            }
        }
    });
}


/* =========================================================
   JOUEUR
========================================================= */

function updatePlayer(dt){

    const p=players[activePlayer];

    const dir=getDirection(activePlayer);

    if(dir.dx===0 && dir.dy===0)
        return;

    let speed=4.8;

    let nx=p.x+
        dir.dx*speed*dt;

    let ny=p.y+
        dir.dy*speed*dt;

    if(canMove(nx,p.y))
        p.x=nx;

    if(canMove(p.x,ny))
        p.y=ny;
}


/* =========================================================
   TIMER
========================================================= */

function getPlayerTime(){

    return players[activePlayer].time;
}


function updateTimer(dt){

    players[activePlayer].time+=dt;

    const time=
        players[activePlayer].time;

    const seconds=
        Math.floor(time);

    const minutes=
        Math.floor(seconds/60);

    const sec=
        seconds%60;

    document.getElementById("timer")
        .textContent=
        String(minutes).padStart(2,"0")
        +":"+
        String(sec).padStart(2,"0");

    /*
      Tous les 30 secondes :
      niveau suivant.
    */

    const targetLevel=
        Math.floor(time/30)+1;

    if(targetLevel>level){

        nextLevel();
    }
}


/* =========================================================
   DESSIN
========================================================= */

function drawMap(){

    ctx.fillStyle="#050505";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    for(let y=0;y<ROWS;y++){

        for(let x=0;x<COLS;x++){

            if(map[y][x]==="#"){

                ctx.fillStyle="#142b80";

                ctx.fillRect(
                    x*TILE,
                    y*TILE,
                    TILE,
                    TILE
                );

                ctx.strokeStyle="#2147c4";
                ctx.lineWidth=1;

                ctx.strokeRect(
                    x*TILE,
                    y*TILE,
                    TILE,
                    TILE
                );
            }
        }
    }
}


function drawPlayer(){

    const p=players[activePlayer];

    const px=p.x*TILE;
    const py=p.y*TILE;

    /*
      Corps bleu
    */

    ctx.fillStyle=p.color;

    ctx.beginPath();

    ctx.arc(
        px,
        py,
        TILE*.32,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
      Petits pieds animés
    */

    const walking=
        Math.floor(performance.now()/120)%2;

    ctx.fillStyle="#0064bd";

    if(walking===0){

        ctx.fillRect(
            px-TILE*.20,
            py+TILE*.22,
            TILE*.13,
            TILE*.16
        );

        ctx.fillRect(
            px+TILE*.07,
            py+TILE*.22,
            TILE*.13,
            TILE*.16
        );

    }else{

        ctx.fillRect(
            px-TILE*.14,
            py+TILE*.22,
            TILE*.13,
            TILE*.16
        );

        ctx.fillRect(
            px+TILE*.13,
            py+TILE*.22,
            TILE*.13,
            TILE*.16
        );
    }
}


function drawEnemies(){

    enemies.forEach(enemy=>{

        const px=enemy.x*TILE;
        const py=enemy.y*TILE;

        /*
          Tête rouge méchante
        */

        ctx.fillStyle="#ff2020";

        ctx.beginPath();

        ctx.arc(
            px,
            py,
            TILE*.34,
            0,
            Math.PI*2
        );

        ctx.fill();

        /*
          yeux
        */

        ctx.fillStyle="white";

        ctx.beginPath();

        ctx.arc(
            px-TILE*.11,
            py-TILE*.06,
            TILE*.07,
            0,
            Math.PI*2
        );

        ctx.arc(
            px+TILE*.11,
            py-TILE*.06,
            TILE*.07,
            0,
            Math.PI*2
        );

        ctx.fill();

        /*
          pupilles
        */

        ctx.fillStyle="#111";

        ctx.beginPath();

        ctx.arc(
            px-TILE*.11,
            py-TILE*.06,
            TILE*.035,
            0,
            Math.PI*2
        );

        ctx.arc(
            px+TILE*.11,
            py-TILE*.06,
            TILE*.035,
            0,
            Math.PI*2
        );

        ctx.fill();

        /*
          bouche méchante
        */

        ctx.strokeStyle="#111";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            px,
            py+TILE*.07,
            TILE*.15,
            0,
            Math.PI
        );

        ctx.stroke();

    });
}


function drawFood(){

    foods.forEach(food=>{

        const x=food.x*TILE;
        const y=food.y*TILE;

        /*
          Petit morceau de cuisse de poulet
        */

        ctx.fillStyle="#d99032";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            TILE*.18,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#f5c27a";

        ctx.beginPath();

        ctx.arc(
            x+TILE*.12,
            y+TILE*.12,
            TILE*.09,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle="#8a4d19";
        ctx.lineWidth=2;

        ctx.stroke();
    });
}


function draw(){

    drawMap();
    drawFood();
    drawPlayer();
    drawEnemies();
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    document.getElementById("p1Name")
        .textContent=
        document.getElementById("pseudo1").value
        ||"Joueur 1";

    document.getElementById("p2Name")

        document.getElementById("p1Box")
            .className=
            "info playerBox inactivePlayer";

        document.getElementById("p2Box")
            .className=
            "info playerBox activePlayer";
    }
}


/* =========================================================
   BOUCLE DU JEU
========================================================= */

let fpsCounter=0;
let fpsTimer=0;

function gameLoop(timestamp){

    if(!gameRunning){

        requestAnimationFrame(gameLoop);
        return;
    }

    if(!lastTime)
        lastTime=timestamp;

    let dt=
        (timestamp-lastTime)/1000;

    lastTime=timestamp;

    if(dt>.1)
        dt=.1;

    if(!paused){

        updatePlayer(dt);
        updateEnemies(dt);
        checkEnemyCollision();
        checkFood();
        updateTimer(dt);

        draw();
    }

    fpsCounter++;

    fpsTimer+=dt;

    if(fpsTimer>=1){

        document.getElementById("fpsValue")
            .textContent=
            fpsCounter;

        fpsCounter=0;
        fpsTimer=0;
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

   START
========================================================= */

    const pseudo1=
        document.getElementById("pseudo1")
        .value.trim();

    if(!pseudo1){

        return;
    }

            return;
        }

    players[0].score=0;
    players[1].score=0;

    players[1].time=0;

    players[0].x=players[0].spawnX;
    players[0].y=players[0].spawnY;

    players[1].x=players[1].spawnX;
    players[1].y=players[1].spawnY;

    activePlayer=0;

    level=1;
    score=0;

    createEnemies();
    createFood();

    paused=false;
    gameRunning=true;

    document.getElementById("menuScreen")
        .classList.remove("active");

    document.getElementById("game")
        .classList.add("active");

    updateUI();

    lastTime=performance.now();

    draw();
}

   PAUSE

function togglePause(){

    if(!gameRunning)
        return;

    paused=!paused;

    document.getElementById("pauseOverlay")
        .style.display=

        .textContent=

        .style.display="flex";

function backToMenu(){

    gameRunning=false;

        .classList.remove("active");

        .style.display="none";

/* =========================================================
   TOUCHES TACTILES
========================================================= */

document.querySelectorAll(".dpad button")
.forEach(button=>{

    const dir=button.dataset.dir;

    function start(e){

        e.preventDefault();
        touchDirection[dir]=true;
    }

    function stop(e){

        e.preventDefault();
        touchDirection[dir]=false;
    }

    button.addEventListener("touchstart",start,
        {passive:false});

    button.addEventListener("touchend",stop,
        {passive:false});

    button.addEventListener("touchcancel",stop,
        {passive:false});

    button.addEventListener("mousedown",start);

    button.addEventListener("mouseup",stop);

    button.addEventListener("mouseleave",stop);
});


/* =========================================================
   JOYSTICK
========================================================= */

const joystick=
    document.getElementById("joystick");

const stick=
    document.getElementById("stick");

let joystickActive=false;

function moveJoystick(clientX,clientY){

    const rect=
        joystick.getBoundingClientRect();

    const cx=
        rect.left+rect.width/2;

    const cy=
        rect.top+rect.height/2;

    let dx=clientX-cx;
    let dy=clientY-cy;

    const max=45;

    const dist=Math.hypot(dx,dy);

    if(dist>max){

        dx=dx/dist*max;
        dy=dy/dist*max;
    }

    stick.style.left=
        `calc(50% + ${dx}px)`;

    stick.style.top=
        `calc(50% + ${dy}px)`;

    touchDirection.up=dy<-15;
    touchDirection.down=dy>15;
    touchDirection.left=dx<-15;
    touchDirection.right=dx>15;
}


function resetJoystick(){

    joystickActive=false;

    stick.style.left="50%";
    stick.style.top="50%";

    touchDirection.up=false;
    touchDirection.down=false;
    touchDirection.left=false;
    touchDirection.right=false;
}


joystick.addEventListener("touchstart",e=>{

    e.preventDefault();

    joystickActive=true;

    const t=e.touches[0];

    moveJoystick(t.clientX,t.clientY);

},{passive:false});


joystick.addEventListener("touchmove",e=>{

    e.preventDefault();

    if(!joystickActive)
        return;

    const t=e.touches[0];

    moveJoystick(t.clientX,t.clientY);

},{passive:false});


joystick.addEventListener("touchend",e=>{

    e.preventDefault();

    resetJoystick();

},{passive:false});

   EMPÊCHER LE MENU CONTEXTUEL SUR LES TOUCHES
========================================================= */

document.addEventListener("contextmenu",e=>{
    if(e.target.closest("#mobileControls")){
        e.preventDefault();
    }
});

updateKeyButtons();
