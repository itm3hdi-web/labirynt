<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAHABI — Bijoux acier inoxydable</title>
<style>
  :root{
    --cream:#F7F3EC;
    --ink:#241F1A;
    --gold:#B8935A;
    --gold-deep:#8C6A3A;
    --line:#E4DACB;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Georgia','Iowan Old Style',serif;
    line-height:1.5;
  }
  .eyebrow{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--gold-deep);
  }
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:26px 6vw;
    position:sticky;top:0;background:rgba(247,243,236,.92);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    z-index:10;
  }
  .logo{font-size:22px;letter-spacing:.08em;font-weight:600;}
  nav a{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:13px;letter-spacing:.05em;
    color:var(--ink);text-decoration:none;margin-left:28px;
  }
  nav a:hover{color:var(--gold-deep);}

  .hero{
    display:grid;grid-template-columns:1.1fr .9fr;gap:40px;
    padding:70px 6vw 90px;align-items:center;
  }
  .hero h1{
    font-size:clamp(34px,5vw,58px);
    line-height:1.08;
    font-weight:400;
    letter-spacing:-.01em;
  }
  .hero h1 em{font-style:italic;color:var(--gold-deep);}
  .hero p{
    margin-top:18px;max-width:44ch;
    font-size:17px;color:#4a4238;
  }
  .hero-cta{
    margin-top:30px;display:inline-flex;align-items:center;gap:10px;
    background:var(--ink);color:var(--cream);
    padding:14px 26px;font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:13px;letter-spacing:.05em;text-decoration:none;
    transition:transform .2s ease;
  }
  .hero-cta:hover{transform:translateY(-2px);}
  .hero-visual{
    aspect-ratio:4/5;background:
      radial-gradient(circle at 30% 20%, #fff 0%, transparent 55%),
      linear-gradient(160deg,#EFE4D0,#D8C4A0 55%,#B8935A);
    border-radius:2px;
    position:relative;overflow:hidden;
  }
  .hero-visual::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,.10) 0 2px, transparent 2px 40px);
  }
  .hero-visual .tag{
    position:absolute;bottom:24px;left:24px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11px;letter-spacing:.15em;text-transform:uppercase;
    color:#3a2f22;background:rgba(255,255,255,.75);padding:8px 12px;
  }

  .strip{
    display:flex;justify-content:center;gap:48px;flex-wrap:wrap;
    padding:22px 6vw;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;color:#6b6154;
  }

  section{padding:80px 6vw;}
  .section-head{margin-bottom:40px;max-width:60ch;}
  .section-head h2{font-size:clamp(26px,3vw,36px);font-weight:400;margin-top:8px;}

  .grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:28px;
  }
  .card{
    background:var(--white);border:1px solid var(--line);
    display:flex;flex-direction:column;
  }
  .card-img{
    aspect-ratio:1/1;
    background:linear-gradient(135deg,#EFE7D6,#D9C6A2);
    position:relative;
  }
  .card-img span{
    position:absolute;top:12px;left:12px;
    font-family:'Helvetica
