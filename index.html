<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Labyrinthe Hardcore</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, #26345c 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #351f4d 0%, transparent 35%),
        linear-gradient(135deg, #070b16, #111827, #090d18);
    color: white;
}

body {
    overflow-x: hidden;
}

/* =========================
   ACCUEIL
========================= */

#home {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.home-box {
    width: min(650px, 95vw);
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    background: rgba(15, 23, 42, 0.92);
    border: 2px solid rgba(100, 150, 255, .35);
    box-shadow:
        0 0 40px rgba(0, 0, 0, .6),
        inset 0 0 40px rgba(80, 120, 255, .05);
}

.home-box h1 {
    margin: 0 0 10px;
    font-size: clamp(38px, 8vw, 70px);
    background: linear-gradient(90deg, #4facfe, #00f2fe);
    -webkit-background-clip: text;
    color: transparent;
}

.home-box p {
    color: #b9c4d8;
    font-size: 18px;
}

.input {
    width: 100%;
    margin: 10px 0;
    padding: 15px;
    border-radius: 12px;
    border: 2px solid #334155;
    outline: none;
    background: #0b1120;
    color: white;
    font-size: 18px;
    text-align: center;
}

.input:focus {
    border-color: #38bdf8;
}

.home-button {
    width: 100%;
    margin-top: 15px;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #2563eb, #06b6d4);
    color: white;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
}

.home-button:hover {
    filter: brightness(1.15);
}

.lang-buttons,
.mode-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 15px 0;
}

.small-button {
    padding: 11px 18px;
    border: 2px solid #334155;
    border-radius: 10px;
    background: #111827;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

.small-button.active {
    background: #2563eb;
    border-color: #60a5fa;
}

#player2Input {
    display: none;
}

/* =========================
   JEU
========================= */

#gameScreen {
    display: none;
    min-height: 100vh;
    padding-bottom: 20px;
}

#top {
    min-height: 110px;
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    background: rgba(5, 10, 22, .95);
    border-bottom: 1px solid #26334d;
}

.player-card {
    min-width: 145px;
    padding: 9px 16px;
    border-radius: 14px;
    border: 2px solid #334155;
    background: #151d2f;
    text-align: center;
    transition: .2s;
}

.player-card.active {
    border-color: #22c55e;
    box-shadow: 0 0 15px rgba(34, 197, 94, .25);
}

.player-card.inactive {
    border-color: #ef4444;
}

.player-name {
    font-size: 17px;
    font-weight: bold;
}

.player-score {
    margin-top: 5px;
}

.player-turn {
    margin-top: 5px;
    font-weight: bold;
}

.active .player-turn {
    color: #22ff70;
}

.inactive .player-turn {
    color: #ff4444;
}

.stats {
    display: flex;
    gap: 18px;
    align-items: center;
    flex-wrap: wrap;
    font-weight: bold;
    padding: 10px;
}

#gameArea {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 12px;
}

canvas {
    display: block;
    width: min(900px, 96vw);
    height: auto;
    background: #222;
    border: 4px solid white;
    border-radius: 5px;
    box-shadow: 0 0 25px rgba(0,0,0,.7);
    touch-action: none;
}

/* =========================
   MESSAGE
========================= */

#message {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: rgba(0,0,0,.88);
    z-index: 20;
    padding: 20px;
    text-align: center;
}

#message h1 {
    font-size: clamp(40px, 10vw, 70px);
    margin: 10px;
}

#message p {
    font-size: 20px;
}

.message-button {
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

/* =========================
   TOUCHES TELEPHONE
========================= */

#mobileControls {
    display: none;
    width: 220px;
    margin: 10px auto 25px;
    user-select: none;
}

.control-row {
    display: flex;
    justify-content: center;
    gap: 8px;
}

.control-button {
    width: 65px;
    height: 65px;
    margin: 4px;
    border-radius: 15px;
    border: 2px solid #64748b;
    background: #172033;
    color: white;
    font-size: 30px;
    font-weight: bold;
    touch-action: none;
    -webkit-user-select: none;
}

.control-button:active {
    background: #2563eb;
    transform: scale(.94);
}

@media (max-width: 700px) {

    #top {
        min-height: auto;
    }

    .player-card {
        min-width: 125px;
        padding: 7px 10px;
    }

    .stats {
        justify-content: center;
        width: 100%;
        font-size: 14px;
        gap: 10px;
    }

    #mobileControls {
        display: block;
    }

    .home-box {
        padding: 25px 18px;
    }
}
</style>
</head>

<body>

<!-- =========================
     ACCUEIL
========================= -->

<div id="home">

    <div class="home-box">

        <h1>🌀 Labyrinthe</h1>

        <p id="welcomeText">
            Bienvenue dans le Labyrinthe Hardcore !
        </p>

            <button class="small-button active" onclick="setLanguage('fr')" id="frBtn">
                🇫🇷 Français

                🇸🇦 العربية

        <input

            type="text"
            maxlength="18"

            placeholder="Pseudo du joueur 2"

        <button class="home-button" onclick="startGame()" id="playButton">
            ▶ Jouer
        </button>

    </div>

</div>


<!-- =========================
     JEU
========================= -->

<div id="gameScreen">

    <div id="top">

        <div class="player-card active" id="card1">

            <div class="player-name" id="name1">
                Joueur 1
            </div>

            <div class="player-score">
                Score :

            </div>

            <div class="player-turn" id="turn1">

            </div>

        </div>


        <div class="player-card inactive" id="card2">

            <div class="player-name" id="name2">
                Joueur 2
            </div>

            <div class="player-score">
                Score :
                <span id="score2">0</span>
            </div>

            <div class="player-turn" id="turn2">
                Tour de Joueur 2
            </div>

        </div>


        <div class="stats">

            <span>
                Niveau :
                <span id="level">1</span>/23

            <span>
                Vitesse joueur :
                <span id="playerSpeed">6</span>
            </span>

            <span>
                Vitesse robots :
                <span id="robotSpeed">1.0</span>
            </span>

    </div>


    <div id="gameArea">

        <canvas id="game" width="900" height="600"></canvas>

    </div>

    <div id="mobileControls">

        <div class="control-row">

            <button class="control-button"
                data-key="arrowup">▲</button>

        </div>

        <div class="control-row">

            <button class="control-button"
                data-key="arrowleft">◀</button>

            <button class="control-button"
                data-key="arrowdown">▼</button>

            <button class="control-button"
                data-key="arrowright">▶</button>

    </div>

</div>


<!-- =========================
     MESSAGE
========================= -->

<div id="message">

    <h1 id="messageTitle"></h1>

    <p id="messageText"></p>

    <button
        class="message-button"
        id="messageButton"
        onclick="restartAfterDeath()">
        Recommencer
    </button>

</div>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const home = document.getElementById("home");
const gameScreen = document.getElementById("gameScreen");

const message = document.getElementById("message");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");

const keys = {};

let language = "fr";
let mode = "solo";

let level = 1;
const MAX_LEVEL = 23;

let currentPlayer = 0;

let players = [
    {
        name: "Joueur 1",
        score: 0
    },
    {
        name: "Joueur 2",
        score: 0
    }
];

let gameRunning = false;

let walls = [];
let robots = [];

let mazeCols = 10;
let mazeRows = 7;

let cellW = 90;
let cellH = 85;

let exit = {
    x: 0,
    y: 0,
    size: 25
};

const player = {
    x: 0,
    y: 0,
    size: 14,
    speed: 6
};


/* =====================================================
   TRADUCTIONS
===================================================== */

const texts = {

    fr: {
        welcome: "Bienvenue dans le Labyrinthe Hardcore !",
        language: "Choisis ta langue",
        mode: "Mode de jeu",
        solo: "👤 Solo",
        duo: "👥 Duo",
        pseudo1: "Ton pseudo",
        pseudo2: "Pseudo du joueur 2",
        play: "▶ Jouer",
        level: "Niveau",
        playerSpeed: "Vitesse joueur",
        robotSpeed: "Vitesse robots",
        turn: "Tour de",
        wall: "💥 TU AS TOUCHÉ UN MUR !",
        robot: "🤖 UN ROBOT T'A TOUCHÉ !",
        restart: "Recommencer",
        victory: "🏆 VICTOIRE !",
        finished: "Tu as terminé les 23 niveaux !",
        death: "LOOSERRRR 😈"
    },

    en: {
        welcome: "Welcome to Hardcore Maze!",
        language: "Choose your language",
        mode: "Game mode",
        solo: "👤 Solo",
        duo: "👥 Duo",
        pseudo1: "Your nickname",
        pseudo2: "Player 2 nickname",
        play: "▶ Play",
        level: "Level",
        playerSpeed: "Player speed",
        robotSpeed: "Robot speed",
        turn: "Turn of",
        wall: "💥 YOU HIT A WALL!",
        robot: "🤖 A ROBOT TOUCHED YOU!",
        restart: "Restart",
        victory: "🏆 VICTORY!",
        finished: "You completed all 23 levels!",
        death: "LOOSERRRR 😈"
    },

    ar: {
        welcome: "مرحباً بك في المتاهة الصعبة!",
        language: "اختر لغتك",
        mode: "وضع اللعب",
        solo: "👤 فردي",
        duo: "👥 لاعبان",
        pseudo1: "اسمك المستعار",
        pseudo2: "اسم اللاعب الثاني",
        play: "▶ العب",
        level: "المستوى",
        playerSpeed: "سرعة اللاعب",
        robotSpeed: "سرعة الروبوتات",
        turn: "دور",
        wall: "💥 اصطدمت بالجدار!",
        robot: "🤖 لمسَك روبوت!",
        restart: "إعادة المحاولة",
        victory: "🏆 فوز!",
        finished: "لقد أنهيت جميع المستويات الـ23!",
        death: "😈 خسرت!"
    }

};


/* =====================================================
   LANGUE
===================================================== */

function setLanguage(lang) {

    language = lang;

    document.documentElement.lang = lang;

    document.getElementById("welcomeText").textContent =
        texts[lang].welcome;

    document.getElementById("languageTitle").textContent =
        texts[lang].language;

    document.getElementById("modeTitle").textContent =
        texts[lang].mode;

    document.getElementById("soloBtn").textContent =
        texts[lang].solo;

    document.getElementById("duoBtn").textContent =
        texts[lang].duo;

    document.getElementById("player1Input").placeholder =
        texts[lang].pseudo1;

    document.getElementById("player2Input").placeholder =
        texts[lang].pseudo2;

    document.getElementById("playButton").textContent =
        texts[lang].play;

    document.getElementById("frBtn").classList.remove("active");
    document.getElementById("enBtn").classList.remove("active");
    document.getElementById("arBtn").classList.remove("active");

    document
        .getElementById(lang + "Btn")
        .classList.add("active");

    if (lang === "ar") {
        document.body.dir = "rtl";
    } else {
        document.body.dir = "ltr";
    }
}


/* =====================================================
   MODE SOLO / DUO
===================================================== */

function setMode(newMode) {

    mode = newMode;

    document.getElementById("soloBtn")
        .classList.remove("active");

    document.getElementById("duoBtn")
        .classList.remove("active");

    if (mode === "solo") {

        document.getElementById("soloBtn")
            .classList.add("active");

        document.getElementById("player2Input")
            .style.display = "none";

    } else {

        document.getElementById("duoBtn")
            .classList.add("active");

        document.getElementById("player2Input")
            .style.display = "block";
    }
}


/* =====================================================
   DÉMARRER LE JEU
===================================================== */

function startGame() {

    let p1 =
        document.getElementById("player1Input")
            .value.trim();

    let p2 =
        document.getElementById("player2Input")
            .value.trim();


    if (!p1) {
        p1 = "Joueur 1";
    }

    if (!p2) {
        p2 = "Joueur 2";
    }


    players[0].name = p1;
    players[0].score = 0;

    players[1].name = p2;
    players[1].score = 0;


    currentPlayer = 0;
    level = 1;

    home.style.display = "none";
    gameScreen.style.display = "block";

    gameRunning = true;

    updateInterface();

    loadLevel();

    requestAnimationFrame(gameLoop);
}


/* =====================================================
   GÉNÉRATEUR ALÉATOIRE
===================================================== */

function randomGenerator(seed) {

    let value = seed;

    return function() {

        value =
            (value * 9301 + 49297) %
            233280;

        return value / 233280;
    };
}


/* =====================================================
   DIFFICULTÉ PROGRESSIVE
===================================================== */

function getMazeSize(levelNumber) {

    /*
       Niveau 1 :
       8 x 6 -> très facile

       Niveau 23 :
       28 x 19 -> beaucoup plus difficile
    */

    const cols =
        Math.round(
            8 +
            ((28 - 8) / 22) *
            (levelNumber - 1)
        );

    const rows =
        Math.round(
            6 +
            ((19 - 6) / 22) *
            (levelNumber - 1)
        );

    return {
        cols: Math.max(8, cols),
        rows: Math.max(6, rows)
    };
}


/* =====================================================
   CRÉATION DU LABYRINTHE
===================================================== */

function generateMaze(levelNumber) {

    walls = [];
    robots = [];


    const size =
        getMazeSize(levelNumber);

    mazeCols = size.cols;
    mazeRows = size.rows;

    cellW =
        canvas.width / mazeCols;

    cellH =
        canvas.height / mazeRows;


    const random =
        randomGenerator(
            levelNumber * 98765 + 123
        );


    /*
       Création des cellules.
    */

    const cells = [];


    for (let y = 0; y < mazeRows; y++) {

        cells[y] = [];

        for (let x = 0; x < mazeCols; x++) {

            cells[y][x] = {

                visited: false,

                walls: {
                    top: true,
                    right: true,
                    bottom: true,
                    left: true
                }

            };
        }
    }


    /*
       Algorithme DFS.
    */

    const stack = [];

    cells[0][0].visited = true;

    stack.push({
        x: 0,
        y: 0
    });


    while (stack.length > 0) {

        const current =
            stack[stack.length - 1];

        const neighbours = [];


        if (
            current.y > 0 &&
            !cells[current.y - 1][current.x].visited
        ) {

            neighbours.push({
                x: current.x,
                y: current.y - 1,
                direction: "top"
            });

        }


        if (
            current.x < mazeCols - 1 &&
            !cells[current.y][current.x + 1].visited
        ) {

            neighbours.push({
                x: current.x + 1,
                y: current.y,
                direction: "right"
            });

        }


        if (
            current.y < mazeRows - 1 &&
            !cells[current.y + 1][current.x].visited
        ) {

            neighbours.push({
                x: current.x,
                y: current.y + 1,
                direction: "bottom"
            });

        }


        if (
            current.x > 0 &&
            !cells[current.y][current.x - 1].visited
        ) {

            neighbours.push({
                x: current.x - 1,
                y: current.y,
                direction: "left"
            });

        }


        if (neighbours.length === 0) {

            stack.pop();
            continue;

        }


        const next =
            neighbours[
                Math.floor(
                    random() * neighbours.length
                )
            ];


        const currentCell =
            cells[current.y][current.x];

        const nextCell =
            cells[next.y][next.x];


        if (next.direction === "top") {

            currentCell.walls.top = false;
            nextCell.walls.bottom = false;

        }

        else if (next.direction === "right") {

            currentCell.walls.right = false;
            nextCell.walls.left = false;

        }

        else if (next.direction === "bottom") {

            currentCell.walls.bottom = false;
            nextCell.walls.top = false;

        }

        else if (next.direction === "left") {

            currentCell.walls.left = false;
            nextCell.walls.right = false;

        }


        nextCell.visited = true;

        stack.push({
            x: next.x,
            y: next.y
        });
    }


    /*
       Épaisseur des murs.
    */

    const wallThickness =
        Math.max(
            3,
            Math.min(
                7,
                6 - levelNumber * 0.08
            )
        );


    /*
       Transformation des murs
       en rectangles.
    */

    for (let y = 0; y < mazeRows; y++) {

        for (let x = 0; x < mazeCols; x++) {

            const cell = cells[y][x];

            const px = x * cellW;
            const py = y * cellH;


            if (cell.walls.top) {

                walls.push({
                    x: px,
                    y: py,
                    w: cellW + wallThickness,
                    h: wallThickness
                });

            }


            if (cell.walls.left) {

                walls.push({
                    x: px,
                    y: py,
                    w: wallThickness,
                    h: cellH + wallThickness
                });

            }


            if (
                x === mazeCols - 1 &&
                cell.walls.right
            ) {

                walls.push({
                    x: px + cellW,
                    y: py,
                    w: wallThickness,
                    h: cellH
                });

            }


            if (
                y === mazeRows - 1 &&
                cell.walls.bottom
            ) {

                walls.push({
                    x: px,
                    y: py + cellH,
                    w: cellW,
                    h: wallThickness
                });

            }
        }
    }


    /*
       Joueur : départ.
    */

    player.x =
        cellW * 0.30;

    player.y =
        cellH * 0.30;


    /*
       Sortie : coin opposé.
    */

    exit.size =
        Math.max(
            14,
            Math.min(cellW, cellH) * 0.35
        );

    exit.x =
        (mazeCols - 1) * cellW +
        cellW * 0.32;

    exit.y =
        (mazeRows - 1) * cellH +
        cellH * 0.32;


    /*
       Robots.
       Niveau 1 = aucun robot.
       Puis ils arrivent progressivement.
    */

    const robotCount =
        levelNumber < 3
            ? 0
            : Math.min(
                1 + Math.floor((levelNumber - 2) / 2),
                10
            );


    const robotSpeed =
        levelNumber < 3
            ? 1
            : 0.8 + levelNumber * 0.13;


    for (let i = 0; i < robotCount; i++) {

        let rx;
        let ry;


        /*
           On place les robots plutôt loin
           du départ.
        */

        do {

            rx =
                Math.floor(
                    random() * mazeCols
                );

            ry =
                Math.floor(
                    random() * mazeRows
                );

        } while (
            rx < 3 &&
            ry < 3
        );


        robots.push({

            x:
                rx * cellW +
                cellW * 0.35,

            y:
                ry * cellH +
                cellH * 0.35,

            size:
                Math.max(
                    10,
                    Math.min(cellW, cellH) * 0.28
                ),

            speed: robotSpeed,

            direction:
                random() > 0.5 ? 1 : -1,

            horizontal:
                random() > 0.5

        });
    }
}


/* =====================================================
   COLLISION
===================================================== */

function isColliding(a, b) {

    return (
        a.x < b.x + b.w &&
        a.x + a.size > b.x &&
        a.y < b.y + b.h &&
        a.y + a.size > b.y
    );
}


/* =====================================================
   DÉPLACEMENT
===================================================== */

function movePlayer() {

    if (!gameRunning)
        return;


    let dx = 0;
    let dy = 0;


    if (
        keys["arrowright"] ||
        keys["d"]
    ) {

        dx += player.speed;
    }


    if (
        keys["arrowleft"] ||
        keys["q"] ||
        keys["a"]
    ) {

        dx -= player.speed;
    }


    if (
        keys["arrowdown"] ||
        keys["s"]
    ) {

        dy += player.speed;
    }


    if (
        keys["arrowup"] ||
        keys["z"] ||
        keys["w"]
    ) {

        dy -= player.speed;
    }


    if (dx === 0 && dy === 0)
        return;


    /*
       Déplacement horizontal séparé.
       Cela évite que le joueur traverse
       certains coins de murs.
    */

    const oldX = player.x;

    player.x += dx;


    for (const wall of walls) {

        if (isColliding(player, wall)) {

            player.x = oldX;

            lose(
                texts[language].wall
            );

            return;
        }
    }


    const oldY = player.y;

    player.y += dy;


    for (const wall of walls) {

        if (isColliding(player, wall)) {

            player.y = oldY;

            lose(
                texts[language].wall
            );

            return;
        }
    }
}


/* =====================================================
   ROBOTS
===================================================== */

function updateRobots() {

    if (!gameRunning)
        return;


    for (const robot of robots) {

        if (robot.horizontal) {

            robot.x +=
                robot.direction *
                robot.speed;

            if (
                robot.x < 10 ||
                robot.x >
                canvas.width - robot.size - 10
            ) {

                robot.direction *= -1;
            }

        } else {

            robot.y +=
                robot.direction *
                robot.speed;

            if (
                robot.y < 10 ||
                robot.y >
                canvas.height - robot.size - 10
            ) {

                robot.direction *= -1;
            }
        }


        const r = {

            x: robot.x,
            y: robot.y,
            w: robot.size,
            h: robot.size

        };


        if (isColliding(player, r)) {

            lose(
                texts[language].robot
            );

            return;
        }
    }
}


/* =====================================================
   SORTIE
===================================================== */

function checkExit() {

    if (!gameRunning)
        return;


    const e = {

        x: exit.x,
        y: exit.y,
        w: exit.size,
        h: exit.size

    };


    if (isColliding(player, e)) {

        levelComplete();
    }
}


/* =====================================================
   NIVEAU TERMINÉ
===================================================== */

function levelComplete() {

    const gain =
        Math.max(
            1,
            5 - Math.floor((level - 1) / 5)
        );


    players[currentPlayer].score += gain;


    if (level >= MAX_LEVEL) {

        winGame();
        return;
    }


    level++;

    loadLevel();

    updateInterface();
}


/* =====================================================
   PERTE
===================================================== */

function lose(reason) {

    if (!gameRunning)
        return;


    const penalty =
        Math.min(
            6,
            2 + Math.floor(level / 5)
        );


    /*
       Le score peut être négatif.
    */

    players[currentPlayer].score -= penalty;


    gameRunning = false;


    updateInterface();


    /*
       SOLO
    */

    if (mode === "solo") {

        messageTitle.textContent =
            texts[language].death;

        messageText.textContent =
            reason +
            "  -" +
            penalty +
            " points";


        message.style.display = "flex";

        return;
    }


    /*
       DUO :
       on change de joueur.
    */

    const oldPlayer =
        players[currentPlayer].name;


    currentPlayer =
        currentPlayer === 0 ? 1 : 0;


    const newPlayer =
        players[currentPlayer].name;


    messageTitle.textContent =
        "🔄 " +
        texts[language].turn +
        " " +
        newPlayer;


    messageText.textContent =
        oldPlayer +
        " a perdu !  " +
        penalty +
        " points.";


    message.style.display = "flex";

    updateInterface();
}


/* =====================================================
   RECOMMENCER APRÈS UNE PERTE
===================================================== */

function restartAfterDeath() {

    message.style.display = "none";

    gameRunning = true;

    /*
       Le joueur qui vient de prendre son tour
       recommence le même niveau depuis le début.
    */

    loadLevel();

    updateInterface();
}


/* =====================================================
   VICTOIRE
===================================================== */

function winGame() {

    gameRunning = false;

    messageTitle.textContent =
        texts[language].victory;

    messageText.textContent =
        texts[language].finished +
        " " +
        players[currentPlayer].name +
        " : " +
        players[currentPlayer].score;

    message.style.display = "flex";
}


/* =====================================================
   INTERFACE
===================================================== */

function updateInterface() {

    document.getElementById("name1")
        .textContent =
        players[0].name;

    document.getElementById("name2")
        .textContent =
        players[1].name;


    document.getElementById("score1")
        .textContent =
        players[0].score;

    document.getElementById("score2")
        .textContent =
        players[1].score;


    document.getElementById("level")
        .textContent =
        level;


    document.getElementById("playerSpeed")
        .textContent =
        player.speed;


    const rs =
        level < 3
            ? 0
            : 0.8 + level * 0.13;


    document.getElementById("robotSpeed")
        .textContent =
        rs.toFixed(1);


    document.getElementById("turn1")
        .textContent =
        texts[language].turn +
        " " +
        players[0].name;


    document.getElementById("turn2")
        .textContent =
        texts[language].turn +
        " " +
        players[1].name;


    const card1 =
        document.getElementById("card1");

    const card2 =
        document.getElementById("card2");


    card1.classList.remove(
        "active",
        "inactive"
    );

    card2.classList.remove(
        "active",
        "inactive"
    );


    if (currentPlayer === 0) {

        card1.classList.add("active");
        card2.classList.add("inactive");

    } else {

        card1.classList.add("inactive");
        card2.classList.add("active");
    }
}


/* =====================================================
   DESSIN DU JEU
===================================================== */

function draw() {

    /*
       IMPORTANT :
       On efface toujours le canvas
       puis on redessine entièrement.
    */

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Fond du labyrinthe.
    */

    ctx.fillStyle = "#222";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Petites cases légèrement visibles.
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.025)";

    ctx.lineWidth = 1;


    for (let x = 0; x <= mazeCols; x++) {

        ctx.beginPath();

        ctx.moveTo(
            x * cellW,
            0
        );

        ctx.lineTo(
            x * cellW,
            canvas.height
        );

        ctx.stroke();
    }


    for (let y = 0; y <= mazeRows; y++) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y * cellH
        );

        ctx.lineTo(
            canvas.width,
            y * cellH
        );

        ctx.stroke();
    }


    /*
       MURS
    */

    ctx.fillStyle = "#eeeeee";


    for (const wall of walls) {

        ctx.fillRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );
    }


    /*
       SORTIE
    */

    ctx.fillStyle = "#00ff66";

    ctx.shadowColor = "#00ff66";
    ctx.shadowBlur = 15;

    ctx.fillRect(
        exit.x,
        exit.y,
        exit.size,
        exit.size
    );

    ctx.shadowBlur = 0;


    /*
       ROBOTS
    */

    for (const robot of robots) {

        ctx.fillStyle = "#ff3030";

        ctx.fillRect(
            robot.x,
            robot.y,
            robot.size,
            robot.size
        );


        /*
           Yeux
        */

        ctx.fillStyle = "white";

        const eye =
            Math.max(
                2,
                robot.size * .18
            );


        ctx.fillRect(
            robot.x + robot.size * .20,
            robot.y + robot.size * .20,
            eye,
            eye
        );


        ctx.fillRect(
            robot.x + robot.size * .62,
            robot.y + robot.size * .20,
            eye,
            eye
        );
    }


    /*
       JOUEUR
    */

    ctx.fillStyle = "#3498ff";

    ctx.shadowColor = "#3498ff";
    ctx.shadowBlur = 12;

    ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
    );

    ctx.shadowBlur = 0;
}


/* =====================================================
   BOUCLE PRINCIPALE
===================================================== */

function gameLoop() {

    if (gameRunning) {

        movePlayer();

        updateRobots();

        checkExit();
    }


    draw();

    requestAnimationFrame(gameLoop);
}


/* =====================================================
   CHARGER LE NIVEAU
===================================================== */

function loadLevel() {

    generateMaze(level);

    updateInterface();

    /*
       Dessine immédiatement le labyrinthe.
       Cela évite le problème de canvas noir.
    */

    draw();
}


/* =====================================================
   CLAVIER
===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        /*
           Empêche les flèches de faire défiler
           la page.
        */

        const gameKeys = [
            "arrowup",
            "arrowdown",
            "arrowleft",
            "arrowright",
            "z",
            "q",
            "s",
            "d",
            "w",
            "a"
        ];


        const key =
            e.key.toLowerCase();


        if (gameKeys.includes(key)) {

            e.preventDefault();

            keys[key] = true;
        }
    },
    { passive: false }
);


document.addEventListener(
    "keyup",
    function(e) {

        keys[e.key.toLowerCase()] = false;
    }
);


/* =====================================================
   TOUCHES TELEPHONE
===================================================== */

document
    .querySelectorAll(".control-button")
    .forEach(button => {

        const key =
            button.dataset.key;


        function press(e) {

            e.preventDefault();

            keys[key] = true;
        }


        function release(e) {

            e.preventDefault();

            keys[key] = false;
        }


        button.addEventListener(
            "touchstart",
            press,
            { passive: false }
        );

        button.addEventListener(
            "touchend",
            release,
            { passive: false }
        );

        button.addEventListener(
            "touchcancel",
            release,
            { passive: false }
        );


        /*
           Permet aussi de tester avec la souris
           sur PC.
        */

        button.addEventListener(
            "mousedown",
            press
        );

        button.addEventListener(
            "mouseup",
            release
        );

        button.addEventListener(
            "mouseleave",
            release
        );
    });


/* =====================================================
   INITIALISATION
===================================================== */

setLanguage("fr");
setMode("solo");

</script>
