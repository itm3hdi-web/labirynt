<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Labyrinthe Hardcore</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: #070b16;
    color: white;
}

body {
    overflow-x: hidden;
    touch-action: manipulation;
}

button,
input,
select {
    font: inherit;
}

/* =========================
   ACCUEIL
========================= */

#menu {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(52,152,255,.25),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(0,255,102,.15),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #050816,
            #10182b 55%,
            #050816
        );
}

#menuCard {
    width: min(520px, 94vw);
    padding: 34px;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 24px;
    background: rgba(10,14,28,.94);
    box-shadow: 0 25px 80px rgba(0,0,0,.55);
    text-align: center;
}

.logo {
    font-size: 55px;
}

#menuCard h1 {
    margin: 8px 0;
    font-size: 38px;
}

.subtitle {
    color: #b9c3d8;
    margin: 10px 0 25px;
    line-height: 1.5;
}

.formRow {
    text-align: left;
    margin: 14px 0;
}

.formRow label {
    display: block;
    margin-bottom: 7px;
    color: #dbe4f5;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid #3a4661;
    background: #161e31;
    color: white;
    outline: none;
}

input:focus,
select:focus {
    border-color: #3498ff;
    box-shadow: 0 0 0 3px rgba(52,152,255,.16);
}

.modeRow {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.modeBtn {
    padding: 14px;
    border: 1px solid #3a4661;
    border-radius: 12px;
    background: #141b2c;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.modeBtn.active {
    background: #3498ff;
    border-color: #3498ff;
}

#player2Row {
    display: none;
}

#startBtn {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 13px;
    background: linear-gradient(135deg,#3498ff,#1474dc);
    color: white;
    font-weight: bold;
    font-size: 20px;
    margin-top: 12px;
    cursor: pointer;
}

#error {
    min-height: 20px;
    color: #ff7777;
    margin-top: 10px;
}

/* =========================
   JEU
========================= */

#gameUI {
    display: none;
}

#top {
    min-height: 90px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    background: #121722;
    flex-wrap: wrap;
    padding: 10px 14px;
}

.playersBox {
    display: flex;
    gap: 10px;
}

.playerCard {
    width: 150px;
    min-height: 76px;
    padding: 8px 10px;

    border-radius: 12px;

    background: #1b2230;

    border: 2px solid #3a4661;

    text-align: center;

    font-size: 14px;

    box-shadow: 0 4px 15px rgba(0,0,0,.25);
}

.playerCardName {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 4px;
}

.playerTurn {
    font-weight: bold;
    margin-top: 4px;
}

.playerTurn.active {
    color: #00ff66;
}

.playerTurn.inactive {
    color: #ff4040;
}

.gameStats {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 15px;
}

.gameStats span {
    font-weight: bold;
}

canvas {
    display: block;
    margin: 10px auto;
    border: 4px solid white;
    background: #222;
    max-width: 95vw;
    height: auto;
}

/* =========================
   TOUCHES TELEPHONE
========================= */

#mobileControls {
    display: none;
    width: 220px;
    margin: 10px auto 25px;
    user-select: none;
    touch-action: none;
}

.mobileRow {
    display: flex;
    justify-content: center;
    gap: 8px;
}

.mobileButton {
    width: 65px;
    height: 65px;
    padding: 0;
    border: 2px solid white;
    border-radius: 12px;
    background: #333;
    color: white;
    font-size: 30px;
    user-select: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
}

.mobileButton:active {
    background: #666;
    transform: scale(.95);
}

/* =========================
   MESSAGE
========================= */

#message {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: rgba(0,0,0,.93);
    z-index: 110;
    text-align: center;
    padding: 20px;
}

#message h1 {
    font-size: 58px;
    margin: 10px;
}

#message p {
    font-size: 22px;
    max-width: 700px;
    white-space: pre-line;
    line-height: 1.5;
}

#messageButton {
    padding: 14px 25px;
    border: 0;
    border-radius: 10px;
    background: #3498ff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

/* =========================
   TELEPHONE
========================= */

@media (max-width: 700px) {

    #top {
        gap: 7px 10px;
        font-size: 12px;
    }

    .playersBox {
        width: 100%;
        justify-content: center;
    }

    .playerCard {
        width: 135px;
        min-height: 70px;
        font-size: 12px;
    }

    .playerCardName {
        font-size: 15px;
    }

    .gameStats {
        width: 100%;
        justify-content: center;
        gap: 8px 14px;
        font-size: 12px;
    }

    canvas {
        width: 96vw;
        margin: 8px auto;
        border-width: 3px;
    }

    #mobileControls {
        display: block;
    }

    #menuCard {
        padding: 25px;
    }

    #menuCard h1 {
        font-size: 30px;
    }

    #message h1 {
        font-size: 42px;
    }

    #message p {
        font-size: 18px;
    }
}
</style>
</head>

/* =====================================================
   TRADUCTION
===================================================== */

function t(key) {

}

        errorText.textContent =
            t("enter");

    if(
        mode === "duo" &&
        !p2
    ) {

        errorText.textContent =
            t("enterBoth");

        return;

    }


    names[0] =
        p1;

    names[1] =
        mode === "duo"
            ? p2
            : "—";


    currentPlayer = 0;

    level = 1;

    scores[0] = 0;

    scores[1] = 0;

    gameRunning = true;

        "none";

    gameUI.style.display =
        "block";

    message.style.display =
        "none";

    loadLevel();

}


/* =====================================================
   GENERATEUR ALEATOIRE
===================================================== */

function randomGenerator(seed) {

    let value = seed;

    return function() {

        value =
            (value * 9301 + 49297)
            % 233280;

        return value / 233280;

    };

}


/* =====================================================
   GENERATION DU LABYRINTHE
===================================================== */

function generateMaze(levelNumber) {

    walls = [];

    robots = [];


    /*
       Niveau 1 très facile.
       Puis difficulté progressive.
    */

    let cols;

    let rows;


    if(levelNumber <= 3) {

        cols =
            12 + levelNumber * 2;

        rows =
            8 + levelNumber;

    }

    else {

        cols =
            18 +
            Math.floor(levelNumber * 0.55);

        rows =
            12 +
            Math.floor(levelNumber * 0.30);

    }


    cols =
        Math.min(cols, 31);

    rows =
        Math.min(rows, 19);


    const cellW =
        canvas.width / cols;

    const cellH =
        canvas.height / rows;


    const random =
        randomGenerator(
            levelNumber * 98431 + 17
        );


    const cells = [];


    for(let y = 0; y < rows; y++) {

        cells[y] = [];

        for(let x = 0; x < cols; x++) {

            cells[y][x] = {

                visited: false,

                walls: {

                    top: true,

                    right: true,

                    bottom: true,

                    left: true

                }

            };

        }

    }


    /*
       DFS
    */

    const stack = [];

    cells[0][0].visited = true;

    stack.push({
        x: 0,
        y: 0
    });


    while(stack.length) {

        const current =
            stack[stack.length - 1];

        const neighbours = [];


        if(
            current.y > 0 &&
            !cells[current.y - 1][current.x].visited
        ) {

            neighbours.push({
                x: current.x,
                y: current.y - 1,
                direction: "top"
            });

        }


        if(
            current.x < cols - 1 &&
            !cells[current.y][current.x + 1].visited
        ) {

            neighbours.push({
                x: current.x + 1,
                y: current.y,
                direction: "right"
            });

        }


        if(
            current.y < rows - 1 &&
            !cells[current.y + 1][current.x].visited
        ) {

            neighbours.push({
                x: current.x,
                y: current.y + 1,
                direction: "bottom"
            });

        }


        if(
            current.x > 0 &&
            !cells[current.y][current.x - 1].visited
        ) {

            neighbours.push({
                x: current.x - 1,
                y: current.y,
                direction: "left"
            });

        }


        if(neighbours.length) {

            const next =
                neighbours[
                    Math.floor(
                        random() *
                        neighbours.length
                    )
                ];


            const cell =
                cells[current.y][current.x];

            const nextCell =
                cells[next.y][next.x];


            if(next.direction === "top") {

                cell.walls.top = false;

                nextCell.walls.bottom = false;

            }


            if(next.direction === "right") {

                cell.walls.right = false;

                nextCell.walls.left = false;

            }


            if(next.direction === "bottom") {

                cell.walls.bottom = false;

                nextCell.walls.top = false;

            }


            if(next.direction === "left") {

                cell.walls.left = false;

                nextCell.walls.right = false;

            }


            nextCell.visited = true;

            stack.push({
                x: next.x,
                y: next.y
            });

        }

        else {

            stack.pop();

        }

    }


    /*
       Epaisseur des murs.
    */

    const wallThickness =
        Math.max(
            3,
            7 - levelNumber * 0.12
        );


    /*
       Transformer les murs
       en rectangles.
    */

    for(let y = 0; y < rows; y++) {

        for(let x = 0; x < cols; x++) {

            const cell =
                cells[y][x];

            const px =
                x * cellW;

            const py =
                y * cellH;


            if(cell.walls.top) {

                walls.push({

                    x: px,

                    y: py,

                    w:
                        cellW +
                        wallThickness,

                    h:
                        wallThickness

                });

            }


            if(cell.walls.left) {

                walls.push({

                    x: px,

                    y: py,

                    w:
                        wallThickness,

                    h:
                        cellH +
                        wallThickness

                });

            }


            if(
                x === cols - 1 &&
                cell.walls.right
            ) {

                walls.push({

                    x:
                        px + cellW,

                    y:
                        py,

                    w:
                        wallThickness,

                    h:
                        cellH

                });

            }


            if(
                y === rows - 1 &&
                cell.walls.bottom
            ) {

                walls.push({

                    x:
                        px,

                    y:
                        py + cellH,

                    w:
                        cellW,

                    h:
                        wallThickness

                });

            }

        }

    }


    /*
       Position du joueur.
    */

    player.x =
        cellW * 0.25;

    player.y =
        cellH * 0.25;


    /*
       Sortie.
    */

    exit.x =
        (cols - 1) * cellW +
        cellW * 0.35;

    exit.y =
        (rows - 1) * cellH +
        cellH * 0.35;

    exit.size =
        Math.max(
            12,
            Math.min(
                cellW,
                cellH
            ) * .30
        );


    /*
       ROBOTS

       Aucun robot au tout début.
       Ils arrivent progressivement.
    */

    const robotCount =
        levelNumber < 4
            ? 0
            : Math.min(
                Math.floor(
                    (levelNumber - 2) / 2
                ),
                12
            );


    const robotSpeed =
        0.65 +
        levelNumber * 0.12;


    for(
        let i = 0;
        i < robotCount;
        i++
    ) {

        const horizontal =
            random() > .5;


        const rx =
            cellW *
            (
                2 +
                Math.floor(
                    random() *
                    Math.max(
                        1,
                        cols - 4
                    )
                )
            );


        const ry =
            cellH *
            (
                1 +
                Math.floor(
                    random() *
                    Math.max(
                        1,
                        rows - 3
                    )
                )
            );


        robots.push({

            x: rx,

            y: ry,

            size:
                Math.max(
                    10,
                    Math.min(
                        cellW,
                        cellH
                    ) * .30
                ),

            speed:
                robotSpeed,

            direction:
                random() > .5
                    ? 1
                    : -1,

            horizontal:
                horizontal

        });

    }

}


/* =====================================================
   COLLISION
===================================================== */

function isColliding(a, b) {

    return (

        a.x < b.x + b.w &&

        a.x + a.size > b.x &&

        a.y < b.y + b.h &&

        a.y + a.size > b.y

    );

}


/* =====================================================
   DEPLACEMENT
===================================================== */

function movePlayer() {

    if(!gameRunning)
        return;


    let dx = 0;

    let dy = 0;


    if(
        keys["arrowright"] ||
        keys["d"]
    ) {

        dx += player.speed;

    }


    if(
        keys["arrowleft"] ||
        keys["q"] ||
        keys["a"]
    ) {

        dx -= player.speed;

    }


    if(
        keys["arrowdown"] ||
        keys["s"]
    ) {

        dy += player.speed;

    }


    if(
        keys["arrowup"] ||
        keys["z"] ||
        keys["w"]
    ) {

        dy -= player.speed;

    }


    if(dx === 0 && dy === 0)
        return;


    const oldX =
        player.x;

    const oldY =
        player.y;


    player.x += dx;

    player.y += dy;


    for(const wall of walls) {

        if(
            isColliding(
                player,
                wall
            )
        ) {

            player.x = oldX;

            player.y = oldY;

            lose(
                t("wall")
            );

            return;

        }

    }

}


/* =====================================================
   CLAVIER
===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        const key =
            e.key.toLowerCase();

        keys[key] = true;

        if(
            [
                "arrowup",
                "arrowdown",
                "arrowleft",
                "arrowright",
                " "
            ].includes(key)
        ) {

            e.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    function(e) {

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


/* =====================================================
   TOUCHES TELEPHONE
===================================================== */

document.querySelectorAll(
    ".mobileButton"
).forEach(
    button => {

        const key =
            button.dataset.key;


        function press(e) {

            e.preventDefault();

            keys[key] = true;

        }


        function release(e) {

            e.preventDefault();

            keys[key] = false;

        }


        button.addEventListener(
            "touchstart",
            press,
            { passive: false }
        );

        button.addEventListener(
            "touchend",
            release,
            { passive: false }
        );

        button.addEventListener(
            "touchcancel",
            release,
            { passive: false }
        );


        button.addEventListener(
            "mousedown",
            press
        );

        button.addEventListener(
            "mouseup",
            release
        );

        button.addEventListener(
            "mouseleave",
            release
        );

    }
);


/* =====================================================
   ROBOTS
===================================================== */

function updateRobots() {

    if(!gameRunning)
        return;


    for(const robot of robots) {

        if(robot.horizontal) {

            robot.x +=
                robot.direction *
                robot.speed;


            if(
                robot.x < 20 ||
                robot.x >
                canvas.width -
                robot.size -
                20
            ) {

                robot.direction *= -1;

            }

        }

        else {

            robot.y +=
                robot.direction *
                robot.speed;


            if(
                robot.y < 20 ||
                robot.y >
                canvas.height -
                robot.size -
                20
            ) {

                robot.direction *= -1;

            }

        }


        const r = {

            x: robot.x,

            y: robot.y,

            w: robot.size,

            h: robot.size

        };


        if(
            isColliding(
                player,
                r
            )
        ) {

            lose(
                t("robot")
            );

            return;

        }

    }

}


/* =====================================================
   SORTIE
===================================================== */

function checkExit() {

    if(!gameRunning)
        return;


    const e = {

        x: exit.x,

        y: exit.y,

        w: exit.size,

        h: exit.size

    };


    if(
        isColliding(
            player,
            e
        )
    ) {

        levelComplete();

    }

}


/* =====================================================
   NIVEAU TERMINE
===================================================== */

function levelComplete() {

    /*
       Gain qui diminue avec les niveaux.
    */

    const gain =
        Math.max(
            1,
            5 -
            Math.floor(
                (level - 1) / 5
            )
        );


    scores[currentPlayer] += gain;


    if(level >= MAX_LEVEL) {

        winGame();

        return;

    }


    level++;


    loadLevel();

}


/* =====================================================
   DEFAITE
===================================================== */

function lose(reason) {

    if(!gameRunning)
        return;


    /*
       -2 au début.
       Puis la pénalité augmente
       progressivement.
    */

    const penalty =
        Math.min(
            6,
            2 +
            Math.floor(
                level / 5
            )
        );


    /*
       IMPORTANT :
       PAS de Math.max(0,...)
       Le score peut donc être négatif.
    */

    scores[currentPlayer] -=
        penalty;


    gameRunning = false;


    messageTitle.textContent =
        t("lose");


    messageText.textContent =
        reason +
        "\n" +
        names[currentPlayer] +
        " : -" +
        penalty +
        " points";


    messageButton.textContent =
        t("continue");


    message.style.display =
        "flex";


    updateInterface();

}


/* =====================================================
   BOUTON APRES DEFAITE
===================================================== */

messageButton.addEventListener(
    "click",
    function() {

        message.style.display =
            "none";


        /*
           SOLO :
           le même joueur recommence.

           DUO :
           on passe au joueur suivant.
        */

        if(mode === "duo") {

            currentPlayer =
                currentPlayer === 0
                    ? 1
                    : 0;

        }


        gameRunning = true;


        /*
           Le niveau reste le même.
        */

        loadLevel();

    }
);


/* =====================================================
   VICTOIRE
===================================================== */

function winGame() {

    gameRunning = false;


    messageTitle.textContent =
        t("win");


    if(mode === "duo") {

        messageText.textContent =
            names[currentPlayer] +
            " : " +
            scores[currentPlayer] +
            " points\n\n" +
            t("winText");

    }

    else {

        messageText.textContent =
            scores[0] +
            " points\n\n" +
            t("winText");

    }


    messageButton.textContent =
        t("continue");


    message.style.display =
        "flex";

}


/* =====================================================
   INTERFACE
===================================================== */

function updateInterface() {

    document.getElementById(
        "level"
    ).textContent =
        level;


    /*
       SCORES
       Ils peuvent être négatifs.
    */

    document.getElementById(
        "score0"
    ).textContent =
        scores[0];


    document.getElementById(
        "score1"
    ).textContent =
        scores[1];


    document.getElementById(
        "playerName0"
    ).textContent =
        names[0];


    document.getElementById(
        "playerName1"
    ).textContent =
        names[1];


    const turn0 =
        document.getElementById(
            "playerTurn0"
        );

    const turn1 =
        document.getElementById(
            "playerTurn1"
        );


    turn0.textContent =
        t("turn") +
        " " +
        names[0];


    turn1.textContent =
        t("turn") +
        " " +
        names[1];


    turn0.classList.remove(
        "active",
        "inactive"
    );

    turn1.classList.remove(
        "active",
        "inactive"
    );


    /*
       Le joueur actif = VERT.
       L'autre = ROUGE.
    */

    if(mode === "duo") {

        if(currentPlayer === 0) {

            turn0.classList.add(
                "active"
            );

            turn1.classList.add(
                "inactive"
            );

        }

        else {

            turn0.classList.add(
                "inactive"
            );

            turn1.classList.add(
                "active"
            );

        }

    }

    else {

        turn0.classList.add(
            "active"
        );

        turn1.classList.add(
            "inactive"
        );

    }


    playerSpeedText.textContent =
        player.speed;


    robotSpeedText.textContent =
        (
            .65 +
            level * .12
        ).toFixed(1);

}


/* =====================================================
   DESSIN
===================================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Fond
    */

    ctx.fillStyle =
        "#222";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Murs
    */

    ctx.fillStyle =
        "#eeeeee";


    for(const wall of walls) {

        ctx.fillRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

    }


    /*
       Sortie
    */

    ctx.fillStyle =
        "#00ff66";

    ctx.fillRect(
        exit.x,
        exit.y,
        exit.size,
        exit.size
    );


    /*
       Robots
    */

    for(const robot of robots) {

        ctx.fillStyle =
            "#ff3030";

        ctx.fillRect(
            robot.x,
            robot.y,
            robot.size,
            robot.size
        );


        /*
           Yeux
        */

        ctx.fillStyle =
            "white";


        const eye =
            Math.max(
                2,
                robot.size * .18
            );


        ctx.fillRect(
            robot.x +
            robot.size * .20,

            robot.y +
            robot.size * .20,

            eye,
            eye
        );


        ctx.fillRect(
            robot.x +
            robot.size * .62,

            robot.y +
            robot.size * .20,

            eye,
            eye
        );

    }


    /*
       Joueur bleu
    */

    ctx.fillStyle =
        "#3498ff";

    ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
    );

}


/* =====================================================
   CHARGER NIVEAU
===================================================== */

function loadLevel() {

    generateMaze(level);

    updateInterface();

}


/* =====================================================
   BOUCLE
===================================================== */

function gameLoop() {

    if(gameRunning) {

        movePlayer();

        updateRobots();

        checkExit();

    }

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   DEMARRAGE
===================================================== */

updateLanguage();

gameLoop();

</script>
