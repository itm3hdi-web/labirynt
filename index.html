<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labyrinthe Hardcore</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    text-align: center;
}

#top {
    height: 70px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 35px;
    background: #181818;
    border-bottom: 2px solid #333;
    font-size: 18px;
    font-weight: bold;
}

#gameArea {
    position: relative;
    width: 100vw;
    height: calc(100vh - 70px);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#game {
    position: relative;
    background: #222;
    border: 4px solid #555;
    box-shadow: 0 0 30px rgba(0,0,0,.7);
}

.tile {
    position: absolute;
    width: 40px;
    height: 40px;
}

.wall {
    background:
        linear-gradient(135deg, #3b3b3b 25%, #333 25%, #333 50%, #3b3b3b 50%, #3b3b3b 75%, #333 75%);
    background-size: 12px 12px;
    border: 1px solid #4b4b4b;
}

.floor {
    background: #151515;
    border: 1px solid #202020;
}

.player,
.enemy,
.chicken {
    position: absolute;
    width: 40px;
    height: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    transition: left .08s linear, top .08s linear;
}

.player {
    font-size: 29px;
    filter: drop-shadow(0 0 5px #00aaff);
}

.enemy {
    font-size: 30px;
    filter: drop-shadow(0 0 7px red);
    z-index: 9;
}

.chicken {
    font-size: 27px;
    z-index: 5;
    animation: chickenMove .7s infinite alternate;
}

@keyframes chickenMove {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
}

#message {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.82);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
}

#message h1 {
    font-size: 48px;
    margin: 0 0 15px;
}

#message p {
    font-size: 20px;
}

#restart {
    margin-top: 20px;
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    background: #e53935;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#restart:hover {
    background: #ff4b47;
}

#controls {
    position: fixed;
    bottom: 15px;
    left: 15px;
    z-index: 200;
    display: grid;
    grid-template-columns: 55px 55px 55px;
    grid-template-rows: 55px 55px 55px;
    gap: 5px;
}

.control {
    border: 2px solid #555;
    background: rgba(35,35,35,.9);
    color: white;
    border-radius: 10px;
    font-size: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: manipulation;
}

.control:active {
    background: #555;
    transform: scale(.94);
}

.up {
    grid-column: 2;
    grid-row: 1;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.down {
    grid-column: 2;
    grid-row: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}

@media (max-width: 700px) {
    #top {
        height: 55px;
        font-size: 14px;
        gap: 15px;
    }

    #gameArea {
        height: calc(100vh - 55px);
    }

    #controls {
        transform: scale(.85);
        transform-origin: bottom left;
    }
}
</style>
</head>

<body>

<div id="top">
    <div>🐔 Poules : <span id="score">0</span>/<span id="total">0</span></div>
    <div>👹 Distance : <span id="distance">-</span></div>
</div>

<div id="gameArea">
    <div id="game"></div>

    <div id="message">
        <h1 id="messageTitle">GAME OVER</h1>
        <p id="messageText"></p>
        <button id="restart">REJOUER</button>
    </div>
</div>

<div id="controls">
    <button class="control up" data-dir="up">▲</button>
    <button class="control left" data-dir="left">◀</button>
    <button class="control down" data-dir="down">▼</button>
    <button class="control right" data-dir="right">▶</button>
</div>

<script>
/* =========================================================
   LABYRINTHE HARDCORE
   ========================================================= */

/*
    1 = mur
    0 = sol
    P = départ joueur
    E = départ ennemi
*/

const map = [
    "111111111111111111111111",
    "100000000100000000000001",
    "101111110101111111111101",
    "100000010100000000000001",
    "101111010111111111110101",
    "101001010000000000010101",
    "101001011111111111010101",
    "100001000000000001010001",
    "111101111111111101011111",
    "100000000000000101000001",
    "101111111111110101111101",
    "101000000000010100000101",
    "101011111111010111110101",
    "101010000001010000010101",
    "101010111101011111010101",
    "101000100001000001000101",
    "101111101111111101111101",
    "100000000000000100000001",
    "111111111111111111111111"
];

const TILE = 40;

const ROWS = map.length;
const COLS = map[0].length;

const game = document.getElementById("game");
const scoreElement = document.getElementById("score");
const totalElement = document.getElementById("total");
const distanceElement = document.getElementById("distance");
const message = document.getElementById("message");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");
const restartButton = document.getElementById("restart");

game.style.width = COLS * TILE + "px";
game.style.height = ROWS * TILE + "px";

let player = {
    x: 1,
    y: 1
};

let enemy = {
    x: 22,
    y: 17
};

let chickens = [];

let score = 0;
let gameRunning = true;
let enemyTimer = null;
let enemySpeed = 350;

/* =========================================================
   CRÉATION DE LA MAP
   ========================================================= */

function createMap() {

    game.innerHTML = "";

    for (let y = 0; y < ROWS; y++) {

        for (let x = 0; x < COLS; x++) {

            const tile = document.createElement("div");

            tile.classList.add("tile");

            tile.style.left = (x * TILE) + "px";
            tile.style.top = (y * TILE) + "px";

            if (map[y][x] === "1") {
                tile.classList.add("wall");
            } else {
                tile.classList.add("floor");
            }

            game.appendChild(tile);
        }
    }
}

/* =========================================================
   CASE LIBRE
   ========================================================= */

function isWalkable(x, y) {

    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) {
        return false;
    }

    return map[y][x] === "0";
}

/* =========================================================
   ÉLÉMENTS
   ========================================================= */

let playerElement;
let enemyElement;

function createPlayer() {

    playerElement = document.createElement("div");

    playerElement.className = "player";
    playerElement.textContent = "🧑";

    game.appendChild(playerElement);

    updatePlayerPosition();
}

function createEnemy() {

    enemyElement = document.createElement("div");

    enemyElement.className = "enemy";
    enemyElement.textContent = "👹";

    game.appendChild(enemyElement);

    updateEnemyPosition();
}

function updatePlayerPosition() {

    playerElement.style.left = player.x * TILE + "px";
    playerElement.style.top = player.y * TILE + "px";
}

function updateEnemyPosition() {

    enemyElement.style.left = enemy.x * TILE + "px";
    enemyElement.style.top = enemy.y * TILE + "px";
}

/* =========================================================
   POULLES
   ========================================================= */

function generateChickens() {

    chickens.forEach(chicken => {
        if (chicken.element) {
            chicken.element.remove();
        }
    });

    chickens = [];

    const possiblePositions = [];

    for (let y = 1; y < ROWS - 1; y++) {

        for (let x = 1; x < COLS - 1; x++) {

            if (!isWalkable(x, y)) continue;

            if (
                x === player.x &&
                y === player.y
            ) continue;

            if (
                x === enemy.x &&
                y === enemy.y
            ) continue;

            possiblePositions.push({
                x,
                y
            });
        }
    }

    /*
        Mélange des cases.
        Cela permet de disperser les poules
        dans toute la map.
    */

    possiblePositions.sort(() => Math.random() - 0.5);

    const numberOfChickens = 18;

    for (
        let i = 0;
        i < numberOfChickens && i < possiblePositions.length;
        i++
    ) {

        const position = possiblePositions[i];

        const element = document.createElement("div");

        element.className = "chicken";
        element.textContent = "🐔";

        element.style.left = position.x * TILE + "px";
        element.style.top = position.y * TILE + "px";

        game.appendChild(element);

        chickens.push({
            x: position.x,
            y: position.y,
            collected: false,
            element
        });
    }

    totalElement.textContent = chickens.length;
}

/* =========================================================
   DÉPLACEMENT DU JOUEUR
   ========================================================= */

function movePlayer(dx, dy) {

    if (!gameRunning) return;

    const newX = player.x + dx;
    const newY = player.y + dy;

    if (!isWalkable(newX, newY)) {
        return;
    }

    player.x = newX;
    player.y = newY;

    updatePlayerPosition();

    checkChicken();
    checkEnemyCollision();
    updateDistance();

    /*
        Plus le joueur avance,
        plus le méchant accélère légèrement.
    */

    updateEnemySpeed();
}

/* =========================================================
   RAMASSER LES POULLES
   ========================================================= */

function checkChicken() {

    chickens.forEach(chicken => {

        if (chicken.collected) return;

        if (
            chicken.x === player.x &&
            chicken.y === player.y
        ) {

            chicken.collected = true;

            chicken.element.remove();

            score++;

            scoreElement.textContent = score;

            if (score === chickens.length) {
                winGame();
            }
        }
    });
}

/* =========================================================
   COLLISION AVEC LE MÉCHANT
   ========================================================= */

function checkEnemyCollision() {

    if (
        player.x === enemy.x &&
        player.y === enemy.y
    ) {

        loseGame();
    }
}

/* =========================================================
   PATHFINDING
   ========================================================= */

/*
    Le méchant utilise BFS :
    Breadth First Search.

    Il cherche le chemin le plus court
    entre lui et le joueur sans traverser
    les murs.
*/

function findPath(start, target) {

    const queue = [];

    const visited = new Set();

    const previous = new Map();

    const startKey = `${start.x},${start.y}`;

    queue.push(start);

    visited.add(startKey);

    const directions = [
        { x: 1, y: 0 },
        { x: -1, y: 0 },
        { x: 0, y: 1 },
        { x: 0, y: -1 }
    ];

    while (queue.length > 0) {

        const current = queue.shift();

        if (
            current.x === target.x &&
            current.y === target.y
        ) {

            break;
        }

        for (const direction of directions) {

            const next = {
                x: current.x + direction.x,
                y: current.y + direction.y
            };

            if (!isWalkable(next.x, next.y)) {
                continue;
            }

            const key = `${next.x},${next.y}`;

            if (visited.has(key)) {
                continue;
            }

            visited.add(key);

            previous.set(
                key,
                `${current.x},${current.y}`
            );

            queue.push(next);
        }
    }

    const targetKey = `${target.x},${target.y}`;

    if (!visited.has(targetKey)) {
        return [];
    }

    const path = [];

    let currentKey = targetKey;

    while (currentKey !== startKey) {

        const [x, y] = currentKey.split(",").map(Number);

        path.unshift({
            x,
            y
        });

        currentKey = previous.get(currentKey);

        if (!currentKey) {
            return [];
        }
    }

    return path;
}

/* =========================================================
   MOUVEMENT DU MÉCHANT
   ========================================================= */

function enemyMove() {

    if (!gameRunning) return;

    const path = findPath(
        enemy,
        player
    );

    if (path.length > 0) {

        const next = path[0];

        enemy.x = next.x;
        enemy.y = next.y;

        updateEnemyPosition();

        checkEnemyCollision();
        updateDistance();
    }
}

/* =========================================================
   DISTANCE
   ========================================================= */

function calculateDistance() {

    const path = findPath(
        enemy,
        player
    );

    return path.length;
}

function updateDistance() {

    const distance = calculateDistance();

    if (distance <= 0) {
        distanceElement.textContent = "DANGER !";
    } else {
        distanceElement.textContent = distance + " cases";
    }
}

/* =========================================================
   VITESSE DU MÉCHANT
   ========================================================= */

function updateEnemySpeed() {

    /*
        Le méchant devient progressivement
        plus rapide.
    */

    const newSpeed = Math.max(
        180,
        350 - score * 8
    );

    if (newSpeed !== enemySpeed) {

        enemySpeed = newSpeed;

        clearInterval(enemyTimer);

        enemyTimer = setInterval(
            enemyMove,
            enemySpeed
        );
    }
}

/* =========================================================
   GAME OVER
   ========================================================= */

function loseGame() {

    if (!gameRunning) return;

    gameRunning = false;

    clearInterval(enemyTimer);

    message.style.display = "flex";

    messageTitle.textContent = "💀 GAME OVER";

    messageText.textContent =
        "Le méchant t'a attrapé ! Tu as récupéré " +
        score +
        " poule(s).";
}

/* =========================================================
   VICTOIRE
   ========================================================= */

function winGame() {

    if (!gameRunning) return;

    gameRunning = false;

    clearInterval(enemyTimer);

    message.style.display = "flex";

    messageTitle.textContent = "🏆 VICTOIRE !";

    messageText.textContent =
        "Tu as récupéré toutes les poules !";
}

/* =========================================================
   CLAVIER
   ========================================================= */

document.addEventListener("keydown", function(event) {

    if (!gameRunning) return;

    switch (event.key.toLowerCase()) {

        case "arrowup":
        case "z":
        case "w":
            event.preventDefault();
            movePlayer(0, -1);
            break;

        case "arrowdown":
        case "s":
            event.preventDefault();
            movePlayer(0, 1);
            break;

        case "arrowleft":
        case "q":
        case "a":
            event.preventDefault();
            movePlayer(-1, 0);
            break;

        case "arrowright":
        case "d":
            event.preventDefault();
            movePlayer(1, 0);
            break;
    }
});

/* =========================================================
   BOUTONS TACTILES
   ========================================================= */

document.querySelectorAll(".control").forEach(button => {

    const direction = button.dataset.dir;

    function action(event) {

        event.preventDefault();

        if (direction === "up") {
            movePlayer(0, -1);
        }

        if (direction === "down") {
            movePlayer(0, 1);
        }

        if (direction === "left") {
            movePlayer(-1, 0);
        }

        if (direction === "right") {
            movePlayer(1, 0);
        }
    }

    button.addEventListener("touchstart", action, {
        passive: false
    });

    button.addEventListener("mousedown", action);
});

/* =========================================================
   RESTART
   ========================================================= */

restartButton.addEventListener("click", restartGame);

function restartGame() {

    clearInterval(enemyTimer);

    player = {
        x: 1,
        y: 1
    };

    enemy = {
        x: 22,
        y: 17
    };

    score = 0;

    enemySpeed = 350;

    gameRunning = true;

    scoreElement.textContent = "0";

    message.style.display = "none";

    createMap();
    createPlayer();
    createEnemy();
    generateChickens();

    updateDistance();

    enemyTimer = setInterval(
        enemyMove,
        enemySpeed
    );
}

/* =========================================================
   LANCEMENT DU JEU
   ========================================================= */

createMap();
createPlayer();
createEnemy();
generateChickens();

updateDistance();

enemyTimer = setInterval(
    enemyMove,
    enemySpeed
);

</script>

</body>
</html>
