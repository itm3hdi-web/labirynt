<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labyrinthe</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    canvas {
        background: #222;
        border: 3px solid white;
    }
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const tile = 40;

const maze = [
    "####################",
    "#P       #         #",
    "# ###### # ####### #",
    "#      # #       # #",
    "###### # ####### # #",
    "#      #       #   #",
    "# ########### #####",
    "#           #     #",
    "# ######### # ### #",
    "#       #   # #   #",
    "# ##### # ### # ###",
    "#     # #     #   #",
    "##### # ####### # #",
    "#     #         # #",
    "# ############### #",
    "#                 #",
    "####################"
];

canvas.width = maze[0].length * tile;
canvas.height = maze.length * tile;

let player = {
    x: 0,
    y: 0,
    speed: 3
};

let enemy = {
    x: 0,
    y: 0,
    speed: 1.4
};

for (let y = 0; y < maze.length; y++) {
    for (let x = 0; x < maze[y].length; x++) {

        if (maze[y][x] === "P") {
            player.x = x * tile + tile / 2;
            player.y = y * tile + tile / 2;
        }
    }
}

// Position de départ de la tête
enemy.x = 18 * tile + tile / 2;
enemy.y = 15 * tile + tile / 2;

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

function isWall(x, y) {

    const col = Math.floor(x / tile);
    const row = Math.floor(y / tile);

    if (
        row < 0 ||
        row >= maze.length ||
        col < 0 ||
        col >= maze[row].length
    ) {
        return true;
    }

    return maze[row][col] === "#";
}

function canMove(x, y) {

    const size = 12;

    return (
        !isWall(x - size, y - size) &&
        !isWall(x + size, y - size) &&
        !isWall(x - size, y + size) &&
        !isWall(x + size, y + size)
    );
}

function movePlayer() {

    let dx = 0;
    let dy = 0;

    if (keys["arrowup"] || keys["z"] || keys["w"]) dy -= player.speed;
    if (keys["arrowdown"] || keys["s"]) dy += player.speed;
    if (keys["arrowleft"] || keys["q"] || keys["a"]) dx -= player.speed;
    if (keys["arrowright"] || keys["d"]) dx += player.speed;

    if (canMove(player.x + dx, player.y)) {
        player.x += dx;
    }

    if (canMove(player.x, player.y + dy)) {
        player.y += dy;
    }
}

function moveEnemy() {

    let dx = player.x - enemy.x;
    let dy = player.y - enemy.y;

    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance > 1) {
        dx /= distance;
        dy /= distance;
    }

    let nextX = enemy.x + dx * enemy.speed;
    let nextY = enemy.y + dy * enemy.speed;

    if (canMove(nextX, enemy.y)) {
        enemy.x = nextX;
    }

    if (canMove(enemy.x, nextY)) {
        enemy.y = nextY;
    }
}

function drawMaze() {

    for (let y = 0; y < maze.length; y++) {

        for (let x = 0; x < maze[y].length; x++) {

            if (maze[y][x] === "#") {

                ctx.fillStyle = "#555";
                ctx.fillRect(
                    x * tile,
                    y * tile,
                    tile,
                    tile
                );

            } else {

                ctx.fillStyle = "#222";
                ctx.fillRect(
                    x * tile,
                    y * tile,
                    tile,
                    tile
                );
            }
        }
    }
}

function drawPlayer() {

    ctx.save();

    ctx.translate(player.x, player.y);

    // Corps
    ctx.fillStyle = "#3498db";
    ctx.beginPath();
    ctx.arc(0, 8, 9, 0, Math.PI * 2);
    ctx.fill();

    // Tête
    ctx.fillStyle = "#f1c27d";
    ctx.beginPath();
    ctx.arc(0, -7, 8, 0, Math.PI * 2);
    ctx.fill();

    // Jambes
    ctx.strokeStyle = "#3498db";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(-4, 15);
    ctx.lineTo(-8, 23);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(4, 15);
    ctx.lineTo(8, 23);
    ctx.stroke();

    ctx.restore();
}

function drawEnemy() {

    ctx.save();

    ctx.translate(enemy.x, enemy.y);

    // Tête
    ctx.fillStyle = "#e74c3c";

    ctx.beginPath();
    ctx.arc(0, 0, 15, 0, Math.PI * 2);
    ctx.fill();

    // Yeux
    ctx.fillStyle = "white";

    ctx.beginPath();
    ctx.arc(-6, -4, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(6, -4, 4, 0, Math.PI * 2);
    ctx.fill();

    // Pupilles
    ctx.fillStyle = "black";

    ctx.beginPath();
    ctx.arc(-6, -4, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(6, -4, 2, 0, Math.PI * 2);
    ctx.fill();

    // Bouche
    ctx.strokeStyle = "black";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.arc(0, 3, 7, 0, Math.PI);
    ctx.stroke();

    ctx.restore();
}

function checkCollision() {

    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;

    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < 25) {
        alert("La tête t'a attrapé !");
        location.reload();
    }
}

function gameLoop() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    movePlayer();
    moveEnemy();

    drawMaze();
    drawPlayer();
    drawEnemy();

    checkCollision();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
