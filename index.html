<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Escape</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#top {
    height: 60px;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 50px;
    font-size: 22px;
    font-weight: bold;
}

#gameContainer {
    width: 100vw;
    height: calc(100vh - 60px);
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    background: #151515;
}
</style>
</head>

<body>

<div id="top">
    <div>⏱️ <span id="timer">00:00</span></div>
    <div>👹 Têtes : <span id="enemyCount">1</span></div>
</div>

<div id="gameContainer">
    <canvas id="game"></canvas>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const tile = 45;

/*
    # = mur
    . = chemin
    P = joueur
*/

const maze = [
"############################################################",
"#P................................#.........................#",
"#.###############################.#.#######################.#",
"#.#.............................#.#.#.....................#.#",
"#.#.###########################.#.#.#.###################.#.#",
"#.#.#.........................#.#.#.#.#.................#.#.#",
"#.#.#.#######################.#.#.#.#.#.###############.#.#.#",
"#.#.#.#.....................#.#.#.#.#.#.#.............#.#.#.#",
"#.#.#.#.###################.#.#.#.#.#.#.#.###########.#.#.#.#",
"#.#.#.#.#.................#.#.#.#.#.#.#.#.#.........#.#.#.#.#",
"#.#.#.#.#.###############.#.#.#.#.#.#.#.#.#.#######.#.#.#.#.#",
"#.#.#.#.#.#.............#.#.#.#.#.#.#.#.#.#.#.....#.#.#.#.#.#",
"#.#.#.#.#.#.###########.#.#.#.#.#.#.#.#.#.#.#.###.#.#.#.#.#.#",
"#.#.#.#.#.#.#.........#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#######.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.....#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.###.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.#...#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.#.###.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.#.....#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#######.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.........#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#############.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#................#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#################.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#...................#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#####################.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.......................#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#########################.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#...........................#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#############################.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.............................#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#############################.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#...........................#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#########################.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.......................#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#####################.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#...................#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#################.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#...............#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#############.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#...........#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#########.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.......#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#####.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#...#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#.#",
"#...........................................................#",
"############################################################"
];

canvas.width = maze[0].length * tile;
canvas.height = maze.length * tile;


/* =========================
   JOUEUR
========================= */

let player = {
    x: 0,
    y: 0,
    speed: 4,
    walk: 0
};

for (let y = 0; y < maze.length; y++) {
    for (let x = 0; x < maze[y].length; x++) {

        if (maze[y][x] === "P") {

            player.x = x * tile + tile / 2;
            player.y = y * tile + tile / 2;

        }
    }
}


/* =========================
   TOUCHES
========================= */

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});


/* =========================
   COLLISION MURS
========================= */

function isWall(x, y) {

    const col = Math.floor(x / tile);
    const row = Math.floor(y / tile);

    if (
        row < 0 ||
        row >= maze.length ||
        col < 0 ||
        col >= maze[row].length
    ) {
        return true;
    }

    return maze[row][col] === "#";
}


function canMove(x, y) {

    const size = 13;

    return (
        !isWall(x - size, y - size) &&
        !isWall(x + size, y - size) &&
        !isWall(x - size, y + size) &&
        !isWall(x + size, y + size)
    );
}


/* =========================
   DEPLACEMENT JOUEUR
========================= */

function movePlayer() {

    let dx = 0;
    let dy = 0;

    if (keys["arrowup"] || keys["z"] || keys["w"]) {
        dy -= player.speed;
    }

    if (keys["arrowdown"] || keys["s"]) {
        dy += player.speed;
    }

    if (keys["arrowleft"] || keys["q"] || keys["a"]) {
        dx -= player.speed;
    }

    if (keys["arrowright"] || keys["d"]) {
        dx += player.speed;
    }


    if (dx !== 0 || dy !== 0) {

        player.walk += 0.25;

    }


    if (canMove(player.x + dx, player.y)) {
        player.x += dx;
    }

    if (canMove(player.x, player.y + dy)) {
        player.y += dy;
    }
}


/* =========================
   ENNEMIS
========================= */

let enemies = [];

function createEnemy() {

    const positions = [
        [58, 1],
        [56, 60],
        [3, 60],
        [50, 30],
        [30, 50],
        [40, 10],
        [20, 30],
        [55, 45]
    ];

    const index = enemies.length % positions.length;

    enemies.push({

        x: positions[index][0] * tile + tile / 2,
        y: positions[index][1] * tile + tile / 2,

        speed: 1.4 + enemies.length * 0.05

    });
}


createEnemy();


/* =========================
   DEPLACEMENT DES TETES
========================= */

function moveEnemy(enemy) {

    let dx = player.x - enemy.x;
    let dy = player.y - enemy.y;

    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance > 0) {

        dx /= distance;
        dy /= distance;

    }


    const nextX = enemy.x + dx * enemy.speed;
    const nextY = enemy.y + dy * enemy.speed;


    if (canMove(nextX, enemy.y)) {
        enemy.x = nextX;
    }

    if (canMove(enemy.x, nextY)) {
        enemy.y = nextY;
    }
}


/* =========================
   DESSIN DU LABYRINTHE
========================= */

function drawMaze() {

    for (let y = 0; y < maze.length; y++) {

        for (let x = 0; x < maze[y].length; x++) {

            if (maze[y][x] === "#") {

                ctx.fillStyle = "#174b72";

                ctx.fillRect(
                    x * tile,
                    y * tile,
                    tile,
                    tile
                );

            } else {

                ctx.fillStyle = "#080808";

                ctx.fillRect(
                    x * tile,
                    y * tile,
                    tile,
                    tile
                );

            }
        }
    }
}


/* =========================
   PERSONNAGE BLEU
========================= */

function drawPlayer() {

    ctx.save();

    ctx.translate(player.x, player.y);

    /*
       Corps bleu
    */

    ctx.fillStyle = "#008cff";

    ctx.beginPath();

    ctx.arc(
        0,
        -7,
        9,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Corps
    */

    ctx.fillRect(
        -8,
        2,
        16,
        15
    );


    /*
       Bras
    */

    ctx.strokeStyle = "#008cff";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";

    const arm = Math.sin(player.walk) * 5;

    ctx.beginPath();
    ctx.moveTo(-7, 5);
    ctx.lineTo(-12, 12 + arm);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(7, 5);
    ctx.lineTo(12, 12 - arm);
    ctx.stroke();


    /*
       Jambes qui marchent
    */

    const leg = Math.sin(player.walk) * 7;

    ctx.beginPath();

    ctx.moveTo(-4, 16);
    ctx.lineTo(-7, 27 + leg);

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(4, 16);
    ctx.lineTo(7, 27 - leg);

    ctx.stroke();


    ctx.restore();
}


/* =========================
   TETE MECONTENTE
========================= */

function drawEnemy(enemy) {

    ctx.save();

    ctx.translate(enemy.x, enemy.y);


    /*
       Tête
    */

    ctx.fillStyle = "#d92828";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        18,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Yeux
    */

    ctx.fillStyle = "white";

    ctx.beginPath();
    ctx.arc(-7, -4, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(7, -4, 5, 0, Math.PI * 2);
    ctx.fill();


    /*
       Pupilles
    */

    ctx.fillStyle = "black";

    ctx.beginPath();
    ctx.arc(-7, -3, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(7, -3, 2.5, 0, Math.PI * 2);
    ctx.fill();


    /*
       Sourcils méchants
    */

    ctx.strokeStyle = "black";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(-13, -11);
    ctx.lineTo(-3, -7);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(13, -11);
    ctx.lineTo(3, -7);
    ctx.stroke();


    /*
       Bouche
    */

    ctx.beginPath();

    ctx.moveTo(-8, 8);
    ctx.quadraticCurveTo(
        0,
        1,
        8,
        8
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================
   COLLISION TETES / JOUEUR
========================= */

function checkCollision() {

    for (const enemy of enemies) {

        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;

        const distance = Math.sqrt(
            dx * dx + dy * dy
        );

        if (distance < 28) {

            alert("TU AS ÉTÉ ATTRAPÉ !");

            location.reload();

        }
    }
}


/* =========================
   MINUTEUR
========================= */

const startTime = Date.now();

let lastEnemyNumber = 1;


function updateTimer() {

    const elapsed = Math.floor(
        (Date.now() - startTime) / 1000
    );


    const minutes = Math.floor(
        elapsed / 60
    );

    const seconds = elapsed % 60;


    document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");


    /*
       Toutes les 30 secondes :
       +1 tête
    */

    const wantedEnemies =
        Math.floor(elapsed / 30) + 1;


    if (wantedEnemies > lastEnemyNumber) {

        while (enemies.length < wantedEnemies) {

            createEnemy();

        }

        lastEnemyNumber = wantedEnemies;

        document.getElementById("enemyCount").textContent =
            enemies.length;
    }
}


/* =========================
   BOUCLE DU JEU
========================= */

function gameLoop() {

    movePlayer();


    for (const enemy of enemies) {

        moveEnemy(enemy);

    }


    drawMaze();

    drawPlayer();


    for (const enemy of enemies) {

        drawEnemy(enemy);

    }


    checkCollision();

    updateTimer();


    requestAnimationFrame(gameLoop);
}


gameLoop();

</script>

</body>
</html>
