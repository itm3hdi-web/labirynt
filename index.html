<style>

* {
    box-sizing: border-box;
}

html,
body {

    min-height: 100%;

    color: white;

button,

/* =====================================================
   ACCUEIL
===================================================== */

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    overflow: auto;

    background:

        radial-gradient(
            circle at 20% 20%,
            rgba(52,152,255,.20),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(0,255,102,.13),
            transparent 28%
        ),

        linear-gradient(
            135deg,
            #050816,
            #10182b 55%,
            #050816
        );
}


#menuCard {

    width: min(520px, 94vw);

    padding: 34px;

    border: 1px solid rgba(255,255,255,.16);

    border-radius: 24px;

    background: rgba(10,14,28,.90);

    box-shadow:
        0 25px 80px rgba(0,0,0,.55);

    backdrop-filter: blur(12px);

    text-align: center;
}


.logo {

    font-size: 50px;

    margin-bottom: 6px;
}


#menuCard h1 {

    margin: 0;

    font-size: 38px;
}


.subtitle {

    color: #b9c3d8;

    margin: 10px 0 25px;

    line-height: 1.5;
}


.formRow {

    text-align: left;

    margin: 14px 0;
}


.formRow label {

    display: block;

    margin-bottom: 7px;

    color: #dbe4f5;

    font-weight: bold;
}


input,
select {

    width: 100%;

    padding: 13px 14px;

    border-radius: 12px;

    border: 1px solid #3a4661;

    background: #161e31;

    color: white;

    outline: none;
}


input:focus,
select:focus {

    border-color: #3498ff;

    box-shadow:
        0 0 0 3px rgba(52,152,255,.16);
}


/* =====================================================
   SOLO / DUO
===================================================== */

.modeRow {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin: 15px 0;
}


.modeBtn {

    padding: 14px;

    border: 1px solid #3a4661;

    border-radius: 12px;

    background: #141b2c;

    color: white;

    font-weight: bold;

}


.modeBtn.active {

    border-color: #3498ff;
}


#player2Row {

    display: none;
}


#startBtn {

    padding: 15px;

    border: 0;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #3498ff,
            #1474dc
        );

    color: white;

    font-weight: bold;

    font-size: 20px;

    margin-top: 12px;

    cursor: pointer;
}


#startBtn:active {

    transform: scale(.98);
}


#error {

    min-height: 20px;

    color: #ff7777;

    margin-top: 10px;
}


/* =====================================================
   JEU
===================================================== */

#gameUI {

    display: none;
}


#top {

    min-height: 70px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 28px;

    background: #121722;

    font-size: 20px;

    flex-wrap: wrap;

    padding: 10px 14px;
}


#top span {

    font-weight: bold;
}


#turnInfo {

    color: #7ec1ff;

    font-weight: bold;
}


canvas {

    display: block;

    margin: 10px auto;

    border: 4px solid white;

    background: #222;

    max-width: 95vw;

    height: auto;
}


/* =====================================================
   TOUCHES TELEPHONE
===================================================== */

#mobileControls {

    display: none;

    width: 220px;

    margin: 10px auto 25px;

    user-select: none;

    touch-action: none;
}


.mobileRow {

    display: flex;

    justify-content: center;

    gap: 8px;
}


.mobileButton {

    width: 65px;

    height: 65px;

    padding: 0;

    border: 2px solid white;

    border-radius: 12px;

    background: #333;

    color: white;

    font-size: 30px;

    user-select: none;

    touch-action: none;

    -webkit-tap-highlight-color: transparent;

.mobileButton:active {

    background: #666;

/* =====================================================
   MESSAGE
===================================================== */

/* =====================================================
   GÉNÉRATEUR ALÉATOIRE
===================================================== */

function randomGenerator(seed) {

    let value =
        seed;


    return function() {

        value =
            (
                value * 9301
                + 49297
            )
            % 233280;


        return value /
            233280;

    };

}



/* =====================================================
   GÉNÉRATION DU LABYRINTHE
===================================================== */

function generateMaze(levelNumber) {

    walls = [];


    /*
       DIFFICULTÉ PROGRESSIVE

       Niveau 1 :
       très facile

       Niveau 23 :
       très difficile

       La difficulté augmente
       progressivement.
    */

    const difficulty =
        Math.min(
            1,
            Math.max(
                0,
                (levelNumber - 1) / 22
            )
        );


    const cols =
        Math.round(
            9 +
            difficulty * 20
        );


    const rows =
        Math.round(
            6 +
            difficulty * 14
        );


    const cellW =
        canvas.width /
        cols;


    const cellH =
        canvas.height /
        rows;


    const random =
        randomGenerator(
            levelNumber *
            98431 +
            17
        );


    let cells = [];


    for(
        let y = 0;
        y < rows;
        y++
    ) {

        cells[y] = [];


        for(
            let x = 0;
            x < cols;
            x++
        ) {

            cells[y][x] = {

                visited: false,

                walls: {

                    top: true,

                    right: true,

                    bottom: true,

                    left: true

                }

            };

        }

    }



    /* =================================================
       CRÉATION DU LABYRINTHE
    ================================================= */

    let stack = [];


    cells[0][0].visited =
        true;


    stack.push({

        x: 0,

        y: 0

    });



    while(
        stack.length > 0
    ) {

        const current =
            stack[
                stack.length - 1
            ];


        let neighbours = [];


        /* HAUT */

        if(

            current.y > 0

            &&

            !cells[
                current.y - 1
            ][
                current.x
            ].visited

        ) {

            neighbours.push({

                x:
                    current.x,

                y:
                    current.y - 1,

                direction:
                    "top"

            });

        }



        /* DROITE */

        if(

            current.x <
            cols - 1

            &&

            !cells[
                current.y
            ][
                current.x + 1
            ].visited

        ) {

            neighbours.push({

                x:
                    current.x + 1,

                y:
                    current.y,

                direction:
                    "right"

            });

        }



        /* BAS */

        if(

            current.y <
            rows - 1

            &&

            !cells[
                current.y + 1
            ][
                current.x
            ].visited

        ) {

            neighbours.push({

                x:
                    current.x,

                y:
                    current.y + 1,

                direction:
                    "bottom"

            });

        }



        /* GAUCHE */

        if(

            current.x > 0

            &&

            !cells[
                current.y
            ][
                current.x - 1
            ].visited

        ) {

            neighbours.push({

                x:
                    current.x - 1,

                y:
                    current.y,

                direction:
                    "left"

            });

        }



        if(
            neighbours.length > 0
        ) {

            const next =
                neighbours[
                    Math.floor(
                        random() *
                        neighbours.length
                    )
                ];


            const cell =
                cells[
                    current.y
                ][
                    current.x
                ];


            const nextCell =
                cells[
                    next.y
                ][
                    next.x
                ];



            if(
                next.direction ===
                "top"
            ) {

                cell.walls.top =
                    false;

                nextCell.walls.bottom =
                    false;

            }


            if(
                next.direction ===
                "right"
            ) {

                cell.walls.right =
                    false;

                nextCell.walls.left =
                    false;

            }


            if(
                next.direction ===
                "bottom"
            ) {

                cell.walls.bottom =
                    false;

                nextCell.walls.top =
                    false;

            }


            if(
                next.direction ===
                "left"
            ) {

                cell.walls.left =
                    false;

                nextCell.walls.right =
                    false;

            }


            nextCell.visited =
                true;


            stack.push({

                x:
                    next.x,

                y:
                    next.y

            });

        }


        else {

            stack.pop();

        }

    }



    /* =================================================
       MURS
    ================================================= */

    const wallThickness =
        Math.max(
            3,
            7 -
            levelNumber *
            0.12
        );



    for(
        let y = 0;
        y < rows;
        y++
    ) {

        for(
            let x = 0;
            x < cols;
            x++
        ) {

            const cell =
                cells[y][x];


            const px =
                x * cellW;


            const py =
                y * cellH;



            if(
                cell.walls.top
            ) {

                walls.push({

                    x: px,

                    y: py,

                    w:
                        cellW +
                        wallThickness,

                    h:
                        wallThickness

                });

            }



            if(
                cell.walls.left
            ) {

                walls.push({

                    x: px,

                    y: py,

                    w:
                        wallThickness,

                    h:
                        cellH +
                        wallThickness

                });

            }



            if(

                x === cols - 1

                &&

                cell.walls.right

            ) {

                walls.push({

                    x:
                        px + cellW,

                    y: py,

                    w:
                        wallThickness,

                    h:
                        cellH

                });

            }



            if(

                y === rows - 1

                &&

                cell.walls.bottom

            ) {

                walls.push({

                    x: px,

                    y:
                        py + cellH,

                    w:
                        cellW,

                    h:
                        wallThickness

                });

            }

        }

    }



    /* =================================================
       DÉPART
    ================================================= */

    player.x =
        cellW * 0.25;


    player.y =
        cellH * 0.25;



    /* =================================================
       SORTIE
    ================================================= */

    exit.x =
        (cols - 1) *
        cellW +
        cellW * 0.35;


    exit.y =
        (rows - 1) *
        cellH +
        cellH * 0.35;


    exit.size =
        Math.max(

            12,

            Math.min(
                cellW,
                cellH
            ) * 0.30

        );



    /* =================================================
       ROBOTS
    ================================================= */

    robots = [];


    /*
       Très peu de robots au début.

       Ils deviennent progressivement
       plus nombreux.
    */

    const robotCount =
        Math.min(

            Math.floor(
                (levelNumber - 1) / 3
            ) + 1,

            8

        );


    const robotSpeed =
        0.65 +
        levelNumber *
        0.12;



    for(
        let i = 0;
        i < robotCount;
        i++
    ) {

        let rx =
            cellW *
            (
                2 +
                Math.floor(
                    random() *
                    Math.max(
                        1,
                        cols - 4
                    )
                )
            );


        let ry =
            cellH *
            (
                1 +
                Math.floor(
                    random() *
                    Math.max(
                        1,
                        rows - 3
                    )
                )
            );


        const horizontal =
            random() > 0.5;



        robots.push({

            x: rx,

            y: ry,

            size:
                Math.max(
                    10,
                    Math.min(
                        cellW,
                        cellH
                    ) * 0.32
                ),

            speed:
                robotSpeed,

            direction:
                random() > 0.5
                ? 1
                : -1,

            horizontal:
                horizontal

        });

    }

}



/* =====================================================
   COLLISION
===================================================== */

function isColliding(a, b) {

    return (

        a.x <
        b.x + b.w

        &&

        a.x + a.size >
        b.x

        &&

        a.y <
        b.y + b.h

        &&

        a.y + a.size >
        b.y

    );

}



/* =====================================================
   CLAVIER PC
===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        /*
           IMPORTANT :

           Si on est en train d'écrire
           un pseudo, le clavier fonctionne
           normalement.

           Donc A, Q, W, Z, etc.
           peuvent être écrits.
        */

        const tag =
            document.activeElement
            ?.tagName;


        if(
            tag === "INPUT"
            ||
            tag === "SELECT"
        ) {

            return;

        }


        const key =
            e.key.toLowerCase();


        keys[key] =
            true;


        if(

            key === "arrowup"
            ||
            key === "arrowdown"
            ||
            key === "arrowleft"
            ||
            key === "arrowright"
            ||
            key === " "

        ) {

            e.preventDefault();

        }

    }
);



document.addEventListener(
    "keyup",
    function(e) {

        const tag =
            document.activeElement
            ?.tagName;


        if(
            tag === "INPUT"
            ||
            tag === "SELECT"
        ) {

            return;

        }


        keys[
            e.key.toLowerCase()
        ] = false;

    }
);



/* =====================================================
   TOUCHES TELEPHONE
===================================================== */

document
    .querySelectorAll(".mobileButton")
    .forEach(
        function(button) {

            const key =
                button.dataset.key;



            function press(e) {

                e.preventDefault();

                keys[key] =
                    true;

            }



            function release(e) {

                e.preventDefault();

                keys[key] =
                    false;

            }



            button.addEventListener(
                "touchstart",
                press,
                {
                    passive: false
                }
            );


            button.addEventListener(
                "touchend",
                release,
                {
                    passive: false
                }
            );


            button.addEventListener(
                "touchcancel",
                release,
                {
                    passive: false
                }
            );


            button.addEventListener(
                "mousedown",
                press
            );


            button.addEventListener(
                "mouseup",
                release
            );


            button.addEventListener(
                "mouseleave",
                release
            );

        }
    );



/* =====================================================
   DÉPLACEMENT
===================================================== */

function movePlayer() {

    if(!gameRunning) {

        return;

    }


    let dx = 0;

    let dy = 0;



    if(

        keys["arrowright"]
        ||
        keys["d"]

    ) {

        dx +=
            player.speed;

    }



    if(

        keys["arrowleft"]
        ||
        keys["q"]
        ||
        keys["a"]

    ) {

        dx -=
            player.speed;

    }



    if(

        keys["arrowdown"]
        ||
        keys["s"]

    ) {

        dy +=
            player.speed;

    }



    if(

        keys["arrowup"]
        ||
        keys["z"]
        ||
        keys["w"]

    ) {

        dy -=
            player.speed;

    }



    /*
       Évite que la diagonale
       soit trop rapide.
    */

    if(
        dx !== 0 &&
        dy !== 0
    ) {

        dx *= 0.7071;

        dy *= 0.7071;

    }



    const oldX =
        player.x;


    const oldY =
        player.y;



    player.x += dx;

    player.y += dy;



    for(
        const wall of walls
    ) {

        if(
            isColliding(
                player,
                wall
            )
        ) {

            player.x =
                oldX;

            player.y =
                oldY;


            lose(
                t("wall")
            );


            return;

        }

    }

}



/* =====================================================
   ROBOTS
===================================================== */

function updateRobots() {

    if(!gameRunning) {

        return;

    }


    for(
        const robot of robots
    ) {

        if(
            robot.horizontal
        ) {

            robot.x +=
                robot.direction *
                robot.speed;


            if(

                robot.x < 25

                ||

                robot.x >
                canvas.width - 30

            ) {

                robot.direction *=
                    -1;

            }

        }


        else {

            robot.y +=
                robot.direction *
                robot.speed;


            if(

                robot.y < 25

                ||

                robot.y >
                canvas.height - 30

            ) {

                robot.direction *=
                    -1;

            }

        }



        const r = {

            x:
                robot.x,

            y:
                robot.y,

            w:
                robot.size,

            h:
                robot.size

        };



        if(
            isColliding(
                player,
                r
            )
        ) {

            lose(
                t("robotHit")
            );


            return;

        }

    }

}



/* =====================================================
   SORTIE
===================================================== */

function checkExit() {

    if(!gameRunning) {

        return;

    }


    const e = {

        x:
            exit.x,

        y:
            exit.y,

        w:
            exit.size,

        h:
            exit.size

    };


    if(
        isColliding(
            player,
            e
        )
    ) {

        levelComplete();

    }

}



/* =====================================================
   NIVEAU TERMINÉ
===================================================== */

function levelComplete() {

    /*
       Le joueur qui réussit
       garde son tour.
    */

    const gain =
        Math.max(
            1,
            5 -
            Math.floor(
                (level - 1) / 5
            )
        );


    scores[currentPlayer] +=
        gain;



    /*
       Niveau 23 terminé.
    */

    if(
        level >= MAX_LEVEL
    ) {

        winGame();

        return;

    }



    /*
       Le même joueur continue
       au niveau suivant.
    */

    level++;


    loadLevel();

}



/* =====================================================
   PERTE
===================================================== */

function lose(reason) {

    if(!gameRunning) {

        return;

    }



    const penalty =
        Math.min(
            6,
            2 +
            Math.floor(
                level / 5
            )
        );


    scores[currentPlayer] =
        Math.max(
            0,
            scores[currentPlayer] -
            penalty
        );


    gameRunning =
        false;



    /* =================================================
       SOLO
    ================================================= */

    if(
        mode === "solo"
    ) {

        messageTitle.textContent =
            t("lose");


        messageText.textContent =
            reason +
            "\n-" +
            penalty +
            " points";


        messageButton.textContent =
            t("restart");


        messageButton.onclick =
            restartLevel;


        message.style.display =
            "flex";


        updateInterface();


        return;

    }



    /* =================================================
       DUO

       Le joueur change.

       Le niveau ne change PAS.

       Le deuxième joueur joue donc
       le même niveau.
    ================================================= */

    const lostPlayer =
        names[currentPlayer];


    currentPlayer =
        currentPlayer === 0
        ? 1
        : 0;



    messageTitle.textContent =
        "💥 " +
        lostPlayer +
        " a perdu !";


    messageText.textContent =

        reason +

        "\n-" +
        penalty +
        " points" +

        "\n\n" +

        t("switchDuo")
            .replace(
                "%PLAYER%",
                names[currentPlayer]
            );


    messageButton.textContent =
        t("continue");


    messageButton.onclick =
        continueDuoTurn;


    message.style.display =
        "flex";


    updateInterface();

}



/* =====================================================
   TOUR SUIVANT EN DUO
===================================================== */

function continueDuoTurn() {

    message.style.display =
        "none";


    gameRunning =
        true;


    /*
       Le niveau reste le même.

       Le nouveau joueur commence
       une nouvelle tentative.
    */

    loadLevel();

}



/* =====================================================
   RECOMMENCER
===================================================== */

function restartLevel() {

    message.style.display =
        "none";


    gameRunning =
        true;


    loadLevel();

}



/* =====================================================
   VICTOIRE
===================================================== */

function winGame() {

    gameRunning =
        false;



    if(
        mode === "duo"
    ) {

        messageTitle.textContent =
            "🏆 VICTOIRE !";


        messageText.textContent =

            names[currentPlayer] +
            " a terminé les 23 niveaux !" +

            "\n\nScore : " +

            scores[currentPlayer];

    }


    else {

        messageTitle.textContent =
            t("win");


        messageText.textContent =

            t("winText") +

            "\n\nScore : " +

            scores[0];

    }



    messageButton.textContent =
        t("play");


    messageButton.onclick =
        function() {

            location.reload();

        };


    message.style.display =
        "flex";

}



/* =====================================================
   INTERFACE
===================================================== */

function updateInterface() {

    levelText.textContent =
        level;


    scoreText.textContent =
        scores[currentPlayer];


    playerNameText.textContent =
        names[currentPlayer] || "-";


    playerSpeedText.textContent =
        player.speed;


    robotSpeedText.textContent =

        (
            0.65 +
            level *
            0.12
        ).toFixed(1);



    if(
        mode === "duo"
    ) {

        turnInfo.textContent =

            t("turn") +
            " " +
            names[currentPlayer];

    }


    else {

        turnInfo.textContent =
            "";

    }

}



/* =====================================================
   DESSIN
===================================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );



    /* FOND */

    ctx.fillStyle =
        "#222";


    ctx.fillRect(

        0,
        0,

        canvas.width,
        canvas.height

    );



    /* MURS */

    ctx.fillStyle =
        "#eeeeee";


    for(
        const wall of walls
    ) {

        ctx.fillRect(

            wall.x,
            wall.y,

            wall.w,
            wall.h

        );

    }



    /* SORTIE */

    ctx.fillStyle =
        "#00ff66";


    ctx.fillRect(

        exit.x,
        exit.y,

        exit.size,
        exit.size

    );



    /* ROBOTS */

    for(
        const robot of robots
    ) {

        ctx.fillStyle =
            "#ff3030";


        ctx.fillRect(

            robot.x,
            robot.y,

            robot.size,
            robot.size

        );


        /*
           Yeux
        */

        ctx.fillStyle =
            "white";


        const eyeSize =
            Math.max(
                2,
                robot.size *
                0.18
            );


        ctx.fillRect(

            robot.x +
            robot.size *
            0.20,

            robot.y +
            robot.size *
            0.20,

            eyeSize,
            eyeSize

        );


        ctx.fillRect(

            robot.x +
            robot.size *
            0.62,

            robot.y +
            robot.size *
            0.20,

            eyeSize,
            eyeSize

        );

    }



    /* JOUEUR */

    ctx.fillStyle =
        "#3498ff";


    ctx.fillRect(

        player.x,
        player.y,

        player.size,
        player.size

    );

}



/* =====================================================
   BOUCLE DU JEU
===================================================== */

function gameLoop() {

    if(gameRunning) {

        movePlayer();

        updateRobots();

        checkExit();

    }


    draw();


    requestAnimationFrame(
        gameLoop
    );

}



/* =====================================================
   CHARGEMENT DU NIVEAU
===================================================== */

function loadLevel() {

    generateMaze(level);

    updateInterface();

}



/* =====================================================
   DÉMARRAGE
===================================================== */

applyLanguage();

gameLoop();

</script>
